l_english:
 # NR: Devout soft bribe - funds for the church's needs (negotiation option 1)
 nr_devout_softbribe_option: "Allocate funds for the church's needs."
 nr_devout_softbribe_patronage: "Patrons of the Poor"
 nr_devout_softbribe_tt: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] will not accept gifts, but will support us if the state allocates funds for the church's needs. In a week we will decide where the money goes, which sets the effects and final cost."
 nr_devout_softbribe.1.t: "The Church's Needs"
 nr_devout_softbribe_expenses: "Church Subsidy Expenses"
 nr_devout_softbribe_parish_burden: "Burden on the Parishes"
 nr_devout_softbribe.1.a: "Let the sermons praise the church's generosity."
 nr_devout_softbribe.1.b: "Call the flock to asceticism."
 nr_devout_softbribe.1.c: "Bring enlightenment to the lost."
 nr_devout_softbribe.1.d: "Open hospitals run by the Sisters of Mercy."
 nr_devout_softbribe.1.e: "Open shelters for newcomers."
 nr_devout_softbribe.1.g: "Let the parishes bear the cost."
 nr_devout_softbribe_propaganda_tt: "Pulpits and pamphlets praise the generosity of the church and the wisdom of the state. Nothing changes beyond the campaign's base effects."
 nr_devout_softbribe_base: "Church Subsidies"
 nr_devout_softbribe_asceticism: "Sermons of Asceticism"
 nr_devout_softbribe_enlightenment: "Enlightening the Lost"
 nr_devout_softbribe_sisters: "Sisters of Mercy"
 nr_devout_softbribe_shelters: "Shelters for Newcomers"
 nr_devout_softbribe_chaplains: "Army Chaplains"
 nr_devout_softbribe_parish: "Parish Charity"
 nr_devout_softbribe.1.desc: "We promised to allocate funds for the church's needs, and [SCOPE.sCharacter('ig_leader').GetFullName] expects us to keep our word. Where the money goes is for us to decide."
 nr_devout_softbribe.1.flavor: "“Faith without works is dead.” James 2:26"
 nr_devout_softbribe.1.f: "Send chaplains to the army."
 nr_devout_softbribe_parish_shame: "A State That Cannot Feed Its Own"
 nr_devout_softbribe_lore_propaganda: "#lore From the pulpit the vicar reads out a letter from the minister: the state remembers the poor. The parishioners listen with half an ear, but they remember who was generous this time.#!"
 nr_devout_softbribe_lore_asceticism: "#lore \"He who is content with little is rich.\" Preachers teach the flock to eat plainer, live humbler and set bread aside for hard days. No one grows fuller, but the grumbling grows quieter.#!"
 nr_devout_softbribe_lore_enlightenment: "#lore In a village half a day's walk from the nearest school, a class opens beside the church. Children learn their letters from the Psalter, and their parents hear a sermon in a language they understand for the first time. This was how [Concept('concept_nr_parish_education', 'parish education')] began.#!"
 nr_devout_softbribe_lore_sisters: "#lore In white caps and grey habits they walk between the cots without asking who lies there - soldier, beggar or unbeliever. So worked the [Concept('concept_nr_sisters_of_mercy', 'Sisters of Mercy')] from Dublin to Sevastopol.#!"
 nr_devout_softbribe_lore_shelters: "#lore At the pier the newcomers are met not by a customs officer but by a nun with a list: name, place of origin, any family here. The parish will find them a corner, work and a place on the pew, and their grandchildren will speak the language of this country.#!"
 nr_devout_softbribe_lore_chaplains: "#lore The regimental priest walks among the tents before dawn. He does not promise victory - only that no one will die alone. So served the [Concept('concept_nr_chaplains', 'chaplains')] of every army of the century.#!"
 nr_devout_softbribe_lore_parish: "#lore The treasury is empty and the bishop spreads his hands: the parishes will manage. They will - but only their own will get bread from church hands, and the rest will remember that the state abandoned them. This is what [Concept('concept_nr_church_charity', 'church charity')] looks like when the treasury does not pay.#!"
 concept_nr_chaplains: "Chaplains"
 concept_nr_chaplains_desc: "Military priests followed armies long before the 19th century, but it was then that chaplaincy became part of military organisation. In Britain the Army Chaplains' Department was created by Royal Warrant on 23 September 1796; before that, chaplains belonged to individual regiments. At first only Anglican clergy served, Presbyterians were recognised in 1827, and Roman Catholics were recruited from 1836. The chaplain held services, heard confession, buried the dead and wrote to their families - and was often the only man in the regiment who gave the soldiers no orders."
 concept_nr_sisters_of_mercy: "Sisters of Mercy"
 concept_nr_sisters_of_mercy_desc: "Communities of women who cared for the sick and the poor. In France the Daughters of Charity of Vincent de Paul and Louise de Marillac worked from 1633; in Dublin Catherine McAuley founded the Sisters of Mercy in 1831. In Saint Petersburg the Holy Trinity community worked from 1844, and in 1854, at the initiative of the surgeon Nikolay Pirogov and with the support of Grand Duchess Elena Pavlovna, the Holy Cross community was founded: over a hundred of its sisters served in the hospitals of the Crimean War. Their experience shaped modern nursing and the Red Cross."
 concept_nr_church_charity: "Church Charity"
 concept_nr_church_charity_desc: "Before state welfare, help for the poor in most countries came through the church: parish relief funds, soup kitchens, shelters and almshouses. In 1833 in Paris the student Frédéric Ozanam and his friends founded the Society of Saint Vincent de Paul, which soon spread across the Catholic world. Church relief was close to the people and cheap for the treasury, but it often depended on the parish - and on the faith of those in need."
 concept_nr_parish_education: "Parish Education"
 concept_nr_parish_education_desc: "For millions of 19th-century children the first school was a church classroom. In England, from 1811 the National Society opened schools for the poor in the principles of the Established Church; in Catholic countries teaching congregations such as the Brothers of the Christian Schools ran schools; and missions carried literacy - and faith - into the colonies. Such schools taught reading, writing and arithmetic, but above all the catechism."
 nr_devout_softbribe.1.h: "Send missions to the colonies."
 nr_devout_softbribe_lore_missions: "#lore The steamer sails south, and among the officials and merchants on deck stand men in travelling cassocks. Each carries a Bible, a primer and a medicine chest. They will learn the local tongue before the governor does and stay on when the governor leaves. So went the [Concept('concept_nr_missions', 'missions')] across the world.#!"
 nr_devout_softbribe_missions_tt: "Every year for #v 10#! years, #v 3%#! of the not-yet-converted pops of every state of our colonies and chartered companies will convert to our religion. Colonies with a different state religion will see this as pressure from the metropole."
 nr_devout_softbribe_mission_pressure: "Missionary Pressure"
 concept_nr_missions: "Missions"
 concept_nr_missions_desc: "The 19th century was an age of mass missionary work: preachers of many churches followed traders and soldiers into the colonies. In 1868 the Archbishop of Algiers, Charles Lavigerie, founded the Society of Missionaries of Africa - the “White Fathers”, named for their white robes in the local style. He required them to speak the people's language, eat their food and wear their clothes, and in 1879 the White Fathers reached Buganda. Missions opened schools, hospitals and orphanages, yet for many colonised peoples conversion remained part of foreign rule."
