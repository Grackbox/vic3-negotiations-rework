l_english:
 # NR: the Landowners' places in the provinces (feature landowners_offices)
 nr_landowners_offices.1.elections: "Noble Elections."
 nr_landowners_offices_lore_elections: "#lore Every three years the nobility of the province elects its marshal, its judges and its guardians. [Concept('concept_nr_noble_elections', 'The noble assembly')] gives the estates a voice the crown must hear.#!"
 concept_nr_noble_elections: "Noble Elections"
 concept_nr_noble_elections_desc: "In Russia after 1785 and in much of Central Europe the nobility of each province met in assemblies, elected its marshals and filled local offices from its own ranks. The state saved on officials; the provinces were run by the people who owned them."
 nr_landowners_offices.1.patrimonial: "Patrimonial Courts."
 nr_landowners_offices_lore_patrimonial: "#lore The lord of the manor sits in judgement over his own peasants. [Concept('concept_nr_patrimonial', 'Patrimonial justice')] is cheap for the state - and the peasants know whose court it is.#!"
 concept_nr_patrimonial: "Patrimonial Justice"
 concept_nr_patrimonial_desc: "In Prussia the lords of the manor held their own courts over their peasants until 1849; in Russia the landowner judged and punished his serfs until 1861. Justice cost the treasury nothing, and every quarrel over land was settled by one of its parties."
 nr_landowners_offices_patrimonial: "Patrimonial Courts"
 nr_landowners_offices.1.justices: "Justices of the Peace."
 nr_landowners_offices_lore_justices: "#lore The county squire keeps the peace without a salary. [Concept('concept_nr_justices', 'The justices of the peace')] are gentlemen first and magistrates second.#!"
 concept_nr_justices: "Justices of the Peace"
 concept_nr_justices_desc: "In England the unpaid justices of the peace, chosen from the landed gentry, ran the counties: they judged petty cases, set poor rates and licensed alehouses. The system lasted until elected county councils took over in 1888."
 nr_landowners_offices_justices: "Justices of the Peace"
 nr_landowners_offices.1.constabulary: "Estate Constabulary."
 nr_landowners_offices_lore_constabulary: "#lore The constable answers to the manor house, not to the ministry. [Concept('concept_nr_constabulary', 'The estate police')] keeps the countryside quiet - and the villages know who pays it.#!"
 concept_nr_constabulary: "Estate Police"
 concept_nr_constabulary_desc: "In the Prussian countryside the lord of the manor held police power over his estate until 1872; the Russian district police chief was elected by the local nobility until 1862. Order in the villages was kept by those whose fields surrounded them."
 nr_landowners_offices_constabulary: "Estate Constabulary"
 nr_landowners_offices.1.assemblies: "Provincial Assemblies."
 nr_landowners_offices_lore_assemblies: "#lore The estates meet, vote the roads and the schools, and send their men to every board. [Concept('concept_nr_assemblies', 'Provincial self-government')] is a school of politics - for the nobility.#!"
 concept_nr_assemblies: "Provincial Self-Government"
 concept_nr_assemblies_desc: "The Russian zemstvos of 1864 and the Prussian district diets gave local self-government to the provinces, but voting by estate or by property left the nobility the majority in most assemblies. Roads, schools and doctors appeared; so did the influence of the manor."
 nr_landowners_offices_assemblies: "Provincial Assemblies"
 nr_landowners_offices.1.tax_farming: "Tax Farming."
 nr_landowners_offices_lore_tax_farming: "#lore The estate collects the state's taxes from its villages and keeps a share for its trouble. [Concept('concept_nr_tax_farming', 'Collection through the estates')] brings money in fast - and not all of it reaches the treasury.#!"
 concept_nr_tax_farming: "Collection through the Estates"
 concept_nr_tax_farming_desc: "In Russia the landowner answered for the poll tax of his serfs; in the Ottoman Empire and much of the old world taxes were farmed out to local notables. The state saved on collectors and lost on what stuck to the collectors' hands."
 nr_landowners_offices_tax_farming: "Tax Farming"
 nr_landowners_offices.1.patrols: "Slave Patrols."
 nr_landowners_offices_lore_patrols: "#lore Mounted men ride the roads at night and ask every black man for his pass. [Concept('concept_nr_patrols', 'The patrols')] keep the plantations quiet - and the free states watch with growing anger.#!"
 concept_nr_patrols: "Slave Patrols"
 concept_nr_patrols_desc: "In the American South every white man of military age could be called to ride patrol: groups of planters and their neighbours checked passes, searched slave quarters and punished anyone found out at night. The patrols were a militia of the plantation order."
 nr_landowners_offices_patrols: "Slave Patrols"
 nr_landowners_offices.1.state_slaves: "State Slaves."
 nr_landowners_offices_lore_state_slaves: "#lore The treasury rents hands from the planters for its roads, docks and mines. [Concept('concept_nr_state_slaves', 'State slaves')] build cheaply - and die cheaply.#!"
 concept_nr_state_slaves: "State Slaves"
 concept_nr_state_slaves_desc: "Brazil kept “slaves of the nation” on state estates and public works; the Spanish crown owned the slaves of the El Cobre copper mines in Cuba until 1800; in the United States the Capitol was built partly by slaves hired from their owners. The planters earned the rent; the state got cheap labour."
 nr_landowners_offices_state_slaves: "State Slaves"
 nr_landowners_offices.1.officers: "Noble Officer Corps."
 nr_landowners_offices_lore_officers: "#lore Sons of the manor wear the epaulettes, as their fathers did. [Concept('concept_nr_officers', 'The noble officer corps')] is loyal and brave - and promotion goes by birth, not by merit.#!"
 concept_nr_officers: "Noble Officer Corps"
 concept_nr_officers_desc: "The Prussian officer corps was drawn overwhelmingly from the Junker nobility; in Britain commissions were bought until 1871. An army led by the landed class was loyal to the throne and to the estates, and slow to change."
 nr_landowners_offices_officers: "Noble Officer Corps"
 nr_landowners_offices.1.recruits: "Recruit Quotas by Estate."
 nr_landowners_offices_lore_recruits: "#lore The state asks for so many recruits per hundred souls; the manor decides whose sons go. [Concept('concept_nr_recruits', 'Recruitment through the estates')] fills the ranks - and rids the village of troublemakers.#!"
 concept_nr_recruits: "Recruitment through the Estates"
 concept_nr_recruits_desc: "Until 1874 Russia raised its soldiers by levies on the villages: the landowner chose which serfs to hand over for twenty-five years of service. It was a tool of the army and a punishment of the manor at once."
 nr_landowners_offices_recruits: "Recruit Quotas by Estate"
 nr_landowners_offices.1.naval: "Naval Cadet Corps."
 nr_landowners_offices_lore_naval: "#lore The gentry sends its younger sons to sea. [Concept('concept_nr_naval', 'Noble naval officers')] carry the flag proudly - and the merchant skippers are kept off the quarterdeck.#!"
 concept_nr_naval: "Noble Naval Officers"
 concept_nr_naval_desc: "The Russian Naval Cadet Corps took only sons of the nobility; in the Royal Navy the quarterdeck belonged to the younger sons of the gentry. A navy of gentlemen was proud and brave, and closed to men from the merchant fleet."
 nr_landowners_offices_naval: "Naval Cadet Corps"
 nr_landowners_offices.1.chancery: "Chancery Posts for Noble Sons."
 nr_landowners_offices_lore_chancery: "#lore The ministries fill with young men of good family. [Concept('concept_nr_chancery', 'Posts for the nobility')] make the state apparatus loyal - and pedigree weighs more than examinations.#!"
 concept_nr_chancery: "Posts for the Nobility"
 concept_nr_chancery_desc: "The Russian Table of Ranks of 1722 tied nobility to state service; in Prussia the district Landrat was chosen from the local nobility. The bureaucracy of the old order was staffed by the landed class and served its interests."
 nr_landowners_offices_chancery: "Chancery Posts for Noble Sons"
 nr_landowners_offices_option: "Offer the estates places in the provinces."
 nr_landowners_offices_tt: "The nobility takes local offices in the provinces: the state bureaucracy loses as much as with vanilla places in the administration, the Landowners gain political strength for 10 years. In a week they will say which posts they want; some cost the bureaucracy less, some more."
 nr_landowners_offices_base_tt: "Only the base effects: no extra posts, the bureaucracy penalty stays as it is."
 nr_landowners_offices.1.t: "Places in the Provinces"
 nr_landowners_offices.1.desc: "The marshals of the nobility have drawn up their list. The estates are ready to take on the work of the state in the provinces - on their own terms, and with their own men."
 nr_landowners_offices.1.flavor: "“The nobleman is the born guardian of the countryside.” From an address of a provincial noble assembly"
 nr_landowners_offices_benefits: "Places in the Provinces"
 nr_landowners_offices_penalty_1: "Posts Held by the Nobility"
 nr_landowners_offices_penalty_2: "Posts Held by the Nobility"
 nr_landowners_offices_penalty_3: "Posts Held by the Nobility"
 nr_landowners_offices_declined: "The Estates' Request Declined"
 nr_landowners_offices_content: "The Estates Are Content"
 nr_landowners_offices.fu.petition: "Support the estates' petition."
 nr_landowners_offices.fu.amendment: "Write it into the law."
 nr_landowners_offices.fu.decline: "Not now."
 nr_landowners_offices.fu.thanks: "The estates are thanked."
 nr_landowners_offices.fu.nothing: "There is nothing to write into law now."
