 nr_landowners_offices.31.t: "The End of the Manor Courts"
 nr_landowners_offices.31.desc_gov: "The new land law has put the peasants under the state's courts, and the Landowners' own ministers agreed. The lords no longer judge their villages."
 nr_landowners_offices.31.desc_opp: "The reformers in power have abolished the manor courts over the heads of the estates. In the manor houses they speak of the end of the old order."
 nr_landowners_offices.31.flavor: "“Patrimonial jurisdiction is abolished.” Prussian decree, 1849"
 nr_landowners_offices.31.a: "The state judges now."
 nr_landowners_offices.31.b: "The estates will have to accept it."
 nr_landowners_offices.32.t: "A State Police"
 nr_landowners_offices.32.desc_gov: "A professional police has replaced the estate constables, with the consent of the Landowners in government. The manor no longer keeps order in the villages."
 nr_landowners_offices.32.desc_opp: "The government has put the countryside under a state police over the protests of the estates. The constables now answer to the ministry."
 nr_landowners_offices.32.flavor: "“The police belongs to the state, not to the manor.” From a ministerial circular"
 nr_landowners_offices.32.a: "Order is order."
 nr_landowners_offices.32.b: "The manors have lost their guards."
 nr_landowners_offices.33.t: "One Man, One Vote"
 nr_landowners_offices.33.desc_gov: "Universal suffrage has come, and the Landowners in government voted for it. The provincial assemblies will no longer belong to the estates."
 nr_landowners_offices.33.desc_opp: "Universal suffrage has been forced through over the heads of the estates. The peasants now outvote the manor in every assembly."
 nr_landowners_offices.33.flavor: "“The peasant votes, and the squire counts the ballots in vain.” From a provincial newspaper"
 nr_landowners_offices.33.a: "The people have spoken."
 nr_landowners_offices.33.b: "The estates are outvoted."
 nr_landowners_offices.34.t: "The Collectors Dismissed"
 nr_landowners_offices.34.desc_gov: "The new tax law is collected by the state's own officials, and the Landowners' ministers agreed. The estates no longer handle the taxes."
 nr_landowners_offices.34.desc_opp: "The government has taken tax collection away from the estates over their protests. The manors lose their share."
 nr_landowners_offices.34.flavor: "“A tax collected by the state reaches the state.” From a finance minister's report"
 nr_landowners_offices.34.a: "The treasury collects its own."
 nr_landowners_offices.34.b: "The estates lose their share."
 nr_landowners_offices.35.t: "The Patrols Disbanded"
 nr_landowners_offices.35.desc_gov: "Slavery has been abolished, and the planters' own representatives signed the law. There is no one left to patrol."
 nr_landowners_offices.35.desc_opp: "Slavery has been abolished over the planters' heads. The patrols are disbanded, and on the plantations they speak openly of resistance."
 nr_landowners_offices.35.flavor: "“The roads are free at night.” From the memoirs of a freedman"
 nr_landowners_offices.35.a: "The patrols ride no more."
 nr_landowners_offices.35.b: "Let the planters rage."
 nr_landowners_offices.36.t: "The Nation's Slaves Freed"
 nr_landowners_offices.36.desc_gov: "Slavery has been abolished, and the planters' ministers agreed. The state's works will be done by paid hands."
 nr_landowners_offices.36.desc_opp: "Slavery has been abolished over the planters' heads. The rents for slave labour are gone, and the planters count their losses."
 nr_landowners_offices.36.flavor: "“The nation will no longer own men.” After the Golden Law, 1888"
 nr_landowners_offices.36.a: "The works go on with free hands."
 nr_landowners_offices.36.b: "The planters will not forgive this."
 nr_landowners_offices.37.t: "Officers from the Ranks"
 nr_landowners_offices.37.desc_gov: "The new army law opens the officer corps to all, and the Landowners in government agreed. Birth no longer decides who commands."
 nr_landowners_offices.37.desc_opp: "The new army law has been forced through over the heads of the estates. The sons of the manor must now compete with the sons of the shop."
 nr_landowners_offices.37.flavor: "“Every soldier carries a field marshal's baton in his knapsack.” Attributed to Napoleon"
 nr_landowners_offices.37.a: "Merit decides now."
 nr_landowners_offices.37.b: "The nobility loses its epaulettes."
 nr_landowners_offices.38.t: "The End of the Levies"
 nr_landowners_offices.38.desc_gov: "The new army law ends the levies from the villages, and the Landowners' ministers agreed. The manor no longer chooses who goes to war."
 nr_landowners_offices.38.desc_opp: "The levies have been abolished over the heads of the estates. The manors lose their most feared punishment."
 nr_landowners_offices.38.flavor: "“The defence of the throne and the fatherland is the sacred duty of every Russian subject.” Statute on universal military service, 1874"
 nr_landowners_offices.38.a: "Service is for all."
 nr_landowners_offices.38.b: "The manors lose a lever."
 nr_landowners_offices.39.t: "Offices by Election"
 nr_landowners_offices.39.desc_gov: "The new bureaucracy law makes offices elective, and the Landowners in government agreed. Birth no longer opens the chancery doors."
 nr_landowners_offices.39.desc_opp: "Elected officials have replaced the noble sons over the heads of the estates. The chanceries fill with strangers."
 nr_landowners_offices.39.flavor: "“An office is a trust, not an inheritance.” From a reformers' pamphlet"
 nr_landowners_offices.39.a: "Offices for the able."
 nr_landowners_offices.39.b: "The noble sons are turned out."
