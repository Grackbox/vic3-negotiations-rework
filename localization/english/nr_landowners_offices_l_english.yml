 nr_landowners_offices.11.t: "The Manor Courts"
 nr_landowners_offices.11.desc: "Ten years of patrimonial courts have passed. The Landowners ask to write the lord's justice into the land law, so that no minister can take it back."
 nr_landowners_offices_lore_11_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_patrimonial_justice').GetName] is attached to the active law.#!"
 nr_landowners_offices.12.t: "The Squires' Thanks"
 nr_landowners_offices.12.desc: "Ten years the gentry have kept the peace in the counties. They are content with the order of things."
 nr_landowners_offices_lore_12_thanks: "#lore The estates remember who trusted them.#!"
 nr_landowners_offices.13.t: "The Estate Police"
 nr_landowners_offices.13.desc: "Ten years the manors have policed the countryside. Now the Landowners want it in law: a police law, or their say in the police that exists."
 nr_landowners_offices_lore_13_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_noble_guard').GetName] is attached to the active law.#!"
 nr_landowners_offices.14.t: "The Provincial Assemblies"
 nr_landowners_offices.14.desc: "Ten years the provincial assemblies have been run by the estates. The Landowners want the same weight in the national vote."
 nr_landowners_offices_lore_14_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_noble_curia').GetName] is attached to the active law.#!"
 nr_landowners_offices.15.t: "The Collectors' Account"
 nr_landowners_offices.15.desc: "Ten years the estates have collected the taxes of their villages. The account is closed, and the Landowners are grateful for the trust."
 nr_landowners_offices_lore_15_thanks: "#lore The estates remember who trusted them.#!"
 nr_landowners_offices.16.t: "The Patrol Statute"
 nr_landowners_offices.16.desc: "Ten years the patrols have ridden the roads. The planters ask to make them a duty written in the slavery law."
 nr_landowners_offices_lore_16_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_patrol_statute').GetName] is attached to the active law.#!"
 nr_landowners_offices.17.t: "Slaves of the Nation"
 nr_landowners_offices.17.desc: "Ten years the treasury has hired slaves from the planters. The planters want the arrangement written into law."
 nr_landowners_offices_lore_17_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_state_slaves').GetName] is attached to the active law.#!"
 nr_landowners_offices.18.t: "Commissions for the Nobility"
 nr_landowners_offices.18.desc: "Ten years the officer corps has been filled from the manors. The Landowners ask to make noble commissions part of the army law."
 nr_landowners_offices_lore_18_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_noble_commissions').GetName] is attached to the active law.#!"
 nr_landowners_offices.19.t: "The Levies Delivered"
 nr_landowners_offices.19.desc: "Ten years the manors have delivered their recruits. The Landowners are grateful for the trust."
 nr_landowners_offices_lore_19_thanks: "#lore The estates remember who trusted them.#!"
 nr_landowners_offices.20.t: "The Naval Census"
 nr_landowners_offices.20.desc: "Ten years the quarterdecks have belonged to the gentry. The Landowners ask to write it into the naval law."
 nr_landowners_offices_lore_20_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_naval_census').GetName] is attached to the active law.#!"
 nr_landowners_offices.21.t: "Service by Birth"
 nr_landowners_offices.21.desc: "Ten years the chanceries have filled with noble sons. The Landowners want service by birth to become the rule."
 nr_landowners_offices_lore_21_amendment: "#lore [GetAmendmentType('amendment_nr_landowners_service_census').GetName] is attached to the active law.#!"
 amendment_nr_landowners_patrimonial_justice: "Patrimonial Justice"
 amendment_nr_landowners_patrimonial_justice_desc: "The lord of the manor judges his peasants in petty cases. The state saves on local courts; the peasants live worse."
 amendment_nr_landowners_noble_guard: "Noble Guard"
 amendment_nr_landowners_noble_guard_desc: "The local police is commanded by men of the manor. It costs the state less, the estates gain influence, the villages lose it."
 amendment_nr_landowners_noble_curia: "Noble Curia"
 amendment_nr_landowners_noble_curia_desc: "The landed nobility votes in its own curia with extra weight. The estates grow stronger; the liberals grow louder."
 amendment_nr_landowners_patrol_statute: "Patrol Statute"
 amendment_nr_landowners_patrol_statute_desc: "Patrol duty is written into the slavery law. Slave revolts are harder to start; abolitionists gain supporters."
 amendment_nr_landowners_state_slaves: "Slaves of the Nation"
 amendment_nr_landowners_state_slaves_desc: "The state hires slaves from the planters for its works. Construction goes faster; abolitionists gain supporters."
 amendment_nr_landowners_noble_commissions: "Noble Commissions"
 amendment_nr_landowners_noble_commissions_desc: "Officers serve for honour rather than pay. The army is cheaper and the officers more powerful; merit counts for less."
 amendment_nr_landowners_naval_census: "Naval Census"
 amendment_nr_landowners_naval_census_desc: "Naval commissions are reserved for the gentry. The fleet is cheaper to keep and prouder to show."
 amendment_nr_landowners_service_census: "Service Census"
 amendment_nr_landowners_service_census_desc: "State posts go first to the nobility. The bureaucracy is cheaper to run; the universities lose influence."
 nr_landowners_police_petition_tt: "The Landowners will file a petition: for #v 4#! years the enactment of [GetLawType('law_local_police').GetName] goes #v 25%#! faster and the Landowners support it. If the law is not passed in that time they will be offended: #r −2#! approval for 5 years."
