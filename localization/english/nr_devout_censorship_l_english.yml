l_english:
 # NR: follow-up of the Censorship Committees form (feature devout_censorship)
 nr_devout_censorship.2.t: "The Red Pencil"
 nr_devout_censorship.2.desc: "For ten years the church's committees have read what our printers print. Now the bishops come to the ministry: the committees have done what they could, and the rest is for the state to decide."
 nr_devout_censorship.2.flavor: "“A book can be burned once, but a forbidden book is read a thousand times.” Attributed to a censor of the old school"
 nr_devout_censorship.2.a: "Hear the petition for state censorship."
 nr_devout_censorship.2.c: "The press stays free of the altar."
 nr_devout_censorship.2.d: "The state has taken up the pencil."
 nr_devout_censorship.2.e: "Close."
 nr_devout_censorship_lore_2a: "#lore The committees can only advise: the printer who ignores them risks nothing but a sermon. The bishops ask for a law that gives the red pencil the force of the state - the way [Concept('concept_nr_spiritual_censorship', 'spiritual censorship')] once worked.#!"
 nr_devout_censorship_petition_tt: "The clergy will submit a petition: for #v 4#! years the enactment of Censorship goes #v 25%#! faster, and the Devout support it while it is enacted. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_censorship_lore_2c: "#lore The minister thanks the bishops for their zeal and explains that the government has no intention of licensing every pamphlet. The committees may keep reading - but they will no longer be heard.#!"
 nr_devout_censorship_lore_2d: "#lore What the committees began, the state now does itself: every book passes the censor before it reaches the shop. The bishops have nothing left to ask for - only thanks to give.#!"
 je_nr_devout_censorship_petition: "Clergy Petition: Censorship"
 je_nr_devout_censorship_petition_reason: "The clergy ask the state to take up censorship. If we pass Censorship in the coming years it will go faster; if not, the church will feel unheard."
 je_nr_devout_censorship_petition_status_enacting: "Censorship is being enacted: #g +25%#! enactment speed."
 je_nr_devout_censorship_petition_status_waiting: "Start enacting Censorship to get #v +25%#! enactment speed."
 nr_devout_censorship_petition_speed: "Backed by the Clergy"
 nr_devout_censorship_petition_ignored: "Clergy Petition Ignored"
 nr_devout_censorship_declined: "Censorship Refused to the Church"
 nr_devout_censorship_content: "The State Took Up Censorship"
