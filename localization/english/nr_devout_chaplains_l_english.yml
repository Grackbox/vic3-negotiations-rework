l_english:
 # NR: Army Chaplains (feature devout_chaplains)
 nr_devout_chaplains.1.t: "Chaplains in the Army"
 nr_devout_chaplains.1.desc: "As the professional army law is debated, the clergy demand the right to serve in the regiments. The bishops speak of the soldiers' souls, the generals of discipline and regulations. It falls to us to decide whose voice carries."
 nr_devout_chaplains.1.flavor: "“He who confessed before battle will not run.” From a regimental priest's sermon"
 nr_devout_chaplains.1.a: "The army serves the regulations, not the altar."
 nr_devout_chaplains.1.b: "A chaplain in every regiment."
 nr_devout_chaplains.1.c: "Let the officers' assembly decide."
 nr_devout_chaplains_lore_1a: "#lore The general taps the regulations: not a word about prayer services. The army is order, and order needs no go-between for soldier and commander.#!"
 nr_devout_chaplains_lore_1b: "#lore Every regiment will have its own priest to hold services before the march and bury the fallen after battle. The law will pass more slowly, but [Concept('concept_nr_chaplains', 'chaplains')] will become part of the army.#!"
 nr_devout_chaplains_lore_1c: "#lore The officers gather at their club, argue past midnight and decide as they always have: faith is a private matter, service a common one. The church will remember that no one asked it.#!"
 nr_devout_chaplains.2.t: "Keep the Chaplains?"
 nr_devout_chaplains.2.desc: "The campaign has run its course, but the regimental priests have stayed with their units. The soldiers have grown used to them and the commanders have made their peace. Now their place can be written into the professional army law - or they can be sent back to their parishes."
 nr_devout_chaplains.2.flavor: "“He gave no orders, but they listened to him.” From a soldier's letter home"
 nr_devout_chaplains.2.a: "Write the chaplains into the army law."
 nr_devout_chaplains.2.b: "That is enough."
 nr_devout_chaplains_lore_2a: "#lore An order from the Minister of War: the post of regimental priest enters the establishment tables. [Concept('concept_nr_chaplains', 'Chaplains')] are no longer guests in the army but part of it.#!"
 nr_devout_chaplains_lore_2b: "#lore The priests bid farewell to their regiments and return to their parishes. Some of the soldiers will keep writing to them.#!"
 amendment_nr_devout_chaplains: "Army Chaplains"
 amendment_nr_devout_chaplains_desc: "Regimental clergy become part of the army: priests lift the soldiers' spirits, but the church gains a voice in the barracks and drill slows down."
 nr_devout_chaplains_regulations: "Regulations Before the Altar"
 nr_devout_chaplains_debate: "The Chaplaincy Debate"
 nr_devout_chaplains_rejected: "Church Kept Out of the Army"
 nr_devout_chaplains_officers_trusted: "Trust in the Officers' Assembly"
