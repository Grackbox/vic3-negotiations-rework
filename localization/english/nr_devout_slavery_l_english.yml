l_english:
 # NR: The Church and the Slaves follow-up (feature devout_slavery)
 nr_devout_slavery.1.t: "Baptism and the Chain"
 nr_devout_slavery.1.desc: "As the slavery law is debated, the clergy raise an old question: can a Christian own a Christian? The bishops propose a clause - no slave of the state faith. The landowners hear only one thing: their property is about to be baptised away."
 nr_devout_slavery.1.flavor: "“Baptism does not alter the condition of the person as to his bondage or freedom.” Virginia law of 1667"
 nr_devout_slavery.1.a: "A slave is a slave, whatever his faith."
 nr_devout_slavery.1.b: "The baptised cannot be a slave."
 nr_devout_slavery.1.c: "Let the landowners decide."
 nr_devout_slavery_lore_1a: "#lore The law will count heads, not souls. It passes faster without the clause - and the church remembers who put property above baptism.#!"
 nr_devout_slavery_lore_1b: "#lore No one may hold in bondage one who shares his faith: [Concept('concept_nr_fellow_believers', 'fellow believers')] go free. The landowners will stall the debate.#!"
 nr_devout_slavery_lore_1c: "#lore The planters are asked whether baptism should free a slave. The answer is known before the question is finished - and the church remembers who was asked instead of it.#!"
 nr_devout_slavery_free_on_law_tt: "When the law is enacted with this amendment, all slaves of the state religion are freed, and then every year those who convert."
 nr_devout_slavery.2.t: "Brothers in Chains"
 nr_devout_slavery.2.desc: "For ten years our priests have baptised and married slaves. Now the bishops come with a question the plantations would rather not hear: what does it mean for a man to be a brother in Christ and a thing in law?"
 nr_devout_slavery.2.flavor: "“You cannot own one with whom you share the chalice.” From a sermon"
 nr_devout_slavery.2.a: "Hear the petition to abolish slavery."
 nr_devout_slavery.2.b: "Do not enslave fellow believers."
 nr_devout_slavery.2.c: "The church keeps to souls, the state to property."
 nr_devout_slavery.2.e: "Close."
 nr_devout_slavery_lore_2a: "#lore The bishops no longer ask for kinder masters. They ask for no masters at all: [Concept('concept_nr_church_and_slavery', 'the church and slavery')] has run its course.#!"
 nr_devout_slavery_petition_tt: "The clergy will submit a petition: for #v 4#! years the enactment of [GetLawType('law_slavery_banned').GetName] goes #v 25%#! faster, and the Devout support it while it is enacted. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_slavery_lore_2b: "#lore Slavery stays, but not for [Concept('concept_nr_fellow_believers', 'fellow believers')]: whoever shares the state faith cannot be held in bondage.#!"
 nr_devout_slavery_free_tt: "All slaves of the state religion are freed at once: those on farms, plantations and ranches or without work become #v peasants#!, the rest #v laborers#!. Every year the amendment frees those who convert and calms the abolitionist movement."
 nr_devout_slavery_lore_2c: "#lore The minister reminds the bishops that the state protects property and the church saves souls. The priests go back to the plantations to baptise and marry - and to wait.#!"
 je_nr_devout_slavery_petition: "Clergy Petition: Abolition"
 je_nr_devout_slavery_petition_reason: "The clergy ask for slavery to be abolished. If we pass [GetLawType('law_slavery_banned').GetName] in the coming years it will go faster; if not, the church will feel unheard."
 je_nr_devout_slavery_petition_status_enacting: "[GetLawType('law_slavery_banned').GetName] is being enacted: #g +25%#! enactment speed."
 je_nr_devout_slavery_petition_status_waiting: "Start enacting [GetLawType('law_slavery_banned').GetName] to get #v +25%#! enactment speed."
 amendment_nr_devout_fellow_believers: "Do Not Enslave Fellow Believers"
 amendment_nr_devout_fellow_believers_desc: "While in force: #v once a year all slaves of the state religion are freed#! - those on farms, plantations and ranches or without work become #v peasants#!, the rest #v laborers#! - and the abolitionist movement gets #g -0.25#! radicalism for a year. The first freeing happens as soon as the amendment takes effect.\n\nNo one of the state faith may be held as a slave: the abolitionists are calmed but grow in number, the landowners resent it, and checking every slave burdens the administration."
 nr_devout_slavery_abolitionists_calmed: "The Church Frees Its Own"
 nr_devout_slavery_petition_speed: "Backed by the Clergy"
 nr_devout_slavery_petition_ignored: "Clergy Petition Ignored"
 nr_devout_slavery_declined: "The Church Kept Out of Slavery"
 nr_devout_slavery_faith_irrelevant: "Property Above Baptism"
 nr_devout_slavery_debate: "The Baptism Debate"
 nr_devout_slavery_rejected: "Fellow Believers Left in Chains"
 nr_devout_slavery_landowners_heard: "The Landowners Were Heard"
 concept_nr_fellow_believers: "Fellow Believers"
 concept_nr_fellow_believers_desc: "Can a believer own a believer? The question followed slavery wherever the church went. In the English colonies planters feared that baptism would bring freedom, and in 1667 Virginia settled it by law: baptism did not alter a slave's bondage. Islamic law had given its own answer long before: a free Muslim could not be enslaved, though a slave who converted remained a slave. In 1839 Pope Gregory XVI condemned the slave trade in the bull In supremo apostolatus, and from Rome to the English evangelicals the same question was asked ever more loudly: how can a brother in faith be property?"
