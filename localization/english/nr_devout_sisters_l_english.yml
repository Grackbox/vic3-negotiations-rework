l_english:
 # NR: Sisters of Mercy (feature devout_sisters)
 nr_devout_sisters.2.t: "Sisters in the Hospitals"
 nr_devout_sisters.2.desc: "For ten years our money has gone to the nursing orders: the sisters washed the floors, changed the dressings and sat with those who had no family left. Now their superior asks whether the sisters may serve in the state infirmaries."
 nr_devout_sisters.2.flavor: "“She asked for neither name nor faith - only where it hurt.” From a regimental doctor's memoirs"
 nr_devout_sisters.2.a: "Send the sisters to the state hospitals."
 nr_devout_sisters.2.d: "The hospitals are already in church hands."
 nr_devout_sisters.2.c: "Thank them and see them off."
 nr_devout_sisters_lore_2a: "#lore One line is added to the infirmary statutes: nursing is entrusted to the order. The [Concept('concept_nr_sisters_of_mercy', 'Sisters of Mercy')] agree to serve for board and lodging, but on their terms: their own statutes, their own mother superior and the church's word in the admission ward. The state infirmary cedes some of its authority, and a prayer book will lie beside the medicine at every bedside.#!"
 nr_devout_sisters_lore_2d: "#lore The mother superior nods: the hospitals already rest on the orders, and nothing needs changing. She leaves without asking for wages or thanks.#!"
 nr_devout_sisters_lore_2c: "#lore The minister thanks the order for its years of service and signs a decree hiring paid nurses. The sisters go back to their own wards at the church shelters - and in the state infirmaries there is still no one to keep the night watch.#!"
 amendment_nr_devout_sisters: "Sisters of Mercy in the Hospitals"
 amendment_nr_devout_sisters_desc: "Nursing in state infirmaries is entrusted to religious orders: maternity homes raise the birth rate, field hospitals spare the army casualties, and the sisters' fame works as influence abroad. But the orders bring their own statutes and their own superiors: the health system needs more bureaucracy, the state cedes some of its authority, and the Devout grow stronger."
 nr_devout_sisters_declined: "Orders Removed from the Hospitals"
 nr_devout_sisters_content: "Hospitals in Church Hands"
 nr_devout_sisters.2.b: "Hear the petition for charity hospitals."
 nr_devout_sisters_lore_2b: "#lore The mother superior asks not for wages but for a law: let the hospitals for the poor become church hospitals, with the treasury merely helping. The orders have done this for centuries - [Concept('concept_nr_church_charity', 'church charity')] already feeds and heals those the ministry never reaches.#!"
 nr_devout_sisters_petition_tt: "The orders will submit a petition: for #v 4#! years the enactment of [GetLawType('law_charitable_health_system').GetName] goes #v 25%#! faster. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 je_nr_devout_sisters_petition: "Order Petition: Charity Hospitals"
 je_nr_devout_sisters_petition_reason: "The sisters ask for the hospitals for the poor to be given to the church. If we pass [GetLawType('law_charitable_health_system').GetName] in the coming years it will go faster; if not, the orders will feel unheard."
 je_nr_devout_sisters_petition_status_enacting: "[GetLawType('law_charitable_health_system').GetName] is being enacted: #g +25%#! enactment speed."
 je_nr_devout_sisters_petition_status_waiting: "Start enacting [GetLawType('law_charitable_health_system').GetName] to get #v +25%#! enactment speed."
 nr_devout_sisters_petition_speed: "Backed by the Orders"
 nr_devout_sisters_petition_ignored: "Order Petition Ignored"
 nr_devout_sisters.2.e: "Close."
