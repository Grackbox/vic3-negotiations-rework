l_english:
 # NR: police follow-up (feature devout_police)
 nr_devout_police.2.t: "Keepers of Order"
 nr_devout_police.2.desc: "For ten years the church has cared for our prisons. The chaplains have learned how order is kept, and the bishops now ask for a place in it - not only behind the prison walls, but in the police itself."
 nr_devout_police.2.flavor: "“The constable keeps the peace of the street, the priest the peace of the soul - and the second is the cheaper.” From a pastoral letter"
 nr_devout_police.2.a: "Hear the petition for a police force."
 nr_devout_police.2.b: "Let the parishes choose the constables."
 nr_devout_police.2.c: "A chaplain in every prison."
 nr_devout_police.2.d: "Give the gendarmerie its chaplains."
 nr_devout_police.2.f: "The police serve the state alone."
 nr_devout_police.2.e: "Close."
 nr_devout_police_lore_2a: "#lore We have prisons and chaplains, but no police to bring anyone to them. The bishops ask for a police force - the one their leader believes in.#!"
 nr_devout_police_petition_tt_1: "The clergy will petition for #v $law_local_police$#!: for #v 4#! years its enactment goes #v 25%#! faster, and the Devout support it while it is enacted. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_police_petition_tt_2: "The clergy will petition for #v $law_dedicated_police$#!: for #v 4#! years its enactment goes #v 25%#! faster, and the Devout support it while it is enacted. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_police_petition_tt_3: "The clergy will petition for #v $law_militarized_police$#!: for #v 4#! years its enactment goes #v 25%#! faster, and the Devout support it while it is enacted. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_police_lore_2b: "#lore The constable knows everyone by sight: he christened their children in the same church where he was married himself. So worked the [Concept('concept_nr_parish_constables', 'parish constables')].#!"
 nr_devout_police_lore_2c: "#lore The chaplain comes to the cell before the investigator and leaves after the warder. The [Concept('concept_nr_prison_chaplaincy', 'prison chaplaincy')] becomes part of the police law.#!"
 nr_devout_police_lore_2d: "#lore “Prudent without weakness, firm without violence”: so wrote the Duke of Ahumada, and the corps chaplain added to the regulations what the regulations lacked. Such are the [Concept('concept_nr_gendarmerie_chaplains', 'gendarmerie chaplains')].#!"
 nr_devout_police_lore_2f: "#lore The minister thanks the bishops for their care of the prisoners. The police, however, will answer to the ministry alone - and the chaplains will stay behind the prison walls.#!"
 je_nr_devout_police_petition: "Clergy Petition: Police"
 je_nr_devout_police_petition_reason: "The clergy ask for a police force. If we pass the police law they asked for in the coming years it will go faster; if not, the church will feel unheard."
 je_nr_devout_police_petition_status_enacting_1: "$law_local_police$ is being enacted: #g +25%#! enactment speed."
 je_nr_devout_police_petition_status_enacting_2: "$law_dedicated_police$ is being enacted: #g +25%#! enactment speed."
 je_nr_devout_police_petition_status_enacting_3: "$law_militarized_police$ is being enacted: #g +25%#! enactment speed."
 je_nr_devout_police_petition_status_waiting_1: "Start enacting $law_local_police$ to get #v +25%#! enactment speed."
 je_nr_devout_police_petition_status_waiting_2: "Start enacting $law_dedicated_police$ to get #v +25%#! enactment speed."
 je_nr_devout_police_petition_status_waiting_3: "Start enacting $law_militarized_police$ to get #v +25%#! enactment speed."
 amendment_nr_devout_parish_constables: "Parish Constables"
 amendment_nr_devout_parish_constables_desc: "The parish, not the squire, chooses the local constable: order is kept by people who know everyone by sight, and the church gains weight in every village."
 amendment_nr_devout_prison_chaplaincy: "Prison Chaplaincy"
 amendment_nr_devout_prison_chaplaincy_desc: "Every prison has its chaplain: agitators are brought to repentance rather than made martyrs, though solitude breaks some of them."
 amendment_nr_devout_gendarmerie_chaplains: "Gendarmerie Chaplains"
 amendment_nr_devout_gendarmerie_chaplains_desc: "The militarized police are placed under the spiritual care of military chaplains, with a patron saint and a moral code: the corps is harsher on disorder than on the crowd, and a poor tool for a coup."
 nr_devout_police_petition_speed: "Backed by the Clergy"
 nr_devout_police_petition_ignored: "Clergy Petition Ignored"
 nr_devout_police_declined: "The Church Kept Out of the Police"
 concept_nr_parish_constables: "Parish Constables"
 concept_nr_parish_constables_desc: "For centuries English constables were chosen by the parish vestry or the manorial court: an unpaid neighbour kept the peace of the village. The County Police Act of 1839 and the County and Borough Police Act of 1856 replaced them with professional county forces."
 concept_nr_prison_chaplaincy: "Prison Chaplaincy"
 concept_nr_prison_chaplaincy_desc: "The English Gaols Act of 1823, part of Robert Peel's prison reform, required a chaplain in every county gaol. In Russia the Prison Care Society, founded in 1819, built churches in the prisons."
 concept_nr_gendarmerie_chaplains: "Gendarmerie Chaplains"
 concept_nr_gendarmerie_chaplains_desc: "Spain's Guardia Civil, founded in 1844, received its moral code - the Cartilla of the Duke of Ahumada - in 1845: the guard must be "prudent without weakness, firm without violence". As a military corps it was cared for by the military clergy, and in 1913 the Virgin of the Pillar was declared its patroness. In the Papal States Pius VII established the papal carabinieri as a military police in 1816, later renamed the papal gendarmerie."
 je_nr_devout_police_petition_complete_tt: "The police law the clergy asked for is in force."
