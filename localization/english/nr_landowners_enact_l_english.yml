l_english:
 # NR: enactment events of the Landowners' amendments
 nr_landowners_enact.1.t: "The Estates and the Tax Roll"
 nr_landowners_enact.1.desc: "While the new tax law is debated, the Landowners' deputies propose an article of their own: the estates should keep paying a lower rate on their fields and plantations, as they always have. The treasury counts the loss; the marshals of the nobility count on gratitude."
 nr_landowners_enact.1.flavor: "“The nobleman serves the throne with his sword, the burgher with his purse.” From a speech in a chamber of lords"
 nr_landowners_enact.1.a: "The law is the same for everyone."
 nr_landowners_enact.1.b: "Keep the old privilege."
 nr_landowners_enact.1.c: "Let the taxpayers decide."
 nr_landowners_enact_lore_1a: "#lore Without the article the law will pass faster - but the estates will remember who refused them.#!"
 nr_landowners_enact_lore_1b: "#lore [Concept('concept_nr_noble_tax_exemption', 'The estates keep their privilege')] and the law says so plainly. The debate will drag on.#!"
 nr_landowners_enact_lore_1c: "#lore The shopkeepers and clerks pay their taxes in full and see no reason why the estates should not. The Landowners will remember who was asked instead of them.#!"
 nr_landowners_enact.2.t: "Bread and Duties"
 nr_landowners_enact.2.desc: "Protection for the factories is being debated, and the Landowners want the same protection for their grain: a duty on foreign wheat. It keeps the price of the harvest up - and the price of bread as well."
 nr_landowners_enact.2.flavor: "“Who pays the duty on corn? The man who eats the bread.” From a leaflet of the Anti-Corn Law League"
 nr_landowners_enact.2.a: "Protect the factories, not the fields."
 nr_landowners_enact.2.b: "Grain is national labour too."
 nr_landowners_enact.2.c: "Let the industrialists decide."
 nr_landowners_enact_lore_2a: "#lore Without the grain duty the tariff will pass faster - but the estates will remember who refused them.#!"
 nr_landowners_enact_lore_2b: "#lore The alliance of rye and iron: [Concept('concept_nr_corn_laws', 'duties on foreign grain')] enter the tariff next to the duties on foreign goods. The debate will drag on.#!"
 nr_landowners_enact_lore_2c: "#lore The mill owners pay wages, and wages follow the price of bread. They know what they will answer. The Landowners will remember who was asked instead of them.#!"
 nr_landowners_enact.3.t: "Credit for the Estates"
 nr_landowners_enact.3.desc: "The new economic course is being debated, and the Landowners ask for a land bank backed by the state: cheap loans against the estates, repaid over decades."
 nr_landowners_enact.3.flavor: "“An estate without credit is a fortress without powder.” From a memorandum of a provincial marshal of the nobility"
 nr_landowners_enact.3.a: "The state is not the estates' banker."
 nr_landowners_enact.3.b: "Credit for the land."
 nr_landowners_enact.3.c: "Let the industrialists decide."
 nr_landowners_enact_lore_3a: "#lore Without the bank the law will pass faster - but the estates will remember who refused them.#!"
 nr_landowners_enact_lore_3b: "#lore [Concept('concept_nr_land_bank', 'A noble land bank')] lends to the estates at a rate no private bank would offer. The debate will drag on.#!"
 nr_landowners_enact_lore_3c: "#lore The industrialists borrow at the market rate and would rather the state lent to factories. The Landowners will remember who was asked instead of them.#!"
 nr_landowners_enact.4.t: "The Corvee Statute"
 nr_landowners_enact.4.desc: "Bondage is being written into law, and the Landowners want every obligation spelled out: how many days the peasant owes the manor, and what happens if he fails to appear."
 nr_landowners_enact.4.flavor: "“Three days for the master, three days for himself, the seventh for God.” After the manifesto on the three-day corvee, 1797"
 nr_landowners_enact.4.a: "Custom is enough."
 nr_landowners_enact.4.b: "Write every day into the statute."
 nr_landowners_enact.4.c: "Let the village speak."
 nr_landowners_enact_lore_4a: "#lore Without the statute the law will pass faster - but the estates will remember who refused them.#!"
 nr_landowners_enact_lore_4b: "#lore [Concept('concept_nr_corvee', 'The corvee')] becomes a written duty, enforced by the state rather than by the steward. The debate will drag on.#!"
 nr_landowners_enact_lore_4c: "#lore The village elders are asked what they owe and answer: less. The Landowners will remember who was asked instead of them.#!"
 nr_landowners_enact.5.t: "Returning the Runaways"
 nr_landowners_enact.5.desc: "As the slavery law is debated, the planters demand an article obliging officials and citizens alike to help return runaway slaves to their owners."
 nr_landowners_enact.5.flavor: "“The law has made every free man a slave catcher.” From an abolitionist newspaper, 1850"
 nr_landowners_enact.5.a: "Officials will not hunt men."
 nr_landowners_enact.5.b: "Property is property."
 nr_landowners_enact.5.c: "Let the educated public judge."
 nr_landowners_enact_lore_5a: "#lore Without the article the law will pass faster - but the planters will remember who refused them.#!"
 nr_landowners_enact_lore_5b: "#lore [Concept('concept_nr_fugitive_slaves', 'The return of fugitives')] becomes the duty of every official. The debate will drag on.#!"
 nr_landowners_enact_lore_5c: "#lore The newspapers and the universities are asked, and their answer is known in advance. The planters will remember who was asked instead of them.#!"
 nr_landowners_enact.6.t: "Open Harbours"
 nr_landowners_enact.6.desc: "While the slave trade law is debated, the planters ask for the last restrictions on imports to be lifted: quotas, duties, inspections of the ships."
 nr_landowners_enact.6.flavor: "“No plantation holds without fresh hands.” From a petition of planters"
 nr_landowners_enact.6.a: "The trade stays under control."
 nr_landowners_enact.6.b: "Open the harbours."
 nr_landowners_enact.6.c: "Let the educated public judge."
 nr_landowners_enact_lore_6a: "#lore Without the article the law will pass faster - but the planters will remember who refused them.#!"
 nr_landowners_enact_lore_6b: "#lore [Concept('concept_nr_slave_import', 'The slave ships')] unload without quotas or inspections. The debate will drag on.#!"
 nr_landowners_enact_lore_6c: "#lore The newspapers and the universities are asked, and their answer is known in advance. The planters will remember who was asked instead of them.#!"
