l_english:
 # NR: Devout schools (feature devout_schools)
 nr_devout_schools.2.t: "Lessons of Enlightenment"
 nr_devout_schools.2.desc: "For ten years our money has gone to parish classes and mission schools. Now the clergy come with an offer: the church has learned how to teach, and it has something to offer the state."
 nr_devout_schools.2.flavor: "“Letters first, then prayers - or the other way round, but always both.” From a village teacher's notes"
 nr_devout_schools.2.a: "Hear the petition for religious schools."
 nr_devout_schools.2.b: "Entrust the public schools to the church."
 nr_devout_schools.2.c: "No, thank you."
 nr_devout_schools_lore_2a: "#lore The bishops ask for little: let the schools for all become church schools. They know how it is done - [Concept('concept_nr_parish_education', 'parish education')] is already at work.#!"
 nr_devout_schools_petition_tt: "The clergy will submit a petition: for #v 4#! years the enactment of Religious Schools goes #v 25%#! faster. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_schools_lore_2b: "#lore The campaign gave us experience the ministry never had: how to teach thousands of children at once, where to find teachers and how to feed them. The public school will stay public, but the church will build it.#!"
 nr_devout_schools_lore_2c: "#lore The minister thanks the bishop for his efforts and sees him to the door. Education will remain the treasury's business - and no one doubts that the church will remember.#!"
 je_nr_devout_schools_petition: "Clergy Petition: Religious Schools"
 je_nr_devout_schools_petition_reason: "The clergy ask for the schools to be given to the church. If we pass Religious Schools in the coming years it will go faster; if not, the church will feel unheard."
 je_nr_devout_schools_petition_status_enacting: "Religious Schools is being enacted: #g +25%#! enactment speed."
 je_nr_devout_schools_petition_status_waiting: "Start enacting Religious Schools to get #v +25%#! enactment speed."
 nr_devout_schools_petition_speed: "Backed by the Clergy"
 nr_devout_schools_petition_ignored: "Clergy Petition Ignored"
 nr_devout_schools_declined: "Schools Refused to the Church"
 nr_devout_schools.2.d: "The schools are already in good hands."
 nr_devout_schools_lore_2d: "#lore The bishop smiles: the church already teaches this country's children, and a prayer before lessons surprises no one any more. He has nothing to ask for - only thanks to give.#!"
 nr_devout_schools_content: "Schools in Church Hands"
 nr_devout_schools.2.e: "Close."
