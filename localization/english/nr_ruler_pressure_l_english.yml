l_english:
 # NR: the ruler presses the group, election promise, authority cost (features ruler_pressure, election_promise)
 negotiation.1.nr_pressure: "[ROOT.GetCountry.GetCustom('NR_PressureLine')]"
 negotiation.1.nr_election_promise: "At the next election, the government will stand behind your party."
 nr_ruler_pressure_option_monarch: "The Crown demands your support."
 nr_ruler_pressure_option_theocrat: "The Holy See expects obedience."
 nr_ruler_pressure_option_autocrat: "This is an order."
 nr_ruler_pressure_option_oligarchs: "Let us settle this among ourselves."
 nr_ruler_pressure_option_technocrats: "The Commission has already decided."
 nr_ruler_pressure_lore_monarch: "#lore “Suprema lex regis voluntas” - the will of the king is the highest law. Wilhelm II, in the Golden Book of Munich, 1891#!"
 nr_ruler_pressure_lore_theocrat: "#lore “Tradition? I am tradition.” Pius IX, 1870#!"
 nr_ruler_pressure_lore_autocrat: "#lore “Pan o palo” - bread or the stick. The rule of Porfirio Díaz in three words#!"
 nr_ruler_pressure_lore_oligarchs: "#lore “Law! What do I care about the law? Ain't I got the power?” Attributed to Cornelius Vanderbilt#!"
 nr_ruler_pressure_lore_technocrats: "#lore “The government of persons is replaced by the administration of things.” Engels, after Saint-Simon, 1880#!"
 nr_ruler_pressure_no_penalty_tt: "The [SCOPE.gsInterestGroup('ig').GetName] obey without a murmur."
 nr_ruler_pressure_order_obeyed_tt: "The leader of the [SCOPE.gsInterestGroup('ig').GetName] is loyal: the order is carried out."
 nr_election_promise_lore: "#lore At the Ministry of the Interior they are already drawing up the encasillado: which seat goes to which friend of the government. The ballot boxes will only confirm it.#!"
 nr_election_promise_tt: "At the next election campaign we must back the party of the [SCOPE.gsInterestGroup('ig').GetName] in the electoral fraud event (+150% momentum). Any other choice breaks the promise."
 nr_election_promise_keeps_tt: "This keeps our promise to the [SCOPE.gsInterestGroup('nr_promised_ig').GetName]."
 nr_election_promise_breaks_tt: "This breaks our promise to the [SCOPE.gsInterestGroup('nr_promised_ig').GetName]."
 je_nr_election_promise_status_waiting: "Waiting for the next election campaign."
 je_nr_election_promise_status_campaign: "The campaign is under way: back the party of the [SCOPE.gsInterestGroup('ig').GetName] in the electoral fraud event."
 nr_election_promise_kept_cond_tt: "We backed their party at the election"
 nr_election_promise_broken_cond_tt: "We did not back their party at the election"
 nr_election_promise_free_elections_tt: "The Tradition of Free Elections forbids backing any party"
 nr_ruler_pressure_leader_disloyal: "Resents the Order"
 nr_ruler_pressure_betrayal: "Struck at His Own"
 nr_ruler_pressure_constitutional: "The Crown Meddled with Parliament"
 nr_ruler_pressure_army_loyal_monarch: "For King and Country"
 nr_ruler_pressure_army_loyal_autocrat: "The Army Obeys"
 nr_ruler_pressure_army_wary: "The Army Grumbles"
 nr_ruler_pressure_army_disloyal: "The Army Resents the Order"
 nr_ruler_pressure_own_army_loyal: "The General Against His Own"
 nr_ruler_pressure_own_autocrat_army_loyal: "The General's Own Army"
