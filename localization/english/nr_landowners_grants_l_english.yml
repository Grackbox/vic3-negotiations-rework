 concept_nr_ranks_orders: "Ranks and Orders"
 concept_nr_ranks_orders_desc: "Peter I's Table of Ranks of 1722 turned state service into a ladder to the nobility: a commoner who rose high enough became a noble, first for life, then for his descendants. Orders served the same purpose, and in the 19th century the Crown repeatedly raised the ranks required, in 1845 and again in 1856, as the flood of new nobles grew. In Britain the peerage roughly doubled between the 1780s and the 1830s through new creations."
 concept_nr_crown_lands: "Grants of Crown Lands"
 concept_nr_crown_lands_desc: "States paid their servants and supporters with land long after they stopped paying them with serfs. In the 1870s hundreds of thousands of desyatinas of Bashkir land in the Ufa and Orenburg provinces were sold for next to nothing to officials and landowners; the scandal led to a senatorial inquiry in 1881 and the resignation of the minister of state domains."
 concept_nr_noble_tax_exemption: "Tax Exemption of the Estates"
 concept_nr_noble_tax_exemption_desc: "In Prussia the knightly estates were long exempt from the land tax, a privilege of the old order that survived the reforms of the early 19th century. Only the land tax reform of 1861 made them pay like everyone else, against the bitter resistance of the Junkers."
 concept_nr_corn_laws: "Corn Laws"
 concept_nr_corn_laws_desc: "The British Corn Laws of 1815 kept foreign grain out until domestic prices were high. The Anti-Corn Law League, founded in 1838 by Richard Cobden and John Bright, made cheap bread a national cause, and in 1846 Robert Peel repealed the laws, splitting his own party. In Germany the tariff of 1879 joined the interests of the eastern estates and heavy industry - the “”."
 concept_nr_land_bank: "Noble Land Banks"
 concept_nr_land_bank_desc: "In 1770 Frederick II founded the Silesian Landschaft, a credit association of the estates that lent against land at low interest. Other Prussian provinces followed. In Russia the State Noble Land Bank, founded in 1885, lent to the nobility on terms no private bank would offer, to keep the estates in noble hands."
 concept_nr_corvee: "Corvee"
 concept_nr_corvee_desc: "Corvee was the labour a peasant owed on his lord's land. The Prussian regulation edicts of 1811 and 1816 freed peasants from it only in exchange for a third to a half of their land. In Russia the lords kept wide powers over their serfs until 1861; in 1822 they regained the right to exile them to Siberia."
 concept_nr_redemption: "Redemption Operation"
 concept_nr_redemption_desc: "When serfdom ended, someone had to pay for the land. Prussia founded Rentenbanken in 1850 that paid the lords at once and collected from the peasants over decades. In Russia after 1861 the treasury compensated the landowners, and the peasants repaid the state over 49 years - until the payments were cancelled in 1907, after the revolution of 1905."
 concept_nr_fugitive_slaves: "Fugitive Slave Laws"
 concept_nr_fugitive_slaves_desc: "The American Fugitive Slave Act of 1850 obliged officials and citizens of the free states to help return runaway slaves and denied the accused a jury trial. Meant to reassure the South, it turned many Northerners towards abolition; Uncle Tom's Cabin appeared two years later."
 concept_nr_slave_import: "The Slave Trade After Its Ban"
 concept_nr_slave_import_desc: "Brazil banned the import of slaves in 1831 under British pressure, but the law was “”: hundreds of thousands of Africans were landed illegally over the following two decades. Only the Eusebio de Queiros law of 1850, backed by the Royal Navy, finally ended the trade."
 nr_landowners_grants.21.t: "The End of the Corn Laws"
 nr_landowners_grants.21.desc_gov: "The government has opened the borders to foreign grain, and the Landowners' own ministers voted for it. The grain tariffs are gone; the estates will have to sell at the world's price."
 nr_landowners_grants.21.desc_opp: "The new government has opened the borders to foreign grain over the protests of the estates. The grain tariffs are gone, and the marshals of the nobility speak of betrayal of the land."
 nr_landowners_grants.21.flavor: "“The one who repealed the Corn Laws may call himself a statesman; his party will call him a traitor.” A Tory backbencher, 1846"
 nr_landowners_grants.21.a: "Cheap bread is worth it."
 nr_landowners_grants.21.b: "The estates will have to accept it."
 nr_landowners_grants.22.t: "The End of Corvee"
 nr_landowners_grants.22.desc_gov: "Serfdom has been abolished from above, with the consent of the nobility itself. The peasants will no longer work the lords' fields; the estates will have to hire hands like anyone else."
 nr_landowners_grants.22.desc_opp: "The reformers in power have abolished serfdom over the heads of the nobility. The corvee is gone overnight, and in the manor houses they talk about the old order as if it were a lost homeland."
 nr_landowners_grants.22.flavor: "“It is better to abolish serfdom from above than to wait until it begins to abolish itself from below.” Alexander II to the Moscow nobility, 1856"
 nr_landowners_grants.22.a: "Better from above than from below."
 nr_landowners_grants.22.b: "The old order is over."
 nr_landowners_grants.23.t: "No More Fugitives"
 nr_landowners_grants.23.desc_gov: "Slavery has been abolished, and the planters' own representatives signed the law. There is no one left to return: the patrols are disbanded."
 nr_landowners_grants.23.desc_opp: "Slavery has been abolished over the planters' heads. The patrols are disbanded, the runaways are free citizens, and on the plantations they speak openly of resistance."
 nr_landowners_grants.23.flavor: "“Slavery is declared extinct in Brazil.” The Golden Law, 1888"
 nr_landowners_grants.23.a: "The patrols are disbanded."
 nr_landowners_grants.23.b: "Let the planters rage."
 nr_landowners_grants.24.t: "The Harbours Are Closed"
 nr_landowners_grants.24.desc_gov: "The slave trade has ended, and the planters' own ministers agreed to it. The ships will no longer unload in our harbours."
 nr_landowners_grants.24.desc_opp: "The slave trade has been ended over the planters' heads. The harbours are closed to the slave ships, and the plantation owners count the hands they will never get."
 nr_landowners_grants.24.flavor: "“The trade ends not because it is forbidden, but because the ships are stopped.” After the Eusebio de Queiros law, 1850"
 nr_landowners_grants.24.a: "The trade is over."
 nr_landowners_grants.24.b: "The planters will not forgive this."
