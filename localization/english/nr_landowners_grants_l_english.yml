l_english:
 # NR: landowners' grants (feature landowners_grants)
 nr_landowners_grants_option: "Offer the estates a grant from the Crown."
 nr_landowners_grants_tt: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] would rather have a grant from the Crown than money. In a week we will decide what form it takes; until then the base expenses are charged."
 nr_landowners_grants.1.t: "Grants from the Crown"
 nr_landowners_grants.1.desc: "We promised the estates a grant rather than a purse. The marshals of the nobility have brought their wishes to the ministry, and the list is long: honours, land, privileges, credit - and, where the law still allows it, labour."
 nr_landowners_grants.1.flavor: "“Money is spent in a season; a privilege is inherited.” From a letter of a provincial marshal"
 nr_landowners_grants.1.a: "Reward them with ranks and orders."
 nr_landowners_grants.1.b: "Grant them crown lands."
 nr_landowners_grants.1.c: "Exempt the estates from the land tax."
 nr_landowners_grants.1.d: "Protect their grain with tariffs."
 nr_landowners_grants.1.e: "Open a noble land bank."
 nr_landowners_grants.1.f: "Confirm the lords' right to corvee labour."
 nr_landowners_grants.1.g: "Compensate the lords for the peasants' land."
 nr_landowners_grants.1.h: "Return runaway slaves to their owners."
 nr_landowners_grants.1.i: "Let the slave ships sail."
 nr_landowners_grants_ranks_tt: "The Crown pays in honours: the Landowners get only the base effects of the grant."
 nr_landowners_grants_lore_ranks: "#lore Land can be sold and a privilege revoked, but an order is worn to the grave and kept in the family like a relic. The Crown pays in [Concept('concept_nr_ranks_orders', 'ranks and orders')], the cheapest coin in its treasury.#!"
 nr_landowners_grants_lore_crown_lands: "#lore The surveyors draw new boundaries across the crown estates, and villages that grazed their cattle there for a century find themselves on a lord's land. So went the [Concept('concept_nr_crown_lands', 'grants of crown lands')].#!"
 nr_landowners_grants_lore_tax_exemptions: "#lore The knightly estate pays in service, not in coin - so the old privilege says, and the treasury honours it. Such is the [Concept('concept_nr_noble_tax_exemption', 'tax exemption of the estates')].#!"
 nr_landowners_grants_lore_corn_laws: "#lore Foreign grain stops at the border until bread at home becomes dear enough. The lords sell their harvest well; the towns buy their bread dear. Such were the [Concept('concept_nr_corn_laws', 'Corn Laws')].#!"
 nr_landowners_grants_lore_land_bank: "#lore The estates mortgage their land to a bank that the state guarantees, at an interest no private lender would offer. So worked the [Concept('concept_nr_land_bank', 'noble land banks')].#!"
 nr_landowners_grants_lore_corvee: "#lore Three days a week on the lord's field, the rest on his own - if the weather allows. The state confirms what the custom already demanded: [Concept('concept_nr_corvee', 'corvee')].#!"
 nr_landowners_grants_lore_redemption: "#lore The peasant is free, the land is his - once he has paid for it. The treasury pays the lord at once and collects from the peasant for decades. Such was the [Concept('concept_nr_redemption', 'redemption operation')].#!"
 nr_landowners_grants_lore_fugitives: "#lore The patrols ride the roads at night, and the courts return a runaway to his owner without asking questions. Such were the [Concept('concept_nr_fugitive_slaves', 'fugitive slave laws')].#!"
 nr_landowners_grants_lore_slave_import: "#lore The law against the trade stays on the books - for the foreign consuls. In the harbours the ships unload as before. Such was the [Concept('concept_nr_slave_import', 'slave trade after its ban')].#!"
 nr_landowners_grants.11.t: "Land and Tenants"
 nr_landowners_grants.11.desc: "Ten years after the grants of crown land the estates have grown - and so has the question of who works them. The marshals of the nobility want the law to say it plainly: the land is the lord's, the peasant rents it."
 nr_landowners_grants.11.flavor: "“A peasant with his own land is a peasant who will not come to work.” From a debate in a provincial assembly"
 nr_landowners_grants.11.a: "Hear the petition for tenancy."
 nr_landowners_grants.11.c: "The land law stays as it is."
 nr_landowners_grants.11.d: "The land is already in good hands."
 nr_landowners_grants.11.e: "Close."
 nr_landowners_grants_lore_11a: "#lore The lords ask for a law under which the peasant rents his field rather than owns it. The granted lands would be worked, and the estates would never lack hands.#!"
 nr_landowners_grants_lore_11c: "#lore The minister thanks the marshals and explains that the government is content with the land law as it stands. The estates will remember.#!"
 nr_landowners_grants_lore_11d: "#lore The lords have nothing to ask for: the land law already serves the estates, and the granted land is worked as it should be.#!"
 nr_landowners_grants.12.t: "A Privilege for Ever"
 nr_landowners_grants.12.desc: "For ten years the estates have paid no land tax. The nobility now asks to write the exemption into the tax law itself, so that no future minister of finance can take it back."
 nr_landowners_grants.12.flavor: "“The noble pays with his sword, not with his purse.” An old saying"
 nr_landowners_grants.12.a: "Write the noble privilege into the tax law."
 nr_landowners_grants.12.c: "Every estate pays its share."
 nr_landowners_grants.12.e: "Close."
 nr_landowners_grants_lore_12a: "#lore The [Concept('concept_nr_noble_tax_exemption', 'exemption of the estates')] becomes part of the tax law: the treasury collects less from the land, but the nobility stands firmly behind the throne.#!"
 nr_landowners_grants_lore_12c: "#lore The minister of finance reminds the marshals that the privilege was a favour, not a right. When it ends, the estates will pay like everyone else.#!"
 nr_landowners_grants.13.t: "Bread and Borders"
 nr_landowners_grants.13.desc: "The grain tariffs have kept the estates prosperous for ten years. The landowners want them made permanent - and, where the trade law allows foreign grain in, a trade law that does not."
 nr_landowners_grants.13.flavor: "“Cheap bread for the town means cheap land for the lord.” From a pamphlet"
 nr_landowners_grants.13.a: "Hear the petition for protectionism."
 nr_landowners_grants.13.b: "Write the grain tariff into the law."
 nr_landowners_grants.13.c: "The tariffs will not be renewed."
 nr_landowners_grants.13.e: "Close."
 nr_landowners_grants_lore_13a: "#lore The lords want more than a tariff on grain: they want the whole trade policy to protect the home market. Industry may even agree - for a tariff on iron. So began the marriage of iron and rye.#!"
 nr_landowners_grants_lore_13b: "#lore The [Concept('concept_nr_corn_laws', 'grain tariff')] becomes part of the trade law: the estates sell well, the towns pay for it.#!"
 nr_landowners_grants_lore_13c: "#lore The minister will not tax the workers' bread any longer. The lords leave the ministry without their tariff, and the liberal press celebrates.#!"
 nr_landowners_grants.14.t: "The Bank of the Estates"
 nr_landowners_grants.14.desc: "For ten years the noble land bank has lent cheaply to the estates. The nobility asks to make it a permanent institution of the state."
 nr_landowners_grants.14.flavor: "“The estate is mortgaged, but it is still ours.” A saying of the provincial gentry"
 nr_landowners_grants.14.a: "Make the noble land bank permanent."
 nr_landowners_grants.14.c: "The estates will borrow like everyone else."
 nr_landowners_grants.14.e: "Close."
 nr_landowners_grants_lore_14a: "#lore The [Concept('concept_nr_land_bank', 'noble land bank')] becomes part of the economic order: cheap credit for the estates, guaranteed by the state.#!"
 nr_landowners_grants_lore_14c: "#lore The minister of finance closes the special window. The estates will have to go to the ordinary banks - and pay ordinary interest.#!"
 nr_landowners_grants.15.t: "The Corvee Statute"
 nr_landowners_grants.15.desc: "For ten years the state has confirmed the lords' right to their peasants' labour. The nobility now asks for a statute that fixes it for good."
 nr_landowners_grants.15.flavor: "“The lord's field first, then God's, then your own.” A peasant saying"
 nr_landowners_grants.15.a: "Issue a corvee statute."
 nr_landowners_grants.15.c: "Custom will do; no statute is needed."
 nr_landowners_grants.15.e: "Close."
 nr_landowners_grants_lore_15a: "#lore The statute lists the days, the hours and the work owed to the lord. [Concept('concept_nr_corvee', 'Corvee')] is no longer a custom: it is the law.#!"
 nr_landowners_grants_lore_15c: "#lore The minister declines to put in writing what everyone knows anyway. The lords grumble; the peasants are none the wiser.#!"
 nr_landowners_grants.16.t: "The Redemption Debt"
 nr_landowners_grants.16.desc: "The treasury has compensated the lords for the peasants' land, and the peasants are paying it back. The nobility asks to make the arrangement part of the land law."
 nr_landowners_grants.16.flavor: "“We were theirs, but the land is ours” - so the peasants said. The redemption payments said otherwise."
 nr_landowners_grants.16.a: "Write the redemption payments into the land law."
 nr_landowners_grants.16.c: "The operation is over."
 nr_landowners_grants.16.d: "The estates are content."
 nr_landowners_grants_lore_16a: "#lore The [Concept('concept_nr_redemption', 'redemption payments')] become part of the land law: the peasant pays for his freedom for decades, and the estates keep their income.#!"
 nr_landowners_grants_lore_16c: "#lore The minister closes the redemption account. What was paid is paid; no further arrangement is needed.#!"
 nr_landowners_grants_lore_16d: "#lore The land law leaves no room for redemption payments, and the lords, compensated, ask for nothing more.#!"
 nr_landowners_grants.17.t: "Property on the Run"
 nr_landowners_grants.17.desc: "For ten years the state has hunted runaway slaves for their owners. The planters want the arrangement written into the slavery law."
 nr_landowners_grants.17.flavor: "“Every citizen must assist in the capture.” From a fugitive slave law"
 nr_landowners_grants.17.a: "Pass a fugitive slave law."
 nr_landowners_grants.17.c: "The state will not hunt slaves."
 nr_landowners_grants.17.e: "Close."
 nr_landowners_grants_lore_17a: "#lore Every official and every citizen must help return a runaway. The planters are satisfied - and in the free states the law makes more abolitionists than any sermon. Such were the [Concept('concept_nr_fugitive_slaves', 'fugitive slave laws')].#!"
 nr_landowners_grants_lore_17c: "#lore The minister declines: the patrols will be disbanded, and the owners will have to catch their property themselves.#!"
 nr_landowners_grants.18.t: "Open Harbours"
 nr_landowners_grants.18.desc: "For ten years the slave ships have unloaded unhindered. The planters ask to lift the last restrictions on the trade."
 nr_landowners_grants.18.flavor: "“A law for the English to see.” A Brazilian saying about the ban of 1831"
 nr_landowners_grants.18.a: "Allow free import of slaves."
 nr_landowners_grants.18.c: "The trade stays under restrictions."
 nr_landowners_grants.18.e: "Close."
 nr_landowners_grants_lore_18a: "#lore The last duties and inspections go: ships unload wherever they please. The planters are content; the abolitionists abroad and at home have one more argument. Such was the [Concept('concept_nr_slave_import', 'slave trade')].#!"
 nr_landowners_grants_lore_18c: "#lore The minister keeps the harbour inspections: the trade will go on, but not without the state's eye on it.#!"
 nr_landowners_tenant_petition_tt: "The land law: the Landowners will submit a petition: for #v 4#! years the enactment of [GetLawType('law_tenant_farmers').GetName] goes #v 25%#! faster, and the Landowners support it while it is enacted. If the law is not passed in that time, they will take offence: #r -2#! approval for 5 years."
 nr_landowners_protectionism_petition_tt: "The trade law: the Landowners will submit a petition: for #v 4#! years the enactment of [GetLawType('law_protectionism').GetName] goes #v 25%#! faster, and the Landowners support it while it is enacted. If the law is not passed in that time, they will take offence: #r -2#! approval for 5 years."
 je_nr_landowners_tenant_petition: "Landowners' Petition: Tenancy"
 je_nr_landowners_tenant_petition_reason: "The Landowners ask for a land law under which the peasant rents his land. If we pass [GetLawType('law_tenant_farmers').GetName] in the coming years it will go faster; if not, the estates will feel unheard."
 je_nr_landowners_tenant_petition_status_enacting: "[GetLawType('law_tenant_farmers').GetName] is being enacted: #g +25%#! enactment speed."
 je_nr_landowners_tenant_petition_status_waiting: "Start enacting [GetLawType('law_tenant_farmers').GetName] to get #v +25%#! enactment speed."
 je_nr_landowners_protectionism_petition: "Landowners' Petition: Protectionism"
 je_nr_landowners_protectionism_petition_reason: "The Landowners ask for a trade policy that protects the home market. If we pass [GetLawType('law_protectionism').GetName] in the coming years it will go faster; if not, the estates will feel unheard."
 je_nr_landowners_protectionism_petition_status_enacting: "[GetLawType('law_protectionism').GetName] is being enacted: #g +25%#! enactment speed."
 je_nr_landowners_protectionism_petition_status_waiting: "Start enacting [GetLawType('law_protectionism').GetName] to get #v +25%#! enactment speed."
 amendment_nr_landowners_noble_privilege: "Noble Privilege"
 amendment_nr_landowners_noble_privilege_desc: "The estates pay less tax on their farms and plantations. The treasury loses part of its revenue; in return the nobility stands firmly behind the throne and invests what it saves in its land."
 amendment_nr_landowners_grain_tariff: "Grain Tariff"
 amendment_nr_landowners_grain_tariff_desc: "Foreign grain pays a duty at the border. The estates sell their harvest well; bread is dearer in the towns, and the industrialists, who pay the wages, resent it."
 amendment_nr_landowners_land_bank: "Noble Land Bank"
 amendment_nr_landowners_land_bank_desc: "A state-guaranteed bank lends cheaply to the estates. The farms modernise faster; the state pays a little more on its own loans."
 amendment_nr_landowners_corvee_statute: "Corvee Statute"
 amendment_nr_landowners_corvee_statute_desc: "The peasants' labour owed to the lord is fixed by law. The estates produce more; the peasants live worse and listen more to those who promise them land."
 amendment_nr_landowners_fugitive_law: "Fugitive Slave Law"
 amendment_nr_landowners_fugitive_law_desc: "Officials and citizens must help return runaway slaves to their owners. The planters are strengthened; in the free states the law turns many towards abolition."
 amendment_nr_landowners_free_import: "Free Import"
 amendment_nr_landowners_free_import_desc: "The last restrictions on the slave trade are lifted: more slaves arrive and the plantations produce more. While in force, the pro-slavery movement gets #g -0.1#! radicalism every year; abolitionist support grows."
