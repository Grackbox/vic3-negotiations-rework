l_english:
 # NR: Synodal Administration (feature devout_synod)
 nr_devout_synod.2.t: "The Chief Procurator's Office"
 nr_devout_synod.2.desc: "For ten years state officials have worked in the consistories and dioceses. The church has order and money, and the ministry has a hand inside the church. The bishops now ask to make the arrangement permanent."
 nr_devout_synod.2.flavor: "“The church is governed by the Holy Spirit - and on weekdays by the chief procurator's office.” A Petersburg joke"
 nr_devout_synod.2.a: "Write the synod into the law."
 nr_devout_synod.2.b: "Let the bishops manage their own affairs."
 nr_devout_synod_lore_2a: "#lore A permanent [Concept('concept_nr_synod', 'synodal administration')]: the state keeps its officials in the church's offices, the church keeps its privileged place. Both sides get used to it, and the faithful notice.#!"
 nr_devout_synod_lore_2b: "#lore The officials go back to their ministries. The bishops will have to keep their own books again - and they will remember who took the clerks away.#!"
 amendment_nr_devout_synod: "Synodal Administration"
 amendment_nr_devout_synod_desc: "The church is governed through a state office: a lay chief procurator supervises the synod, the state gains a lever inside the church, and the church looks more and more like a government department."
 nr_devout_synod_declined: "Synod Not Written into Law"
 nr_devout_synod.1.t: "The Synod in the Law"
 nr_devout_synod.1.desc: "As the law on the state church is debated, the bishops propose to govern the church through a synod with a lay chief procurator. The church would gain order and the state a hand inside it; the intelligentsia see only a ministry in cassocks."
 nr_devout_synod.1.flavor: "“Render unto Caesar - but who keeps the minutes?” From a debate in the council of state"
 nr_devout_synod.1.a: "The church governs itself."
 nr_devout_synod.1.b: "Write the synod into the law."
 nr_devout_synod.1.c: "Let the intelligentsia decide."
 nr_devout_synod_lore_1a: "#lore The bishops will choose their own clerks and keep their own books. The law passes faster without a chancellery in it - and the church remembers who refused it.#!"
 nr_devout_synod_lore_1b: "#lore The state church gets a state office: a chief procurator, a chancellery and a place in the table of ranks. Such was [Concept('concept_nr_synod', 'synodal administration')]. The debate will take longer.#!"
 nr_devout_synod_lore_1c: "#lore The professors and journalists are asked for their opinion, and they give it at length: the church belongs in the parish, not in the ministries. The church remembers who was asked instead of it.#!"
 nr_devout_synod_self_rule: "The Church Governs Itself"
 nr_devout_synod_debate: "The Synod Debate"
 nr_devout_synod_rejected: "Synod Kept Out of the Law"
 nr_devout_synod_intelligentsia_heard: "The Intelligentsia Were Heard"
