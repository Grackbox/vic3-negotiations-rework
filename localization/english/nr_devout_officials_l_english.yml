l_english:
 # NR: Devout church officials (negotiation option 2)
 nr_devout_officials_penalty_1: "$negotiation_bureaucracy$"
 nr_devout_officials_penalty_2: "$negotiation_bureaucracy$"
 nr_devout_officials_penalty_3: "$negotiation_bureaucracy$"
 negotiation.1.nr_o2_devout: "Offer the church places in the administration."
 nr_devout_officials_tt: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] will support us if the clergy get places in the state apparatus. In a week we will decide where the church officials go: this sets the effects and the final burden on the bureaucracy."
 nr_devout_officials_benefits: "Church Offices"
 nr_devout_officials.1.t: "Places for the Clergy"
 nr_devout_officials.1.desc: "We promised the church places in the administration, and [SCOPE.sCharacter('ig_leader').GetFullName] expects us to keep our word. Where the church officials go is ours to decide."
 nr_devout_officials.1.flavor: "“Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's.” Matthew 22:21"
 nr_devout_officials.1.a: "Let them serve as advisers in the ministries."
 nr_devout_officials.1.b: "Establish spiritual censorship committees."
 nr_devout_officials.1.c: "Have the parishes keep the registers."
 nr_devout_officials.1.d: "Entrust the church with the baptism and marriage of slaves."
 nr_devout_officials.1.e: "Collect a church tax through the treasury."
 nr_devout_officials.1.f: "Give the church the care of the prisons."
 nr_devout_officials.1.g: "Entrust the church with the calendar and state celebrations."
 nr_devout_officials.1.h: "Admit seminarists to the civil service."
 nr_devout_officials.1.i: "Introduce synodal administration of the church."
 nr_devout_officials_base_tt: "Clerics get places as advisers and secretaries in various ministries. Nothing changes besides the base effects."
 nr_devout_officials_censorship: "Spiritual Censorship Committees"
 nr_devout_officials_registers: "Parish Registers"
 nr_devout_officials_slaves: "The Church and the Slaves"
 nr_devout_officials_church_tax: "Church Tax"
 nr_devout_officials_prisons: "Prison Ministry"
 nr_devout_officials_calendar: "Church Calendar"
 nr_devout_officials_seminarists: "Seminarists in the Chancelleries"
 nr_devout_officials_synod: "Synodal Administration"
 nr_devout_officials_lore_base: "#lore Every ministry has a desk for a man in a cassock: he signs no papers, but everyone knows whose opinion he carries.#!"
 nr_devout_officials_lore_censorship: "#lore Before a book reaches the shop, a monk with a red pencil reads it. So worked [Concept('concept_nr_spiritual_censorship', 'spiritual censorship')] from Rome to Saint Petersburg.#!"
 nr_devout_officials_lore_registers: "#lore Baptised, married, buried - and written down every time. The [Concept('concept_nr_parish_registers', 'parish registers')] knew more about the people than any census.#!"
 nr_devout_officials_lore_slaves: "#lore The priest writes into the baptismal book the name the master gave yesterday. Before God this man is now a brother, and what that means on earth will long torment [Concept('concept_nr_church_and_slavery', 'the churches of the New World')].#!"
 nr_devout_officials_lore_church_tax: "#lore The tax collector knocks twice: first for the treasury, then for the parish. The [Concept('concept_nr_church_tax', 'church tax')] turns the exchequer into a church till.#!"
 nr_devout_officials_lore_prisons: "#lore A solitary cell, a Bible and silence: the prisoner must be left alone with his conscience. So the [Concept('concept_nr_penitentiary', 'penitentiary system')] was conceived, and so it was cursed by those inside.#!"
 nr_devout_officials_lore_calendar: "#lore On the seventh day the factory is silent, the shops are closed, and the paper carries the sovereign's portrait on the front page. The [Concept('concept_nr_church_calendar', 'church calendar')] sets the rhythm of the whole country.#!"
 nr_devout_officials_lore_seminarists: "#lore A village priest's son, fresh from the seminary, copies a draft law in a calligraphic hand. In twenty years he will write the laws himself. So began many [Concept('concept_nr_seminarists', 'priests' sons in the civil service')].#!"
 nr_devout_officials_lore_synod: "#lore The metropolitan celebrates the liturgy, while in the next office the chief procurator decides which bishop to send to Tobolsk. Such was [Concept('concept_nr_synod', 'synodal administration')].#!"
 concept_nr_spiritual_censorship: "Spiritual Censorship"
 concept_nr_spiritual_censorship_desc: "For centuries the church watched over what the faithful read. The Catholic Index of Forbidden Books was first issued in 1559 and abolished only in 1966. In the Russian Empire theological and church writings passed a separate spiritual censorship: spiritual censorship committees worked in Saint Petersburg and Moscow, and their statute was approved in 1828. Suspicion fell not only on free thought but on anything that interpreted the faith differently from the Synod."
 concept_nr_parish_registers: "Parish Registers"
 concept_nr_parish_registers_desc: "In 1563 the Council of Trent obliged Catholic parishes to keep books of baptisms and marriages. In Russia metrical books became compulsory in 1722: one copy stayed in the parish, the other went to the consistory. The consistories also judged divorce, and until 1917 a Russian could only divorce through a church court. France handed registration to the town halls in 1792, England introduced civil registration in 1837. Where the registers stayed with the church, whoever was not baptised by it barely existed for the state: Old Believer marriages in Russia got civil registration only in 1874."
 concept_nr_church_and_slavery: "The Church and Slavery"
 concept_nr_church_and_slavery_desc: "The French Code Noir of 1685 required slaves to be baptised Catholic. In Brazil the church married slaves, and the diocesan constitutions of Bahia of 1707 recognised their right to marry. In the English colonies it was the opposite: a Virginia law of 1667 stated that baptism did not free a slave - exactly what the planters feared. Some churches blessed slavery as Christian guardianship, others fought for abolition: the Quakers, the English evangelicals led by Wilberforce. In 1839 Pope Gregory XVI condemned the slave trade."
 concept_nr_church_tax: "Church Tax"
 concept_nr_church_tax_desc: "A tax for the church collected by the state. In Germany it became part of the settlement between church and state: the Weimar Constitution of 1919 (Article 137) granted religious societies the right to levy taxes on the basis of the state tax lists. As early as 1873 Prussia allowed civil withdrawal from the church, and unwillingness to pay became one of its reasons. In England in 1836 the church tithe was converted from payment in kind into a money rent."
 concept_nr_penitentiary: "Penitentiary System"
 concept_nr_penitentiary_desc: "The word “penitentiary” comes from the Latin paenitentia, penitence. Philadelphia Quakers campaigned for prison reform from 1787, and in 1829 Eastern State Penitentiary opened with complete solitary confinement: alone with the Bible, the criminal was to repent. Dickens, who visited it in 1842, called such confinement torture. In Russia the Society for the Guardianship of Prisons worked from 1819, and churches were built at the prisons."
 concept_nr_church_calendar: "Church Calendar"
 concept_nr_church_calendar_desc: "The celebrations of the 19th century turned history into liturgy. The Millennium of Russia in 1862 was marked with prayers and a monument in Novgorod, the tercentenary of the House of Romanov in 1913 with services across the country. The church blessed royal days, jubilees and victories, and Sunday rest eventually entered labour legislation."
 concept_nr_seminarists: "Priests' Sons in the Civil Service"
 concept_nr_seminarists_desc: "In 19th-century Russia the sons of the clergy who finished the seminaries went into the civil service in large numbers: the seminaries taught Latin, rhetoric and discipline, and there were not enough parishes for everyone. The best known is Mikhail Speransky, a village priest's son and graduate of the Alexander Nevsky Seminary, who became the chief reformer under Alexander I."
 concept_nr_synod: "Synodal Administration"
 concept_nr_synod_desc: "In 1721 Peter I replaced the patriarchate with the Holy Synod, and from 1722 a lay chief procurator supervised it. Under Konstantin Pobedonostsev (1880-1905) the post became effectively a ministry. In Prussia the Evangelical Supreme Church Council was established in 1850. In the Ottoman Empire, after 1826 the office of the Sheikh ul-Islam got a permanent chancellery and became part of the state apparatus."
