 amendment_nr_industrialists_guaranteed_return: "Guaranteed Return"
 amendment_nr_industrialists_guaranteed_return_desc: "The state guarantees the dividends of the railway companies. Lines keep coming; the treasury pays more for its loans."
 nr_industrialists_lore_amendment_guaranteed_return: "#lore [GetAmendmentType('amendment_nr_industrialists_guaranteed_return').GetName] is attached to the active law.#!"
 amendment_nr_industrialists_private_arsenals: "Private Arsenals"
 amendment_nr_industrialists_private_arsenals_desc: "The army buys its weapons from private firms under long contracts. Military goods become cheaper."
 nr_industrialists_lore_amendment_private_arsenals: "#lore [GetAmendmentType('amendment_nr_industrialists_private_arsenals').GetName] is attached to the active law.#!"
 amendment_nr_industrialists_iron_tariff: "Iron Tariff"
 amendment_nr_industrialists_iron_tariff_desc: "Foreign iron and machines pay a high duty. Heavy industry grows; the lower strata and the shopkeepers pay more."
 nr_industrialists_lore_amendment_iron_tariff: "#lore [GetAmendmentType('amendment_nr_industrialists_iron_tariff').GetName] is attached to the active law.#!"
 amendment_nr_industrialists_chartered_companies: "Chartered Companies"
 amendment_nr_industrialists_chartered_companies_desc: "Companies with royal charters govern the colonies. Colonies grow faster; the world notes the methods."
 nr_industrialists_lore_amendment_chartered_companies: "#lore [GetAmendmentType('amendment_nr_industrialists_chartered_companies').GetName] is attached to the active law.#!"
 amendment_nr_industrialists_strike_law: "Strike Law"
 amendment_nr_industrialists_strike_law_desc: "Strikes are treated as conspiracy. The unions are weaker and the streets quieter - for now."
 nr_industrialists_lore_amendment_strike_law: "#lore [GetAmendmentType('amendment_nr_industrialists_strike_law').GetName] is attached to the active law.#!"
 amendment_nr_industrialists_limited_liability: "Limited Liability"
 amendment_nr_industrialists_limited_liability_desc: "Companies can be founded freely with limited liability. Firms grow and private capital builds more."
 nr_industrialists_lore_amendment_limited_liability: "#lore [GetAmendmentType('amendment_nr_industrialists_limited_liability').GetName] is attached to the active law.#!"
