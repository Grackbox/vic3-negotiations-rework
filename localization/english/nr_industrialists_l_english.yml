 nr_industrialists_enact.8.t: "The Bankers' Bank"
 nr_industrialists_enact.8.desc: "The economic course is being debated, and the Industrialists ask for the state bank to be run by bankers, not ministers."
 nr_industrialists_enact.8.flavor: "“The bank must be able to say no to the crown.” From a banker's memorandum"
 nr_industrialists_enact.8.a: "The bank serves the government."
 nr_industrialists_enact.8.b: "An independent bank."
 nr_industrialists_enact.8.c: "Let the landowners decide."
