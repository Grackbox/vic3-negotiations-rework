 nr_industrialists_enact.7.t: "Inspectors We Trust"
 nr_industrialists_enact.7.desc: "The labour law is being debated, and the Industrialists ask that the inspectors be men the owners trust."
 nr_industrialists_enact.7.flavor: "“The inspector dines with the owner and sees nothing.” From a workers' newspaper"
 nr_industrialists_enact.7.a: "The inspection answers to the state."
 nr_industrialists_enact.7.b: "Inspectors the owners trust."
 nr_industrialists_enact.7.c: "Let the unions speak."
