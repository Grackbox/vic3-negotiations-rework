 nr_industrialists_enact.6.t: "Free Incorporation"
 nr_industrialists_enact.6.desc: "The economic course is being debated, and the Industrialists ask for companies to be founded freely with limited liability."
 nr_industrialists_enact.6.flavor: "“Limited liability, unlimited ambition.” From a City pamphlet"
 nr_industrialists_enact.6.a: "Every partner answers for his debts."
 nr_industrialists_enact.6.b: "Limited liability for all."
 nr_industrialists_enact.6.c: "Let the shopkeepers decide."
