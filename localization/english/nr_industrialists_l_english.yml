 nr_industrialists_contracts.11.t: "Guaranteed Returns"
 nr_industrialists_contracts.11.desc: "Ten years the concessionaires have laid rails. The Industrialists ask to make the guarantee of returns part of the economic law."
 nr_industrialists_contracts.12.t: "Private Arsenals"
 nr_industrialists_contracts.12.desc: "Ten years the army has bought from private works. The Industrialists ask to write long contracts into the army law."
 nr_industrialists_contracts.13.t: "Walls for Industry"
 nr_industrialists_contracts.13.desc: "Ten years the iron tariff has sheltered the mills. The Industrialists want it made permanent."
 nr_industrialists_contracts.21.t: "The Walls Come Down"
 nr_industrialists_contracts.21.desc_gov: "Free trade has come, and the Industrialists' own ministers agreed. The iron tariff is gone."
 nr_industrialists_contracts.21.desc_opp: "Free trade has been forced through over the heads of the mill owners. Foreign iron floods the market."
 nr_industrialists_contracts.21.flavor: "“Free trade is the international law of the Almighty.” Richard Cobden"
 nr_industrialists_contracts.21.a: "Cheap iron for all."
 nr_industrialists_contracts.21.b: "The mill owners will not forget."
 nr_industrialists_contracts.14.t: "The Pits Deliver"
 nr_industrialists_contracts.14.desc: "Ten years the concessions have worked the seams. The owners are grateful."
 nr_industrialists_contracts.15.t: "The Charters Renewed"
 nr_industrialists_contracts.15.desc: "Ten years the chartered companies have governed their lands. The Industrialists ask to make it the rule of colonial affairs."
 nr_industrialists_contracts.22.t: "The Charters Revoked"
 nr_industrialists_contracts.22.desc_gov: "The state has given up its colonies, and the Industrialists' ministers agreed. The chartered companies lose their lands."
 nr_industrialists_contracts.22.desc_opp: "The government has abandoned the colonies over the heads of the Industrialists. The charters are worthless paper."
 nr_industrialists_contracts.22.flavor: "“The flag follows trade - and trade follows the flag home.” From a City newspaper"
 nr_industrialists_contracts.22.a: "The charters are returned."
 nr_industrialists_contracts.22.b: "The companies count their losses."
 nr_industrialists_contracts.16.t: "Order in the Mills"
 nr_industrialists_contracts.16.desc: "Ten years the strikes have been broken. The Industrialists want the law to treat strikes as conspiracy."
 nr_industrialists_contracts.23.t: "The Right to Organise"
 nr_industrialists_contracts.23.desc_gov: "The new law allows workers to organise, and the Industrialists in government agreed. The guards are dismissed."
 nr_industrialists_contracts.23.desc_opp: "The right to organise has been forced through over the heads of the owners. The unions march in the open."
 nr_industrialists_contracts.23.flavor: "“Workers of all countries, unite!” The Communist Manifesto, 1848"
 nr_industrialists_contracts.23.a: "The unions may meet."
 nr_industrialists_contracts.23.b: "The owners fear the unions."
 nr_industrialists_contracts.17.t: "The Contracts Fulfilled"
 nr_industrialists_contracts.17.desc: "Ten years the contract labourers have built and dug. The owners are grateful."
 nr_industrialists_contracts.24.t: "The Borders Close"
 nr_industrialists_contracts.24.desc_gov: "The new migration law ends the recruitment abroad, and the Industrialists' ministers agreed. The contracts will not be renewed."
 nr_industrialists_contracts.24.desc_opp: "The recruitment abroad has been banned over the heads of the owners. The mines and lines lose their hands."
 nr_industrialists_contracts.24.flavor: "“The labourer is worthy of his hire - if he is one of ours.” From a workers' meeting"
 nr_industrialists_contracts.24.a: "Work for our own."
 nr_industrialists_contracts.24.b: "The owners lose their hands."
 nr_industrialists_commissions.11.t: "Lines on the Map"
 nr_industrialists_commissions.11.desc: "Ten years the ministry has worked with the contractors. The Industrialists are grateful."
 nr_industrialists_commissions.12.t: "Inventions for Sale"
 nr_industrialists_commissions.12.desc: "Ten years the patent office has registered inventions. The manufacturers offer to buy the rights to one of the new methods."
 nr_industrialists_commissions.13.t: "Limited Liability"
 nr_industrialists_commissions.13.desc: "Ten years the commission has shaped company law. The Industrialists ask to make free incorporation part of the economic law."
 nr_industrialists_commissions.31.t: "Companies under the State"
 nr_industrialists_commissions.31.desc_gov: "The new economic law puts the companies under state or cooperative control, and the Industrialists in government agreed. The commission is dissolved."
 nr_industrialists_commissions.31.desc_opp: "The companies have been taken over the heads of their owners. The shareholders count what is left."
 nr_industrialists_commissions.31.flavor: "“Property is theft.” Pierre-Joseph Proudhon, 1840"
 nr_industrialists_commissions.31.a: "The commission is dissolved."
 nr_industrialists_commissions.31.b: "The shareholders are ruined."
 nr_industrialists_commissions.14.t: "A Mild Inspection"
 nr_industrialists_commissions.14.desc: "Ten years the inspectors have been the owners' men. The Industrialists want it written into the labour law."
 nr_industrialists_commissions.32.t: "No Inspection Needed"
 nr_industrialists_commissions.32.desc_gov: "The workers' rights law has been repealed, and the inspection with it. The Industrialists' ministers agreed."
 nr_industrialists_commissions.32.desc_opp: "The workers' rights law has been repealed over the heads of the Industrialists. Their men in the inspection lose their posts."
 nr_industrialists_commissions.32.flavor: "“There is nothing left to inspect.” From a factory inspector's last report"
 nr_industrialists_commissions.32.a: "The inspectors go home."
 nr_industrialists_commissions.32.b: "The owners lose their men."
 nr_industrialists_commissions.15.t: "Markets Abroad"
 nr_industrialists_commissions.15.desc: "Ten years the consuls have worked for the nation's trade. The Industrialists are grateful."
 nr_industrialists_commissions.16.t: "An Independent Bank"
 nr_industrialists_commissions.16.desc: "Ten years the bankers have run the state bank. They ask to make its independence part of the economic law."
 nr_industrialists_commissions.33.t: "The Bank Nationalised"
 nr_industrialists_commissions.33.desc_gov: "The command economy puts the state bank under the ministries, and the Industrialists in government agreed. The bankers leave the council."
 nr_industrialists_commissions.33.desc_opp: "The state bank has been taken from the bankers over their heads. Credit now follows the plan."
 nr_industrialists_commissions.33.flavor: "“Centralisation of credit in the hands of the state.” The Communist Manifesto, 1848"
 nr_industrialists_commissions.33.a: "Credit serves the plan."
 nr_industrialists_commissions.33.b: "The bankers are dismissed."
