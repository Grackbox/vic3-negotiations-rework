l_english:
 # NR: the Industrialists' state contracts, commissions, amendments
 nr_industrialists_contracts.1.state_order: "State Order."
 nr_industrialists_contracts_lore_state_order: "#lore The ministries place their orders with the right firms. [Concept('concept_nr_state_order', 'A state order')] keeps the mills busy and the owners grateful.#!"
 concept_nr_state_order: "State Orders"
 concept_nr_state_order_desc: "Throughout the century governments rewarded loyal manufacturers with orders for uniforms, rails, ships and guns. A contract was worth more than a bribe: it paid for years and bound the firm to the state."
 nr_industrialists_contracts.1.railway: "Railway Concession."
 nr_industrialists_contracts_lore_railway: "#lore The state grants the line and guarantees the dividend; the company lays the rails. [Concept('concept_nr_railway_concession', 'Concessions with guaranteed returns')] build railways fast - at the treasury's risk.#!"
 concept_nr_railway_concession: "Railway Concessions"
 concept_nr_railway_concession_desc: "The French railway law of 1842 and the Main Society of Russian Railways of 1857 built lines through private companies with a state guarantee of their returns. The railways came quickly; so did the bills for the guarantees."
 nr_industrialists_contracts_railway: "Railway Concession"
 nr_industrialists_contracts.1.arms: "Arms Contracts."
 nr_industrialists_contracts_lore_arms: "#lore The cannon kings take the army's orders. [Concept('concept_nr_arms_contracts', 'Private arms makers')] arm the nation - and grow rich on every war scare.#!"
 concept_nr_arms_contracts: "Private Arms Makers"
 concept_nr_arms_contracts_desc: "Krupp in Essen, Armstrong in Newcastle and the Putilov works in Petersburg grew on state orders for guns, armour and ships. The arms trade tied the great firms to the general staffs."
 nr_industrialists_contracts_arms: "Arms Contracts"
 nr_industrialists_contracts.1.iron_tariff: "Iron Tariff."
 nr_industrialists_contracts_lore_iron_tariff: "#lore Foreign iron pays at the border. [Concept('concept_nr_iron_tariff', 'The iron tariff')] shelters the young mills - and every nail costs more.#!"
 concept_nr_iron_tariff: "The Iron Tariff"
 concept_nr_iron_tariff_desc: "The German tariff of 1879 joined duties on iron to duties on grain; the American McKinley tariff of 1890 raised duties to nearly half the value of the goods. Industry grew behind the walls; consumers paid for it."
 nr_industrialists_contracts_iron_tariff: "Iron Tariff"
 nr_industrialists_contracts.1.mining: "Mining Concession."
 nr_industrialists_contracts_lore_mining: "#lore The state leases its seams and ore fields to the companies. [Concept('concept_nr_mining_concession', 'Mining concessions')] bring up the ore - and the lists of the dead from the pits.#!"
 concept_nr_mining_concession: "Mining Concessions"
 concept_nr_mining_concession_desc: "From the Donets basin to the Ruhr, states leased coal and ore fields to private companies. Output soared; shafts flooded and firedamp killed hundreds in single disasters."
 nr_industrialists_contracts_mining: "Mining Concession"
 nr_industrialists_contracts.1.charter: "Colonial Charter."
 nr_industrialists_contracts_lore_charter: "#lore A company receives a charter to govern, trade and fight. [Concept('concept_nr_colonial_charter', 'Chartered companies')] extend the flag at no cost to the treasury - and with no mercy to the natives.#!"
 concept_nr_colonial_charter: "Chartered Companies"
 concept_nr_colonial_charter_desc: "The Royal Niger Company (1886) and the British South Africa Company (1889) received royal charters to rule vast territories. The empire grew cheaply; the reports from the chartered lands shocked Europe."
 nr_industrialists_contracts_charter: "Colonial Charter"
 nr_industrialists_contracts.1.strikes: "Strike Suppression."
 nr_industrialists_contracts_lore_strikes: "#lore Private guards break the picket lines with the police's blessing. [Concept('concept_nr_strike_suppression', 'Strikebreaking')] keeps the mills running - and the anger grows under the surface.#!"
 concept_nr_strike_suppression: "Strikebreaking"
 concept_nr_strike_suppression_desc: "The British Combination Acts forbade workers' unions until 1824; in America the Pinkerton agency hired out guards against strikers, most famously at Homestead in 1892. Order in the mills was kept by force."
 nr_industrialists_contracts_strikes: "Strike Suppression"
 nr_industrialists_contracts.1.contract_labour: "Contract Labour."
 nr_industrialists_contracts_lore_contract_labour: "#lore Agents sign up labourers abroad for years of work at a fixed wage. [Concept('concept_nr_contract_labour', 'Contract labour')] builds the lines and fills the mines - and the shopkeepers complain of the newcomers.#!"
 concept_nr_contract_labour: "Contract Labour"
 concept_nr_contract_labour_desc: "Tens of thousands of Chinese labourers built the Central Pacific Railroad and Peruvian railways; Indian indentured workers went to plantations across the empire. Contract labour was cheap, hard and bitterly resented by local workers."
 nr_industrialists_contracts_contract_labour: "Contract Labour"
 nr_industrialists_commissions.1.exchange: "Exchange Committee."
 nr_industrialists_commissions_lore_exchange: "#lore The merchants and mill owners meet at the exchange and advise the ministers. [Concept('concept_nr_exchange_committee', 'The exchange committee')] speaks for the money of the nation.#!"
 concept_nr_exchange_committee: "Exchange Committees"
 concept_nr_exchange_committee_desc: "Exchange committees and chambers of commerce gave business a formal voice: they were consulted on tariffs, railways and taxes, and their members sat on government boards."
 nr_industrialists_commissions.1.ministry: "Ministry of Ways and Communications."
 nr_industrialists_commissions_lore_ministry: "#lore Engineers and contractors run the ministry that plans the lines and ports. [Concept('concept_nr_ways_ministry', 'The ministry of communications')] builds fast - where the contractors want.#!"
 concept_nr_ways_ministry: "Ministries of Communications"
 concept_nr_ways_ministry_desc: "The Russian Ministry of Ways and Communications (reorganised 1865) and the Prussian Ministry of Trade planned railways, canals and ports together with the companies that built them."
 nr_industrialists_commissions_ministry: "Ministry of Ways and Communications"
 nr_industrialists_commissions.1.patents: "Patent Office."
 nr_industrialists_commissions_lore_patents: "#lore Inventors register their machines and manufacturers buy the rights. [Concept('concept_nr_patent_office', 'The patent office')] spreads new methods quickly - and small workshops cannot keep up.#!"
 concept_nr_patent_office: "Patent Offices"
 concept_nr_patent_office_desc: "The United States Patent Office was reorganised in 1836 with examiners and a register of inventions; Germany passed its patent law in 1877. Patents turned invention into property that factories could buy."
 nr_industrialists_commissions_patents: "Patent Office"
 nr_industrialists_commissions.1.company_law: "Company Law Commission."
 nr_industrialists_commissions_lore_company_law: "#lore Lawyers of the great firms draft the new company law. [Concept('concept_nr_company_law', 'Limited companies')] gather capital from thousands of small investors.#!"
 concept_nr_company_law: "Limited Companies"
 concept_nr_company_law_desc: "The British Companies Act of 1862 and the French law of 1867 let anyone found a company with limited liability without a special charter. Capital flowed into industry; so did speculation."
 nr_industrialists_commissions_company_law: "Company Law Commission"
 nr_industrialists_commissions.1.inspection: "Factory Inspection in the Owners' Hands."
 nr_industrialists_commissions_lore_inspection: "#lore The inspectors are chosen from men the owners trust. [Concept('concept_nr_factory_inspection', 'The factory inspection')] exists on paper - and the machines run as before.#!"
 concept_nr_factory_inspection: "Factory Inspection"
 concept_nr_factory_inspection_desc: "The British Factory Act of 1833 created the first factory inspectors: four men for the whole country. For decades inspection was weak and the owners' influence over it strong."
 nr_industrialists_commissions_inspection: "Factory Inspection in the Owners' Hands"
 nr_industrialists_commissions.1.consuls: "Consular Service."
 nr_industrialists_commissions_lore_consuls: "#lore Commercial consuls open markets and report on rivals. [Concept('concept_nr_consular_service', 'The consular service')] works for the nation's trade - and for its greatest firms first.#!"
 concept_nr_consular_service: "Consular Service"
 concept_nr_consular_service_desc: "In the nineteenth century consuls became agents of commerce: they collected market reports, protected merchants and pressed foreign governments on behalf of their manufacturers."
 nr_industrialists_commissions_consuls: "Consular Service"
 nr_industrialists_commissions.1.bank: "State Bank in the Bankers' Hands."
 nr_industrialists_commissions_lore_bank: "#lore The great bankers sit on the council of the state bank. [Concept('concept_nr_state_bank', 'The state bank')] lends to industry - and prints less for the crown.#!"
 concept_nr_state_bank: "State Banks"
 concept_nr_state_bank_desc: "The Bank of England, the Banque de France (1800) and the Russian State Bank (1860) were run largely by bankers and merchants. Their credit built industry; their caution restrained the governments' printing presses."
 nr_industrialists_commissions_bank: "State Bank in the Bankers' Hands"
 nr_industrialists_contracts_option: "Offer the manufacturers state contracts."
 nr_industrialists_contracts_tt: "Instead of money the Industrialists get state contracts: the treasury pays as much as a bribe, spread over 10 years, and the Industrialists gain political strength. In a week they will say which contracts they want; some cost less, some more."
 nr_industrialists_contracts_base_tt: "Only the base effects: ordinary orders, the cost stays as it is."
 nr_industrialists_contracts.1.t: "State Contracts"
 nr_industrialists_contracts.1.desc: "The manufacturers have brought their proposals. They would rather have work than cash - work paid by the state for years to come."
 nr_industrialists_contracts.1.flavor: "“Give us orders, not alms.” From a petition of the manufacturers"
 nr_industrialists_contracts_favor: "State Contracts"
 nr_industrialists_contracts_expenses_1: "Contract Payments"
 nr_industrialists_contracts_expenses_2: "Contract Payments"
 nr_industrialists_contracts_expenses_3: "Contract Payments"
 nr_industrialists_commissions_option: "Offer the manufacturers seats in the commissions."
 nr_industrialists_commissions_tt: "The Industrialists take seats in state commissions: the bureaucracy loses as much as with vanilla places in the administration, the Industrialists gain political strength for 10 years. In a week they will say which commissions they want."
 nr_industrialists_commissions_base_tt: "Only the base effects: the bureaucracy penalty stays as it is."
 nr_industrialists_commissions.1.t: "Seats in the Commissions"
 nr_industrialists_commissions.1.desc: "The chambers of commerce have drawn up their list. The manufacturers are ready to advise the state - from inside its commissions."
 nr_industrialists_commissions.1.flavor: "“What is good for business is good for the nation.” From an address of a chamber of commerce"
 nr_industrialists_commissions_benefits: "Seats in the Commissions"
 nr_industrialists_commissions_penalty_1: "Seats Held by Business"
 nr_industrialists_commissions_penalty_2: "Seats Held by Business"
 nr_industrialists_commissions_penalty_3: "Seats Held by Business"
 nr_industrialists_declined: "The Manufacturers' Request Declined"
 nr_industrialists_content: "The Manufacturers Are Content"
 nr_industrialists_fu_petition: "Support the manufacturers' petition."
 nr_industrialists_fu_amendment: "Write it into the law."
 nr_industrialists_fu_decline: "Not now."
 nr_industrialists_fu_thanks: "The manufacturers are thanked."
 nr_industrialists_fu_nothing: "There is nothing to write into law now."
 nr_industrialists_lore_thanks: "#lore The manufacturers remember who gave them work.#!"
 nr_industrialists_enact_lore_a: "#lore Without the article the law will pass faster - but the manufacturers will remember who refused them.#!"
 nr_industrialists_enact_lore_b: "#lore The manufacturers' article enters the law. The debate will drag on.#!"
 nr_industrialists_enact_lore_c: "#lore Another group is asked instead. The manufacturers will remember who was asked instead of them.#!"
