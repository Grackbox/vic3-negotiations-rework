 nr_industrialists_enact.1.t: "A Guarantee for the Lines"
 nr_industrialists_enact.1.desc: "The economic course is being debated, and the Industrialists ask for a state guarantee of the railway companies' dividends."
 nr_industrialists_enact.1.flavor: "“The shareholder sleeps soundly - the treasury pays.” From a financial newspaper"
 nr_industrialists_enact.1.a: "No guarantees for private firms."
 nr_industrialists_enact.1.b: "Guarantee the returns."
 nr_industrialists_enact.1.c: "Let the taxpayers decide."
 nr_industrialists_enact_guaranteed_return_fast: "The Law Passes Faster"
 nr_industrialists_enact_guaranteed_return_debate: "Debate on the Manufacturers' Article"
 nr_industrialists_enact_guaranteed_return_rejected: "The Manufacturers' Article Refused"
 nr_industrialists_enact_guaranteed_return_heard: "Their Voice Was Heard"
 nr_industrialists_enact.2.t: "Guns from Private Works"
 nr_industrialists_enact.2.desc: "The army law is being debated, and the Industrialists ask for long arms contracts with private works."
 nr_industrialists_enact.2.flavor: "“The best gun is the one bought in time.” From an ordnance report"
 nr_industrialists_enact.2.a: "The arsenals stay with the state."
 nr_industrialists_enact.2.b: "Long contracts for the works."
 nr_industrialists_enact.2.c: "Let the army decide."
 nr_industrialists_enact_private_arsenals_fast: "The Law Passes Faster"
 nr_industrialists_enact_private_arsenals_debate: "Debate on the Manufacturers' Article"
 nr_industrialists_enact_private_arsenals_rejected: "The Manufacturers' Article Refused"
 nr_industrialists_enact_private_arsenals_heard: "Their Voice Was Heard"
 nr_industrialists_enact.3.t: "Duties on Iron"
 nr_industrialists_enact.3.desc: "Protection is being debated, and the Industrialists want high duties on foreign iron and machines."
 nr_industrialists_enact.3.flavor: "“Buy at home, and the money stays at home.” A protectionist slogan"
 nr_industrialists_enact.3.a: "Protect grain, not iron."
 nr_industrialists_enact.3.b: "Iron is national labour too."
 nr_industrialists_enact.3.c: "Let the shopkeepers decide."
 nr_industrialists_enact_iron_tariff_fast: "The Law Passes Faster"
 nr_industrialists_enact_iron_tariff_debate: "Debate on the Manufacturers' Article"
 nr_industrialists_enact_iron_tariff_rejected: "The Manufacturers' Article Refused"
 nr_industrialists_enact_iron_tariff_heard: "Their Voice Was Heard"
 nr_industrialists_enact.4.t: "Government by Charter"
 nr_industrialists_enact.4.desc: "The colonial law is being debated, and the Industrialists ask that chartered companies govern the new lands."
 nr_industrialists_enact.4.flavor: "“A company can go where a government cannot.” From a colonial memorandum"
 nr_industrialists_enact.4.a: "The flag governs, not the ledger."
 nr_industrialists_enact.4.b: "Charters for the companies."
 nr_industrialists_enact.4.c: "Let the educated public judge."
 nr_industrialists_enact_chartered_companies_fast: "The Law Passes Faster"
 nr_industrialists_enact_chartered_companies_debate: "Debate on the Manufacturers' Article"
 nr_industrialists_enact_chartered_companies_rejected: "The Manufacturers' Article Refused"
 nr_industrialists_enact_chartered_companies_heard: "Their Voice Was Heard"
 nr_industrialists_enact.5.t: "Strikes as Conspiracy"
 nr_industrialists_enact.5.desc: "The labour law is being debated, and the Industrialists want strikes treated as conspiracy."
 nr_industrialists_enact.5.flavor: "“A combination of workmen is a conspiracy against trade.” From a court judgment"
 nr_industrialists_enact.5.a: "A strike is not a crime."
 nr_industrialists_enact.5.b: "A strike is a conspiracy."
 nr_industrialists_enact.5.c: "Let the unions speak."
