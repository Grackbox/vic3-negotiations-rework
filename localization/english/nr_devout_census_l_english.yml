l_english:
 # NR: Clerical Census for Officials (feature devout_census)
 nr_devout_census.1.t: "Who May Serve the State?"
 nr_devout_census.1.desc: "As the law on appointed officials is debated, the clergy propose a condition: every official must be of the state faith and certified by his parish. The universities call it a return to the Middle Ages."
 nr_devout_census.1.flavor: "“First a certificate of baptism, then a diploma.” From a debate in the council of state"
 nr_devout_census.1.a: "The civil service is secular."
 nr_devout_census.1.b: "A clerical census for officials."
 nr_devout_census.1.c: "Let the universities decide."
 nr_devout_census_lore_1a: "#lore An official is chosen for his knowledge, not his confession. The law passes faster without the clause - and the church remembers who refused it.#!"
 nr_devout_census_lore_1b: "#lore The service stays appointed, but the way in goes through the parish: the [Concept('concept_nr_seminarists', 'seminarists')] get the posts, the university graduates the waiting list. The debate will take longer.#!"
 nr_devout_census_lore_1c: "#lore The professors are asked who should serve the state and answer without hesitation: their own graduates. The church remembers who was asked instead of it.#!"
 nr_devout_census.2.t: "The Seminary and the Chancellery"
 nr_devout_census.2.desc: "For ten years priests' sons have copied our laws and kept our books. The bishops now ask to make it the rule: appointed officials, and a clerical census for everyone who is appointed."
 nr_devout_census.2.flavor: "“The seminary teaches Latin, obedience and a good hand - everything a chancellery needs.” A minister's remark"
 nr_devout_census.2.a: "Hear the petition for appointed officials."
 nr_devout_census.2.b: "Introduce a clerical census for officials."
 nr_devout_census.2.c: "The service stays open to all."
 nr_devout_census.2.e: "Close."
 nr_devout_census_lore_2a: "#lore The bishops ask for appointed officials instead of inherited or elected posts - and for a clerical census for everyone appointed. The census will come with the law.#!"
 nr_devout_census_petition_tt: "The clergy will submit a petition: for #v 4#! years the enactment of Appointed Bureaucrats goes #v 25%#! faster, the Devout support it while it is enacted, and the amendment #v Clerical Census for Officials#! is attached to it #v automatically#!. If the law is not passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_census_lore_2b: "#lore The officials are already appointed; now the way into the service will go through the parish. The [Concept('concept_nr_seminarists', 'seminarists')] stay in the chancelleries for good.#!"
 nr_devout_census_lore_2c: "#lore The minister thanks the bishops: the chancelleries will take the best, whatever their faith. The seminarists will have to compete with the university men.#!"
 je_nr_devout_census_petition: "Clergy Petition: Appointed Officials"
 je_nr_devout_census_petition_reason: "The clergy ask for appointed officials, with a clerical census for everyone appointed. If we pass Appointed Bureaucrats in the coming years it will go faster and the census will be written into it; if not, the church will feel unheard."
 je_nr_devout_census_petition_status_enacting: "Appointed Bureaucrats is being enacted: #g +25%#! enactment speed."
 je_nr_devout_census_petition_status_waiting: "Start enacting Appointed Bureaucrats to get #v +25%#! enactment speed; the Clerical Census for Officials will be attached to it automatically."
 amendment_nr_devout_census: "Clerical Census for Officials"
 amendment_nr_devout_census_desc: "Only those of the state faith, certified by their parish, may be appointed to the civil service: the seminarists fill the chancelleries, and the university graduates are left waiting."
 nr_devout_census_petition_speed: "Backed by the Clergy"
 nr_devout_census_petition_ignored: "Clergy Petition Ignored"
 nr_devout_census_declined: "Clerical Census Refused"
 nr_devout_census_secular_service: "The Civil Service Is Secular"
 nr_devout_census_debate: "The Clerical Census Debate"
 nr_devout_census_rejected: "Clerical Census Kept Out of the Law"
 nr_devout_census_universities_heard: "The Universities Were Heard"
