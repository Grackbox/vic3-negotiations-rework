l_english:
 # NR: Church Tax (feature devout_church_tax)
 nr_devout_church_tax.1.t: "Who Pays the Priest?"
 nr_devout_church_tax.1.desc: "The new law takes the church out of the state. The bishops do not object - on one condition: the tax offices should keep collecting the church tax, as they do for the treasury."
 nr_devout_church_tax.1.flavor: "“Separate us from the state, but not from the tax rolls.” From a bishops' memorandum"
 nr_devout_church_tax.1.a: "The church will take care of itself."
 nr_devout_church_tax.1.b: "Keep the church's right to the tax."
 nr_devout_church_tax.1.c: "Let the taxpayers decide."
 nr_devout_church_tax_lore_1a: "#lore If the church is free, let it collect its own money. The law passes faster without the clause - and the bishops remember who left them without a salary.#!"
 nr_devout_church_tax_lore_1b: "#lore The church loses its status but keeps its income: the state tax offices collect the [Concept('concept_nr_church_tax', 'church tax')] as before. This is how the Weimar compromise worked. The debate will take longer.#!"
 nr_devout_church_tax_lore_1c: "#lore The shopkeepers and craftsmen who pay both taxes are asked for their opinion. They answer at once and unanimously - and the church remembers who was asked instead of it.#!"
 nr_devout_church_tax.2.t: "The Tax Rolls"
 nr_devout_church_tax.2.desc: "For ten years our tax offices have collected money for the church. The bishops now ask to write the arrangement into the law, so that no future government can simply end it."
 nr_devout_church_tax.2.flavor: "“The collector knocks twice: first for the king, then for the parish.” A saying"
 nr_devout_church_tax.2.a: "Guarantee the church its tax."
 nr_devout_church_tax.2.b: "Write the church tax into the law."
 nr_devout_church_tax.2.c: "The treasury is not a church till."
 nr_devout_church_tax_lore_2a: "#lore While the state church stands, the tax is not needed - the guarantee is: whatever happens between church and state, the tax offices will keep collecting for the parish.#!"
 nr_devout_church_tax_guarantee_tt: "If the country moves to #v Freedom of Conscience#! or #v Total Separation#!, the amendment #v Church Tax#! will be attached to the new law #v automatically#!: +50 authority, +1 clergy standard of living, -2% tax collection, -3% conversion."
 nr_devout_church_tax_lore_2b: "#lore The church is separated from the state but not from its tax rolls: the [Concept('concept_nr_church_tax', 'church tax')] becomes part of the law.#!"
 nr_devout_church_tax_lore_2c: "#lore The minister of finance thanks the bishops and explains that the tax offices have enough work collecting for the state. The church will have to pass the plate again.#!"
 nr_devout_church_tax.3.t: "The Church Keeps Its Tax"
 nr_devout_church_tax.3.desc: "The state is leaving the church, but the old guarantee holds: the Church Tax amendment goes into the new law. The tax offices will keep collecting for the parishes."
 nr_devout_church_tax.3.flavor: "“Promises made to the church outlive the governments that make them.” A civil servant's remark"
 nr_devout_church_tax.3.a: "A promise is a promise."
 nr_devout_church_tax_lore_3a: "#lore The Church Tax Guarantee has done its work: the [Concept('concept_nr_church_tax', 'church tax')] is written into the law being enacted.#!"
 amendment_nr_devout_church_tax_guarantee: "Church Tax Guarantee"
 amendment_nr_devout_church_tax_guarantee_desc: "The state church is promised its tax for the future. If the country moves to Freedom of Conscience or Total Separation, the Church Tax amendment will be attached to the new law automatically."
 amendment_nr_devout_church_tax: "Church Tax"
 amendment_nr_devout_church_tax_desc: "The state tax offices collect a tax for the church: the clergy are paid, but people pay twice and some leave the church to stop paying."
 nr_devout_church_tax_declined: "Church Tax Refused"
 nr_devout_church_tax_self_support: "The Church Will Support Itself"
 nr_devout_church_tax_debate: "The Church Tax Debate"
 nr_devout_church_tax_rejected: "Church Tax Kept Out of the Law"
 nr_devout_church_tax_taxpayers_heard: "The Taxpayers Were Heard"
