l_english:
 # NR: Sunday Rest (feature devout_sunday)
 nr_devout_sunday.1.t: "The Seventh Day"
 nr_devout_sunday.1.desc: "As the labour law is debated, the clergy propose a clause of their own: no work on Sundays and holy days. The trade unions are glad of an unexpected ally; the factory owners count the lost output."
 nr_devout_sunday.1.flavor: "“Six days shalt thou labour - and the mill owner would like the seventh as well.” From a Sunday sermon"
 nr_devout_sunday.1.a: "Production knows no days off."
 nr_devout_sunday.1.b: "The seventh day belongs to the Lord."
 nr_devout_sunday.1.c: "Let the industrialists decide."
 nr_devout_sunday_lore_1a: "#lore The machines do not pray, and the law will not stop them on Sundays. It passes faster without the clause - and the church remembers who refused it.#!"
 nr_devout_sunday_lore_1b: "#lore The law will guarantee [Concept('concept_nr_sunday_rest', 'Sunday rest')]: the day off belongs to the worker by law, not by the owner's grace. The debate will take longer.#!"
 nr_devout_sunday_lore_1c: "#lore The factory owners are asked for their opinion and give it in figures: one day in seven is a seventh of the output. The church remembers who was asked instead of it.#!"
 nr_devout_sunday.2.t: "A Day for the Lord"
 nr_devout_sunday.2.desc: "For ten years the church has kept the country's calendar: holidays, jubilees, days of prayer. Now the clergy ask for the most ordinary of holidays - a free Sunday for everyone who works."
 nr_devout_sunday.2.flavor: "“Rest is not idleness: it is the time the Lord keeps for the soul.” From a pastoral letter"
 nr_devout_sunday.2.a: "Hear the petition for labour regulation."
 nr_devout_sunday.2.b: "Write Sunday rest into the law."
 nr_devout_sunday.2.c: "The factories cannot stop."
 nr_devout_sunday.2.e: "Close."
 nr_devout_sunday_lore_2a: "#lore There is no labour law to put Sunday into yet. The bishops ask for one: inspectors, working hours - and then, in time, [Concept('concept_nr_sunday_rest', 'Sunday rest')].#!"
 nr_devout_sunday_petition_tt: "The clergy will submit a petition: for #v 4#! years the enactment of [GetLawType('law_regulatory_bodies').GetName] goes #v 25%#! faster, and the Devout support it while it is enacted. If no labour regulation is passed in that time, the Devout will take offence: #r -2#! approval for 5 years."
 nr_devout_sunday_lore_2b: "#lore The church and the workers' movement want the same thing here: [Concept('concept_nr_sunday_rest', 'Sunday rest')] written into the labour law.#!"
 nr_devout_sunday_lore_2c: "#lore The minister explains that the country cannot afford to stop the machines one day in seven. The clergy leave without their Sunday - and the workers hear about it from the pulpit.#!"
 je_nr_devout_sunday_petition: "Clergy Petition: Labour Regulation"
 je_nr_devout_sunday_petition_reason: "The clergy ask for a labour law, so that Sunday rest can be written into it. If we pass [GetLawType('law_regulatory_bodies').GetName] in the coming years it will go faster; if not, the church will feel unheard."
 je_nr_devout_sunday_petition_status_enacting: "[GetLawType('law_regulatory_bodies').GetName] is being enacted: #g +25%#! enactment speed."
 je_nr_devout_sunday_petition_status_waiting: "Start enacting [GetLawType('law_regulatory_bodies').GetName] to get #v +25%#! enactment speed."
 amendment_nr_devout_sunday: "Sunday Rest"
 amendment_nr_devout_sunday_desc: "Work on Sundays and holy days is forbidden by law: workers get a guaranteed day off, the factories stand still one day a week, and the church has written its day into the law."
 nr_devout_sunday_petition_speed: "Backed by the Clergy"
 nr_devout_sunday_petition_ignored: "Clergy Petition Ignored"
 nr_devout_sunday_declined: "Sunday Rest Refused"
 nr_devout_sunday_no_days_off: "Production Knows No Days Off"
 nr_devout_sunday_debate: "The Sunday Rest Debate"
 nr_devout_sunday_rejected: "Sunday Rest Kept Out of the Law"
 nr_devout_sunday_industrialists_heard: "The Industrialists Were Heard"
 concept_nr_sunday_rest: "Sunday Rest"
 concept_nr_sunday_rest_desc: "In the encyclical Rerum Novarum (1891) Pope Leo XIII demanded rest for workers on Sundays and holy days. The same year Germany's labour protection law introduced Sunday rest in industry, and in 1906 France made a weekly day of rest compulsory. On this question the church and the labour movement stood side by side."
