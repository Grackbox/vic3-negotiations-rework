l_russian:
 # NR: Devout soft bribe - funds for the church's needs (negotiation option 1)
 nr_devout_softbribe_option: "Выделить средства на нужды церкви."
 nr_devout_softbribe_patronage: "Покровительство бедным"
 nr_devout_softbribe_tt: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] не примет подарков, но поддержит нас, если государство выделит средства на нужды церкви. Через неделю мы решим, на что пойдут деньги: от этого зависят эффекты и итоговая стоимость."
 nr_devout_softbribe.1.t: "Нужды церкви"
 nr_devout_softbribe_expenses: "Расходы на нужды церкви"
 nr_devout_softbribe_parish_burden: "Бремя приходов"
 nr_devout_softbribe.1.a: "Пусть проповеди прославят щедрость церкви."
 nr_devout_softbribe.1.b: "Призвать паству к аскезе."
 nr_devout_softbribe.1.c: "Нести просвещение заблудшим."
 nr_devout_softbribe.1.d: "Открыть больницы сестёр милосердия."
 nr_devout_softbribe.1.e: "Открыть приюты для переселенцев."
 nr_devout_softbribe.1.g: "Пусть расходы несут приходы."
 nr_devout_softbribe_propaganda_tt: "С амвонов и в листовках прославляют щедрость церкви и мудрость власти. Кроме базовых эффектов кампании, ничего не меняется."
 nr_devout_softbribe_base: "Церковные субсидии"
 nr_devout_softbribe_asceticism: "Проповедь аскезы"
 nr_devout_softbribe_enlightenment: "Просвещение заблудших"
 nr_devout_softbribe_sisters: "Сёстры милосердия"
 nr_devout_softbribe_shelters: "Приюты для переселенцев"
 nr_devout_softbribe_chaplains: "Капелланы в войсках"
 nr_devout_softbribe_parish: "Приходская благотворительность"
 nr_devout_softbribe.1.desc: "Мы обещали выделить средства на нужды церкви, и [SCOPE.sCharacter('ig_leader').GetFullName] ждёт, что слово будет сдержано. Куда пойдут деньги, решать нам."
 nr_devout_softbribe.1.flavor: "«Вера без дел мертва». Послание Иакова, 2:26"
 nr_devout_softbribe.1.f: "Направить капелланов в войска."
 nr_devout_softbribe_parish_shame: "Государство, которое не кормит своих"
 nr_devout_softbribe_lore_propaganda: "#lore Настоятель читает с амвона письмо министра: государство помнит о бедных. Прихожане слушают вполуха, но запоминают, кто в этот раз оказался щедр.#!"
 nr_devout_softbribe_lore_asceticism: "#lore «Кто довольствуется малым, тот богат». Проповедники учат паству есть проще, жить скромнее и откладывать хлеб на чёрный день. Сытнее от этого не становится, но меньше становится и ропота.#!"
 nr_devout_softbribe_lore_enlightenment: "#lore В деревне, где до ближайшей школы полдня пути, при церкви открывается класс. Дети учат буквы по Псалтири, а их родители впервые слышат проповедь на понятном языке. Так начиналось [Concept('concept_nr_parish_education', 'приходское просвещение')].#!"
 nr_devout_softbribe_lore_sisters: "#lore В белых чепцах и серых платьях они проходят между койками, не спрашивая, кто перед ними — солдат, нищий или иноверец. Так работали [Concept('concept_nr_sisters_of_mercy', 'сёстры милосердия')] от Дублина до Севастополя.#!"
 nr_devout_softbribe_lore_shelters: "#lore У причала переселенцев встречает не таможенник, а монахиня со списком: имя, откуда прибыл, есть ли родня. Приход найдёт им угол, работу и место на скамье, а их внуки будут говорить на языке этой страны.#!"
 nr_devout_softbribe_lore_chaplains: "#lore Полковой священник обходит палатки перед рассветом. Он не обещает победы — только то, что никто не умрёт в одиночестве. Так служили [Concept('concept_nr_chaplains', 'капелланы')] во всех армиях века.#!"
 nr_devout_softbribe_lore_parish: "#lore Казна пуста, и епископ разводит руками: приходы справятся сами. Справятся — но хлеб из церковных рук получат только свои, а остальные запомнят, что государство их бросило. Такой бывает [Concept('concept_nr_church_charity', 'церковная благотворительность')], когда за неё не платит казна.#!"
 concept_nr_chaplains: "Капелланы"
 concept_nr_chaplains_desc: "Военные священники сопровождали армии задолго до XIX века, но именно тогда служба капелланов стала частью военного устройства. В Британии Департамент армейских капелланов был учреждён королевским указом 23 сентября 1796 года; до этого священники числились за отдельными полками. Сначала в нём служили только англиканские священники, с 1827 года признали пресвитериан, а с 1836 года начали набирать и католиков. Капеллан служил литургию, исповедовал, хоронил погибших и писал письма их семьям — и часто был единственным человеком в полку, который не отдавал солдатам приказов."
 concept_nr_sisters_of_mercy: "Сёстры милосердия"
 concept_nr_sisters_of_mercy_desc: "Женские общины, ухаживавшие за больными и бедными. Во Франции с 1633 года работали Дочери милосердия Винсента де Поля и Луизы де Марийяк, в Дублине в 1831 году Кэтрин Макоули основала орден Сестёр милосердия. В Петербурге с 1844 года действовала Свято-Троицкая община, а в 1854 году по почину хирурга Николая Пирогова и при поддержке великой княгини Елены Павловны была создана Крестовоздвиженская община: более сотни сестёр работали в госпиталях Крымской войны. Их опыт лёг в основу сестринского дела и Красного Креста."
 concept_nr_church_charity: "Церковная благотворительность"
 concept_nr_church_charity_desc: "До появления государственного социального обеспечения помощь бедным в большинстве стран шла через церковь: приходские кассы, столовые, приюты и богадельни. В 1833 году в Париже студент Фредерик Озанам с друзьями основал Общество святого Викентия де Поля, которое вскоре распространилось по всему католическому миру. Церковная помощь была близка к людям и дёшева для казны, но часто зависела от прихода — и от веры нуждающегося."
 concept_nr_parish_education: "Приходское просвещение"
 concept_nr_parish_education_desc: "Для миллионов детей XIX века первой школой был церковный класс. В Англии с 1811 года Национальное общество открывало школы для бедных в духе установленной церкви, в католических странах обучением занимались конгрегации вроде Братьев христианских школ, а миссии несли грамоту — и веру — в колонии. Такие школы учили читать, писать и считать, но прежде всего катехизису."
 nr_devout_softbribe.1.h: "Отправить миссии в колонии."
 nr_devout_softbribe_lore_missions: "#lore Пароход уходит на юг, и на палубе среди чиновников и торговцев стоят люди в дорожных рясах. У каждого — Библия, букварь и аптечка. Они выучат чужой язык раньше губернатора и останутся, когда губернатор уедет. Так шли [Concept('concept_nr_missions', 'миссии')] по всему свету.#!"
 nr_devout_softbribe_missions_tt: "Каждый год в течение #v 10#! лет #v 3%#! ещё не обращённого населения каждой области наших колоний и привилегированных компаний будет переходить в нашу религию. Колонии с другой государственной религией воспримут это как давление метрополии."
 nr_devout_softbribe_mission_pressure: "Миссионерское давление"
 concept_nr_missions: "Миссии"
 concept_nr_missions_desc: "XIX век стал временем массового миссионерства: вслед за торговцами и солдатами в колонии шли проповедники разных церквей. В 1868 году архиепископ Алжира Шарль Лавижери основал Общество миссионеров Африки — «белых отцов», прозванных так за белые одежды на местный манер. Он требовал от них говорить на языке народа, есть его пищу и носить его одежду, а в 1879 году белые отцы добрались до Буганды. Миссии открывали школы, больницы и приюты, но для многих колонизованных народов обращение оставалось частью чужой власти."
