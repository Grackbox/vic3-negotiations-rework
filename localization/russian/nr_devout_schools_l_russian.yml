l_russian:
 # NR: Devout schools (feature devout_schools)
 nr_devout_schools.2.t: "Уроки просвещения"
 nr_devout_schools.2.desc: "Десять лет наши деньги шли на приходские классы и миссионерские школы. Теперь духовенство приходит с предложением: церковь научилась учить, и ей есть что предложить государству."
 nr_devout_schools.2.flavor: "«Сначала буквы, потом молитвы — или наоборот, но непременно и то и другое». Из записок сельского учителя"
 nr_devout_schools.2.a: "Выслушать просьбу о религиозных школах."
 nr_devout_schools.2.b: "Поручить церкви государственные школы."
 nr_devout_schools.2.c: "Спасибо, не нужно."
 nr_devout_schools_lore_2a: "#lore Епископы просят немногого: пусть школы для всех станут церковными. Они знают, как это делать, — [Concept('concept_nr_parish_education', 'приходское просвещение')] уже работает.#!"
 nr_devout_schools_petition_tt: "Духовенство подаст обращение: в течение #v 4#! лет принятие закона «Религиозные школы» пойдёт на #v 25%#! быстрее. Если за это время закон не будет принят, Верующие обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_schools_lore_2b: "#lore Кампания дала нам опыт, которого не было у министерства: как учить тысячи детей сразу, где брать учителей и чем их кормить. Государственная школа останется государственной, но строить её будет церковь.#!"
 nr_devout_schools_lore_2c: "#lore Министр благодарит епископа за труды и провожает до дверей. Образование останется делом казны — и ни у кого нет сомнений, что церковь это запомнила.#!"
 je_nr_devout_schools_petition: "Обращение духовенства: религиозные школы"
 je_nr_devout_schools_petition_reason: "Духовенство просит передать школы церкви. Если в ближайшие годы мы примем закон «Религиозные школы», дело пойдёт быстрее; если нет — церковь сочтёт, что её не услышали."
 je_nr_devout_schools_petition_status_enacting: "Закон «Религиозные школы» принимается: #g +25%#! к скорости принятия."
 je_nr_devout_schools_petition_status_waiting: "Начните принимать закон «Религиозные школы», чтобы получить #v +25%#! к скорости принятия."
 nr_devout_schools_petition_speed: "Поддержка духовенства"
 nr_devout_schools_petition_ignored: "Обращение духовенства не услышано"
 nr_devout_schools_declined: "Церкви отказали в школах"
 nr_devout_schools.2.d: "Школы и так в надёжных руках."
 nr_devout_schools_lore_2d: "#lore Епископ улыбается: церковь и так учит детей этой страны, а молитва перед уроком давно никого не удивляет. Просить ему не о чем — только поблагодарить.#!"
 nr_devout_schools_content: "Школы в руках церкви"
 nr_devout_schools.2.e: "Закрыть."
