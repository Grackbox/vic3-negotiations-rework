l_russian:
 # NR: police follow-up (feature devout_police)
 nr_devout_police.2.t: "Хранители порядка"
 nr_devout_police.2.desc: "Десять лет церковь заботилась о наших тюрьмах. Капелланы узнали, как держится порядок, и теперь архиереи просят места в нём — не только за тюремными стенами, но и в самой полиции."
 nr_devout_police.2.flavor: "«Констебль бережёт покой улицы, священник — покой души, и второй обходится дешевле». Из пастырского послания"
 nr_devout_police.2.a: "Выслушать просьбу о полиции."
 nr_devout_police.2.b: "Пусть приходы выбирают констеблей."
 nr_devout_police.2.c: "Капеллан в каждой тюрьме."
 nr_devout_police.2.d: "Дать жандармерии капелланов."
 nr_devout_police.2.f: "Полиция служит только государству."
 nr_devout_police.2.e: "Закрыть."
 nr_devout_police_lore_2a: "#lore У нас есть тюрьмы и капелланы, но нет полиции, которая приводила бы в них людей. Архиереи просят учредить полицию — ту, в которую верит их лидер.#!"
 nr_devout_police_petition_tt_1: "Духовенство подаст обращение о законе #v «$law_local_police$»#!: в течение #v 4#! лет его принятие пойдёт на #v 25%#! быстрее, а клерикалы поддержат его при принятии. Если за это время закон не будет принят, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_police_petition_tt_2: "Духовенство подаст обращение о законе #v «$law_dedicated_police$»#!: в течение #v 4#! лет его принятие пойдёт на #v 25%#! быстрее, а клерикалы поддержат его при принятии. Если за это время закон не будет принят, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_police_petition_tt_3: "Духовенство подаст обращение о законе #v «$law_militarized_police$»#!: в течение #v 4#! лет его принятие пойдёт на #v 25%#! быстрее, а клерикалы поддержат его при принятии. Если за это время закон не будет принят, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_police_lore_2b: "#lore Констебль знает всех в лицо: он крестил их детей в той же церкви, где сам венчался. Так работали [Concept('concept_nr_parish_constables', 'приходские констебли')].#!"
 nr_devout_police_lore_2c: "#lore Капеллан приходит в камеру раньше следователя и уходит позже надзирателя. [Concept('concept_nr_prison_chaplaincy', 'Тюремное служение')] становится частью закона о полиции.#!"
 nr_devout_police_lore_2d: "#lore «Благоразумный без слабости, твёрдый без насилия» — так писал герцог Ахумада, а капеллан корпуса добавлял к уставу то, чего в уставе не было. Таковы [Concept('concept_nr_gendarmerie_chaplains', 'капелланы жандармерии')].#!"
 nr_devout_police_lore_2f: "#lore Министр благодарит архиереев за заботу об узниках. Полиция, однако, будет подчиняться только министерству — а капелланы останутся за тюремными стенами.#!"
 je_nr_devout_police_petition: "Обращение духовенства: полиция"
 je_nr_devout_police_petition_reason: "Духовенство просит учредить полицию. Если мы примем закон о полиции, о котором оно просило, в ближайшие годы, это пойдёт быстрее; если нет, церковь почувствует, что её не услышали."
 je_nr_devout_police_petition_status_enacting_1: "Принимается закон «$law_local_police$»: #g +25%#! к скорости принятия."
 je_nr_devout_police_petition_status_enacting_2: "Принимается закон «$law_dedicated_police$»: #g +25%#! к скорости принятия."
 je_nr_devout_police_petition_status_enacting_3: "Принимается закон «$law_militarized_police$»: #g +25%#! к скорости принятия."
 je_nr_devout_police_petition_status_waiting_1: "Начните принимать закон «$law_local_police$», чтобы получить #v +25%#! к скорости принятия."
 je_nr_devout_police_petition_status_waiting_2: "Начните принимать закон «$law_dedicated_police$», чтобы получить #v +25%#! к скорости принятия."
 je_nr_devout_police_petition_status_waiting_3: "Начните принимать закон «$law_militarized_police$», чтобы получить #v +25%#! к скорости принятия."
 amendment_nr_devout_parish_constables: "Приходские констебли"
 amendment_nr_devout_parish_constables_desc: "Местного констебля выбирает приход, а не помещик: порядок держат люди, которые знают всех в лицо, а церковь получает вес в каждой деревне."
 amendment_nr_devout_prison_chaplaincy: "Тюремное служение"
 amendment_nr_devout_prison_chaplaincy_desc: "В каждой тюрьме есть свой капеллан: агитаторов приводят к покаянию, а не делают мучениками, хотя одиночество ломает некоторых из них."
 amendment_nr_devout_gendarmerie_chaplains: "Капелланы жандармерии"
 amendment_nr_devout_gendarmerie_chaplains_desc: "Военизированная полиция находится под духовным попечением военного духовенства, со своим небесным покровителем и моральным кодексом: корпус суров к беспорядку, но не к толпе, и плохо годится как орудие переворота."
 nr_devout_police_petition_speed: "При поддержке духовенства"
 nr_devout_police_petition_ignored: "Обращение духовенства проигнорировано"
 nr_devout_police_declined: "Церковь не допущена в полицию"
 concept_nr_parish_constables: "Приходские констебли"
 concept_nr_parish_constables_desc: "Веками английских констеблей выбирал приходской совет или манориальный суд: неоплачиваемый сосед берёг покой деревни. Закон о графской полиции 1839 года и закон о полиции графств и городов 1856 года заменили их профессиональной полицией графств."
 concept_nr_prison_chaplaincy: "Тюремное служение"
 concept_nr_prison_chaplaincy_desc: "Английский закон о тюрьмах 1823 года, часть тюремной реформы Роберта Пиля, обязал держать капеллана в каждой графской тюрьме. В России основанное в 1819 году Попечительное о тюрьмах общество устраивало при тюрьмах церкви."
 concept_nr_gendarmerie_chaplains: "Капелланы жандармерии"
 concept_nr_gendarmerie_chaplains_desc: "Испанская Гражданская гвардия, основанная в 1844 году, в 1845 году получила моральный кодекс — «Картилью» герцога Ахумады: гвардеец должен быть «благоразумным без слабости, твёрдым без насилия». Как военный корпус она находилась под попечением военного духовенства, а в 1913 году её покровительницей объявили Деву дель Пилар. В Папском государстве Пий VII в 1816 году учредил папских карабинеров как военную полицию, позже переименованную в папскую жандармерию."
 je_nr_devout_police_petition_complete_tt: "Действует закон о полиции, о котором просило духовенство."
