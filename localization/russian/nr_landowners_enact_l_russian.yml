l_russian:
 # NR: enactment events of the Landowners' amendments
 nr_landowners_enact.1.t: "Имения и налоговая роспись"
 nr_landowners_enact.1.desc: "Пока обсуждается новый налоговый закон, депутаты землевладельцев предлагают свою статью: имения должны и дальше платить меньше с полей и плантаций, как было всегда. Казна подсчитывает убыток; предводители дворянства рассчитывают на благодарность."
 nr_landowners_enact.1.flavor: "«Дворянин служит престолу шпагой, горожанин — кошельком». Из речи в палате господ"
 nr_landowners_enact.1.a: "Закон один для всех."
 nr_landowners_enact.1.b: "Сохранить старую льготу."
 nr_landowners_enact.1.c: "Пусть решат налогоплательщики."
 nr_landowners_enact_lore_1a: "#lore Без этой статьи закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_1b: "#lore [Concept('concept_nr_noble_tax_exemption', 'Имения сохраняют льготу')], и закон говорит об этом прямо. Прения затянутся.#!"
 nr_landowners_enact_lore_1c: "#lore Лавочники и конторщики платят налоги сполна и не видят, почему имения должны платить меньше. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact.2.t: "Хлеб и пошлины"
 nr_landowners_enact.2.desc: "Обсуждается защита для фабрик, и землевладельцы хотят такой же защиты для своего зерна: пошлины на чужую пшеницу. Она держит цену урожая — и цену хлеба тоже."
 nr_landowners_enact.2.flavor: "«Кто платит пошлину на хлеб? Тот, кто его ест». Из листовки Лиги против хлебных законов"
 nr_landowners_enact.2.a: "Защищать фабрики, а не поля."
 nr_landowners_enact.2.b: "Зерно — тоже отечественный труд."
 nr_landowners_enact.2.c: "Пусть решат промышленники."
 nr_landowners_enact_lore_2a: "#lore Без хлебной пошлины тариф пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_2b: "#lore Союз ржи и железа: [Concept('concept_nr_corn_laws', 'пошлины на чужое зерно')] входят в тариф рядом с пошлинами на чужие товары. Прения затянутся.#!"
 nr_landowners_enact_lore_2c: "#lore Фабриканты платят жалованье, а жалованье идёт за ценой хлеба. Они знают, что ответят. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact.3.t: "Кредит для имений"
 nr_landowners_enact.3.desc: "Обсуждается новый экономический курс, и землевладельцы просят земельный банк под поручительство государства: дешёвые ссуды под залог имений на десятилетия."
 nr_landowners_enact.3.flavor: "«Имение без кредита — что крепость без пороха». Из записки губернского предводителя дворянства"
 nr_landowners_enact.3.a: "Государство — не банкир имений."
 nr_landowners_enact.3.b: "Кредит для земли."
 nr_landowners_enact.3.c: "Пусть решат промышленники."
 nr_landowners_enact_lore_3a: "#lore Без банка закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_3b: "#lore [Concept('concept_nr_land_bank', 'Дворянский земельный банк')] даёт имениям ссуды под процент, какого не предложит ни один частный банк. Прения затянутся.#!"
 nr_landowners_enact_lore_3c: "#lore Промышленники занимают по рыночной ставке и предпочли бы, чтобы государство кредитовало фабрики. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact.4.t: "Барщинный устав"
 nr_landowners_enact.4.desc: "Крепостная зависимость закрепляется в законе, и землевладельцы хотят прописать каждую повинность: сколько дней крестьянин должен имению и что бывает, если он не вышел на работу."
 nr_landowners_enact.4.flavor: "«Три дня на барина, три дня на себя, седьмой — Богу». По манифесту о трёхдневной барщине, 1797"
 nr_landowners_enact.4.a: "Довольно и обычая."
 nr_landowners_enact.4.b: "Вписать каждый день в устав."
 nr_landowners_enact.4.c: "Пусть скажет деревня."
 nr_landowners_enact_lore_4a: "#lore Без устава закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_4b: "#lore [Concept('concept_nr_corvee', 'Барщина')] становится писаной обязанностью, и за её исполнением следит государство, а не приказчик. Прения затянутся.#!"
 nr_landowners_enact_lore_4c: "#lore Деревенских старост спрашивают, сколько они должны, и они отвечают: меньше. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact.5.t: "Возвращение беглых"
 nr_landowners_enact.5.desc: "Пока обсуждается закон о рабстве, плантаторы требуют статью, обязывающую и чиновников, и граждан помогать возвращать беглых рабов владельцам."
 nr_landowners_enact.5.flavor: "«Закон сделал каждого свободного человека ловцом рабов». Из аболиционистской газеты, 1850"
 nr_landowners_enact.5.a: "Чиновники не станут охотиться на людей."
 nr_landowners_enact.5.b: "Собственность есть собственность."
 nr_landowners_enact.5.c: "Пусть рассудит просвещённая публика."
 nr_landowners_enact_lore_5a: "#lore Без этой статьи закон пройдёт быстрее — но плантаторы запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_5b: "#lore [Concept('concept_nr_fugitive_slaves', 'Возвращение беглых')] становится обязанностью каждого чиновника. Прения затянутся.#!"
 nr_landowners_enact_lore_5c: "#lore Спрашивают газеты и университеты, и их ответ известен заранее. Плантаторы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact.6.t: "Открытые гавани"
 nr_landowners_enact.6.desc: "Пока обсуждается закон о работорговле, плантаторы просят снять последние ограничения на ввоз: квоты, пошлины, досмотр судов."
 nr_landowners_enact.6.flavor: "«Ни одна плантация не держится без свежих рук». Из прошения плантаторов"
 nr_landowners_enact.6.a: "Торговля остаётся под надзором."
 nr_landowners_enact.6.b: "Открыть гавани."
 nr_landowners_enact.6.c: "Пусть рассудит просвещённая публика."
 nr_landowners_enact_lore_6a: "#lore Без этой статьи закон пройдёт быстрее — но плантаторы запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_6b: "#lore [Concept('concept_nr_slave_import', 'Невольничьи суда')] разгружаются без квот и досмотра. Прения затянутся.#!"
 nr_landowners_enact_lore_6c: "#lore Спрашивают газеты и университеты, и их ответ известен заранее. Плантаторы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_privilege_fast: "Налоги для всех"
 nr_landowners_enact_privilege_debate: "Прения о дворянской льготе"
 nr_landowners_enact_privilege_rejected: "Дворянская льгота не вошла в закон"
 nr_landowners_enact_privilege_heard: "Налогоплательщиков выслушали"
 nr_landowners_enact_grain_fast: "Защита для фабрик"
