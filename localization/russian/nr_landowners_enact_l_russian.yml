 nr_landowners_enact_grain_rejected: "Хлебная пошлина не вошла в закон"
 nr_landowners_enact_grain_heard: "Промышленников выслушали"
 nr_landowners_enact_bank_fast: "Без банка для имений"
 nr_landowners_enact_bank_debate: "Прения о земельном банке"
 nr_landowners_enact_bank_rejected: "Земельный банк не вошёл в закон"
 nr_landowners_enact_bank_heard: "Промышленников выслушали"
 nr_landowners_enact_corvee_fast: "Довольно и обычая"
 nr_landowners_enact_corvee_debate: "Прения о барщинном уставе"
 nr_landowners_enact_corvee_rejected: "Барщинный устав не вошёл в закон"
 nr_landowners_enact_corvee_heard: "Деревню выслушали"
 nr_landowners_enact_fugitive_fast: "Без ловцов рабов"
 nr_landowners_enact_fugitive_debate: "Прения о законе о беглых"
 nr_landowners_enact_fugitive_rejected: "Закон о беглых не вошёл в закон"
 nr_landowners_enact_fugitive_heard: "Публику выслушали"
 nr_landowners_enact_import_fast: "Торговля под надзором"
 nr_landowners_enact_import_debate: "Прения о свободном ввозе"
 nr_landowners_enact_import_rejected: "Свободный ввоз не вошёл в закон"
 nr_landowners_enact_import_heard: "Публику выслушали"
 nr_landowners_enact.7.t: "Суд помещика"
 nr_landowners_enact.7.desc: "Крепостная зависимость записывается в закон, и землевладельцы хотят вписать туда же вотчинный суд: мелкие дела крестьян судит помещик, а не государство."
 nr_landowners_enact.7.flavor: "«Где барин судья, там мужик всегда виноват». Крестьянская поговорка"
 nr_landowners_enact.7.a: "Судить будет государство."
 nr_landowners_enact.7.b: "Оставить суд усадьбе."
 nr_landowners_enact.7.c: "Пусть скажет деревня."
 nr_landowners_enact_lore_7a: "#lore Без этой статьи закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_7b: "#lore [Concept('concept_nr_patrimonial', 'Вотчинная юстиция')] становится частью земельного закона. Прения затянутся.#!"
 nr_landowners_enact_lore_7c: "#lore Деревенских старост спрашивают, чей суд они хотят, и ответ ясен. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_patrimonial_justice_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_patrimonial_justice_debate: "Прения о статье имений"
 nr_landowners_enact_patrimonial_justice_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_patrimonial_justice_heard: "Их мнение выслушали"
 nr_landowners_enact.8.t: "Стража из усадеб"
 nr_landowners_enact.8.desc: "Обсуждается закон о местной полиции, и землевладельцы просят, чтобы её начальники в каждом уезде назначались из усадеб."
 nr_landowners_enact.8.flavor: "«Стражник кланяется барину и кричит на мужика». Из уездной газеты"
 nr_landowners_enact.8.a: "Полиция подчиняется государству."
 nr_landowners_enact.8.b: "Пусть командуют усадьбы."
 nr_landowners_enact.8.c: "Пусть скажет деревня."
 nr_landowners_enact_lore_8a: "#lore Без этой статьи закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_8b: "#lore [Concept('concept_nr_constabulary', 'Помещичья полиция')] командует местной полицией. Прения затянутся.#!"
 nr_landowners_enact_lore_8c: "#lore Деревню спрашивают, кто должен её охранять, и усадьбу она не называет. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_noble_guard_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_noble_guard_debate: "Прения о статье имений"
 nr_landowners_enact_noble_guard_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_noble_guard_heard: "Их мнение выслушали"
 nr_landowners_enact.9.t: "Дворянская курия"
 nr_landowners_enact.9.desc: "Обсуждается земельный избирательный ценз, и землевладельцы хотят собственную курию: дворянство голосует отдельно и со своим весом."
 nr_landowners_enact.9.flavor: "«Голоса взвешивают, а не считают». Из речи в дворянском собрании"
 nr_landowners_enact.9.a: "Один ценз для всех избирателей."
 nr_landowners_enact.9.b: "Курию для дворянства."
 nr_landowners_enact.9.c: "Пусть рассудит просвещённая публика."
 nr_landowners_enact_lore_9a: "#lore Без курии закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_9b: "#lore [Concept('concept_nr_assemblies', 'Дворянская курия')] даёт дворянству собственный вес на выборах. Прения затянутся.#!"
 nr_landowners_enact_lore_9c: "#lore Спрашивают газеты и университеты, и их ответ известен заранее. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_noble_curia_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_noble_curia_debate: "Прения о статье имений"
 nr_landowners_enact_noble_curia_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_noble_curia_heard: "Их мнение выслушали"
 nr_landowners_enact.10.t: "Патрульная повинность"
 nr_landowners_enact.10.desc: "Пока обсуждается закон о рабстве, плантаторы просят сделать патрульную службу обязанностью каждого белого мужчины призывного возраста."
 nr_landowners_enact.10.flavor: "«Каждый белый — патрульный». Из постановления окружного суда"
 nr_landowners_enact.10.a: "Никого не заставят охотиться на людей."
 nr_landowners_enact.10.b: "Всех мужчин — в патруль."
 nr_landowners_enact.10.c: "Пусть рассудит просвещённая публика."
 nr_landowners_enact_lore_10a: "#lore Без этой статьи закон пройдёт быстрее — но плантаторы запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_10b: "#lore [Concept('concept_nr_patrols', 'Патрульная повинность')] становится обязанностью, записанной в законе о рабстве. Прения затянутся.#!"
 nr_landowners_enact_lore_10c: "#lore Спрашивают газеты и университеты, и их ответ известен заранее. Плантаторы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_patrol_statute_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_patrol_statute_debate: "Прения о статье имений"
 nr_landowners_enact_patrol_statute_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_patrol_statute_heard: "Их мнение выслушали"
 nr_landowners_enact.11.t: "Рабы для казны"
 nr_landowners_enact.11.desc: "Пока обсуждается закон о рабстве, плантаторы предлагают государству нанимать их рабов для дорог, доков и рудников — за хорошую плату."
 nr_landowners_enact.11.flavor: "«Нация строит чужими руками». Из отчёта казначейства"
 nr_landowners_enact.11.a: "Государство нанимает свободных."
 nr_landowners_enact.11.b: "Нанять рабов у плантаторов."
 nr_landowners_enact.11.c: "Пусть решат промышленники."
 nr_landowners_enact_lore_11a: "#lore Без этой статьи закон пройдёт быстрее — но плантаторы запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_11b: "#lore [Concept('concept_nr_state_slaves', 'Рабы нации')] строят казённые объекты. Прения затянутся.#!"
 nr_landowners_enact_lore_11c: "#lore Промышленники платят жалованье и не хотят, чтобы государство соперничало с ними рабским трудом. Плантаторы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_state_slaves_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_state_slaves_debate: "Прения о статье имений"
 nr_landowners_enact_state_slaves_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_state_slaves_heard: "Их мнение выслушали"
 nr_landowners_enact.12.t: "Чины по рождению"
 nr_landowners_enact.12.desc: "Обсуждается армейский закон, и землевладельцы просят отдавать офицерские патенты в первую очередь дворянским сыновьям, которые служат за честь, а не за жалованье."
 nr_landowners_enact.12.flavor: "«Офицером рождаются, а не становятся». Из письма юнкера"
 nr_landowners_enact.12.a: "Чины — за заслуги."
 nr_landowners_enact.12.b: "Чины — дворянству."
 nr_landowners_enact.12.c: "Пусть решит армия."
 nr_landowners_enact_lore_12a: "#lore Без этой статьи закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_12b: "#lore [Concept('concept_nr_officers', 'Дворянские патенты')] наполняет офицерский корпус из усадеб. Прения затянутся.#!"
 nr_landowners_enact_lore_12c: "#lore Спрашивают генералов, а многие из них выслужились сами. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_noble_commissions_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_noble_commissions_debate: "Прения о статье имений"
 nr_landowners_enact_noble_commissions_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_noble_commissions_heard: "Их мнение выслушали"
 nr_landowners_enact.13.t: "Шканцы для джентльменов"
 nr_landowners_enact.13.desc: "Обсуждается морской закон, и землевладельцы просят оставить морские чины за дворянством."
 nr_landowners_enact.13.flavor: "«Джентльмен — на шканцах, торговец — в трюме». Морская поговорка"
 nr_landowners_enact.13.a: "Открыть флот для всех."
 nr_landowners_enact.13.b: "Шканцы — дворянству."
 nr_landowners_enact.13.c: "Пусть решат купцы."
 nr_landowners_enact_lore_13a: "#lore Без этой статьи закон пройдёт быстрее — но имения запомнят, кто им отказал.#!"
 nr_landowners_enact_lore_13b: "#lore [Concept('concept_nr_naval', 'Морской ценз')] оставляет морские чины за дворянством. Прения затянутся.#!"
 nr_landowners_enact_lore_13c: "#lore Спрашивают судовладельцев и купеческих шкиперов, а они хотят видеть на шканцах своих сыновей. Землевладельцы запомнят, кого спросили вместо них.#!"
 nr_landowners_enact_naval_census_fast: "Закон пройдёт быстрее"
 nr_landowners_enact_naval_census_debate: "Прения о статье имений"
 nr_landowners_enact_naval_census_rejected: "Статья имений не вошла в закон"
 nr_landowners_enact_naval_census_heard: "Их мнение выслушали"
 nr_landowners_enact.14.t: "Служба по рождению"
 nr_landowners_enact.14.desc: "Наследственные должности записываются в закон, и землевладельцы просят, чтобы государственные места в первую очередь доставались дворянству."
 nr_landowners_enact.14.flavor: "«Служба — долг дворянина и его право». Из дворянского прошения"
