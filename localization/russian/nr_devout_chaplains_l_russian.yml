l_russian:
 # NR: Army Chaplains (feature devout_chaplains)
 nr_devout_chaplains.1.t: "Капелланы в армии"
 nr_devout_chaplains.1.desc: "Пока обсуждается закон о профессиональной армии, духовенство требует права служить в полках. Епископы говорят о душах солдат, генералы — о дисциплине и уставе. Решать, чей голос громче, придётся нам."
 nr_devout_chaplains.1.flavor: "«Кто перед боем исповедался, тот не побежит». Из проповеди полкового священника"
 nr_devout_chaplains.1.a: "Армия служит уставу, а не алтарю."
 nr_devout_chaplains.1.b: "Капеллан в каждом полку."
 nr_devout_chaplains.1.c: "Пусть решит офицерское собрание."
 nr_devout_chaplains_lore_1a: "#lore Генерал стучит пальцем по уставу: в нём ни слова о молебнах. Армия — это порядок, а порядку не нужны посредники между солдатом и командиром.#!"
 nr_devout_chaplains_lore_1b: "#lore В каждом полку появится свой священник: он будет служить литургию перед маршем и хоронить павших после боя. Закон пройдёт медленнее, но [Concept('concept_nr_chaplains', 'капелланы')] станут частью армии.#!"
 nr_devout_chaplains_lore_1c: "#lore Офицеры собираются в клубе, спорят до полуночи и решают, как решали всегда: вера — дело частное, служба — общее. Церковь запомнит, что её не спросили.#!"
 nr_devout_chaplains.2.t: "Оставить капелланов?"
 nr_devout_chaplains.2.desc: "Кампания подошла к концу, но полковые священники так и остались при своих частях. Солдаты к ним привыкли, командиры смирились. Теперь их положение можно закрепить в законе о профессиональной армии — или отпустить их по приходам."
 nr_devout_chaplains.2.flavor: "«Он не отдавал приказов, но его слушали». Из письма солдата домой"
 nr_devout_chaplains.2.a: "Закрепить капелланов в армейском законе."
 nr_devout_chaplains.2.b: "На этом закончить."
 nr_devout_chaplains_lore_2a: "#lore Приказ военного министра: должность полкового священника вносится в штатное расписание. Теперь [Concept('concept_nr_chaplains', 'капелланы')] не гости в армии, а её часть.#!"
 nr_devout_chaplains_lore_2b: "#lore Священники прощаются с полками и возвращаются в свои приходы. Кто-то из солдат ещё будет писать им письма.#!"
 amendment_nr_devout_chaplains: "Капелланы"
 amendment_nr_devout_chaplains_desc: "Полковое духовенство становится частью армии: священники поднимают дух солдат, но церковь получает голос в казармах, а муштра идёт медленнее."
 nr_devout_chaplains_regulations: "Устав прежде алтаря"
 nr_devout_chaplains_debate: "Спор о капелланах"
 nr_devout_chaplains_rejected: "Церковь не пустили в армию"
 nr_devout_chaplains_officers_trusted: "Доверие офицерскому собранию"
