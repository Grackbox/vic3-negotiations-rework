l_russian:
 # NR: follow-up of the Censorship Committees form (feature devout_censorship)
 nr_devout_censorship.2.t: "Красный карандаш"
 nr_devout_censorship.2.desc: "Десять лет церковные комитеты читали всё, что печатают наши типографии. Теперь епископы приходят в министерство: комитеты сделали что могли, остальное решать государству."
 nr_devout_censorship.2.flavor: "«Книгу можно сжечь однажды, а запрещённую книгу прочтут тысячу раз». Приписывается цензору старой школы"
 nr_devout_censorship.2.a: "Выслушать просьбу о государственной цензуре."
 nr_devout_censorship.2.c: "Печать останется свободной от алтаря."
 nr_devout_censorship.2.d: "Государство само взялось за карандаш."
 nr_devout_censorship.2.e: "Закрыть."
 nr_devout_censorship_lore_2a: "#lore Комитеты могут лишь советовать: типограф, который их не слушает, рискует разве что проповедью. Епископы просят закона, который даст красному карандашу силу государства, — так, как когда-то работала [Concept('concept_nr_spiritual_censorship', 'духовная цензура')].#!"
 nr_devout_censorship_petition_tt: "Духовенство подаст обращение: в течение #v 4#! лет принятие закона «Цензура» пойдёт на #v 25%#! быстрее, а клерикалы поддержат его при принятии. Если за это время закон не будет принят, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_censorship_lore_2c: "#lore Министр благодарит епископов за усердие и объясняет, что правительство не намерено разрешать каждую брошюру. Комитеты могут читать и дальше — но их больше не услышат.#!"
 nr_devout_censorship_lore_2d: "#lore Что начали комитеты, теперь делает само государство: каждая книга проходит цензора, прежде чем попасть в лавку. Епископам больше нечего просить — только благодарить.#!"
 je_nr_devout_censorship_petition: "Обращение духовенства: цензура"
 je_nr_devout_censorship_petition_reason: "Духовенство просит государство взять цензуру на себя. Если мы примем закон «Цензура» в ближайшие годы, это пойдёт быстрее; если нет, церковь почувствует, что её не услышали."
 je_nr_devout_censorship_petition_status_enacting: "Принимается закон «Цензура»: #g +25%#! к скорости принятия."
 je_nr_devout_censorship_petition_status_waiting: "Начните принимать закон «Цензура», чтобы получить #v +25%#! к скорости принятия."
 nr_devout_censorship_petition_speed: "При поддержке духовенства"
 nr_devout_censorship_petition_ignored: "Обращение духовенства проигнорировано"
 nr_devout_censorship_declined: "Цензура не отдана церкви"
 nr_devout_censorship_content: "Государство взялось за цензуру"
