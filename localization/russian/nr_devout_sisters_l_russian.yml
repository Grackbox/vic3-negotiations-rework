l_russian:
 # NR: Sisters of Mercy (feature devout_sisters)
 nr_devout_sisters.2.t: "Сёстры в больницах"
 nr_devout_sisters.2.desc: "Десять лет наши деньги шли на женские общины: сёстры мыли полы, меняли повязки и сидели у постелей тех, у кого не осталось родных. Теперь их старшая спрашивает, пустят ли сестёр в казённые лечебницы."
 nr_devout_sisters.2.flavor: "«Она не спрашивала имени и веры — только где болит». Из воспоминаний полкового врача"
 nr_devout_sisters.2.a: "Отправить сестёр в государственные больницы."
 nr_devout_sisters.2.d: "Больницы и так в руках церкви."
 nr_devout_sisters.2.c: "Поблагодарить и проводить."
 nr_devout_sisters_lore_2a: "#lore Устав казённой лечебницы дополняется одной строкой: уход поручается общине. [Concept('concept_nr_sisters_of_mercy', 'Сёстры милосердия')] соглашаются служить за стол и кров, но с условиями: свой устав, своя старшая сестра и слово церкви в приёмном покое. Казённая лечебница уступает часть власти, а у постели больного рядом с лекарством будет лежать молитвенник.#!"
 nr_devout_sisters_lore_2d: "#lore Старшая сестра кивает: больницы и так держатся на общинах, и менять ничего не нужно. Она уходит, не попросив ни жалованья, ни благодарности.#!"
 nr_devout_sisters_lore_2c: "#lore Министр благодарит общину за годы службы и подписывает указ о наборе оплачиваемых сиделок. Сёстры возвращаются к своим больным при церковных приютах — а в приёмных покоях казённых лечебниц ночами по-прежнему некому дежурить.#!"
 amendment_nr_devout_sisters: "Сёстры милосердия в больницах"
 amendment_nr_devout_sisters_desc: "Уход за больными в государственных лечебницах поручен женским общинам: в родильных приютах растёт рождаемость, в полевых лазаретах армия несёт меньше потерь, а слава сестёр работает на влияние за границей. Но у общин свои уставы и своё начальство: здравоохранение требует больше бюрократии, государство уступает часть авторитета, а Верующие набирают силу."
 nr_devout_sisters_declined: "Общины отстранены от больниц"
 nr_devout_sisters_content: "Больницы в руках церкви"
 nr_devout_sisters.2.b: "Выслушать просьбу о благотворительных лечебницах."
 nr_devout_sisters_lore_2b: "#lore Старшая сестра просит не жалованья, а закона: пусть больницы для бедных станут церковными, а казна лишь помогает. Общины делали это веками — [Concept('concept_nr_church_charity', 'церковная благотворительность')] уже кормит и лечит тех, до кого не доходит министерство.#!"
 nr_devout_sisters_petition_tt: "Общины подадут обращение: в течение #v 4#! лет принятие закона «Благотворительные лечебницы» пойдёт на #v 25%#! быстрее. Если за это время закон не будет принят, Верующие обидятся: #r −2#! к одобрению на 5 лет."
 je_nr_devout_sisters_petition: "Обращение общин: благотворительные лечебницы"
 je_nr_devout_sisters_petition_reason: "Сёстры просят передать больницы для бедных церкви. Если в ближайшие годы мы примем закон «Благотворительные лечебницы», дело пойдёт быстрее; если нет — общины сочтут, что их не услышали."
 je_nr_devout_sisters_petition_status_enacting: "Закон «Благотворительные лечебницы» принимается: #g +25%#! к скорости принятия."
 je_nr_devout_sisters_petition_status_waiting: "Начните принимать закон «Благотворительные лечебницы», чтобы получить #v +25%#! к скорости принятия."
 nr_devout_sisters_petition_speed: "Поддержка общин"
 nr_devout_sisters_petition_ignored: "Обращение общин не услышано"
 nr_devout_sisters.2.e: "Закрыть."
