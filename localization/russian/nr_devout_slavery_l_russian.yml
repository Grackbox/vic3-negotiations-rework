l_russian:
 # NR: The Church and the Slaves follow-up (feature devout_slavery)
 nr_devout_slavery.1.t: "Крещение и цепи"
 nr_devout_slavery.1.desc: "Пока обсуждается закон о рабстве, духовенство поднимает старый вопрос: может ли христианин владеть христианином? Епископы предлагают статью — ни одного раба государственной веры. Помещики слышат лишь одно: их собственность вот-вот окрестят и уведут."
 nr_devout_slavery.1.flavor: "«Крещение не меняет положения человека в отношении его неволи или свободы». Закон Вирджинии 1667 года"
 nr_devout_slavery.1.a: "Раб есть раб, какой бы веры он ни был."
 nr_devout_slavery.1.b: "Крещёный не может быть рабом."
 nr_devout_slavery.1.c: "Пусть решат землевладельцы."
 nr_devout_slavery_lore_1a: "#lore Закон будет считать головы, а не души. Без этой статьи он пройдёт быстрее — а церковь запомнит, кто поставил собственность выше крещения.#!"
 nr_devout_slavery_lore_1b: "#lore Никто не может держать в неволе того, кто разделяет его веру: [Concept('concept_nr_fellow_believers', 'единоверцы')] выходят на свободу. Помещики будут затягивать прения.#!"
 nr_devout_slavery_lore_1c: "#lore Плантаторов спрашивают, должно ли крещение освобождать раба. Ответ известен прежде, чем закончен вопрос, — а церковь запомнит, кого спросили вместо неё.#!"
 nr_devout_slavery_free_on_law_tt: "Когда закон будет принят с этой поправкой, все рабы государственной религии получат свободу, а затем каждый год — те, кто обратится."
 nr_devout_slavery.2.t: "Братья в цепях"
 nr_devout_slavery.2.desc: "Десять лет наши священники крестили и венчали рабов. Теперь епископы приходят с вопросом, которого плантации не хотели бы слышать: что значит быть братом во Христе и вещью по закону?"
 nr_devout_slavery.2.flavor: "«Нельзя владеть тем, с кем причащаешься у одной чаши». Из проповеди"
 nr_devout_slavery.2.a: "Выслушать просьбу об отмене рабства."
 nr_devout_slavery.2.b: "Не держать в рабстве единоверцев."
 nr_devout_slavery.2.c: "Церкви — души, государству — собственность."
 nr_devout_slavery.2.e: "Закрыть."
 nr_devout_slavery_lore_2a: "#lore Епископы больше не просят добрых хозяев. Они просят, чтобы хозяев не было вовсе: [Concept('concept_nr_church_and_slavery', 'церковь и рабство')] — эта история подошла к концу.#!"
 nr_devout_slavery_petition_tt: "Духовенство подаст обращение: в течение #v 4#! лет принятие закона [GetLawType('law_slavery_banned').GetName] пойдёт на #v 25%#! быстрее, а клерикалы поддержат его при принятии. Если за это время закон не будет принят, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_slavery_lore_2b: "#lore Рабство остаётся, но не для [Concept('concept_nr_fellow_believers', 'единоверцев')]: того, кто разделяет государственную веру, нельзя держать в неволе.#!"
 nr_devout_slavery_free_tt: "Все рабы государственной религии сразу получают свободу: работавшие на фермах, плантациях и ранчо или без работы становятся #v крестьянами#!, остальные — #v разнорабочими#!. Каждый год поправка освобождает обратившихся и успокаивает движение аболиционистов."
 nr_devout_slavery_lore_2c: "#lore Министр напоминает епископам, что государство охраняет собственность, а церковь спасает души. Священники возвращаются на плантации крестить и венчать — и ждать.#!"
 je_nr_devout_slavery_petition: "Обращение духовенства: отмена рабства"
 je_nr_devout_slavery_petition_reason: "Духовенство просит отменить рабство. Если мы примем закон [GetLawType('law_slavery_banned').GetName] в ближайшие годы, это пойдёт быстрее; если нет, церковь почувствует, что её не услышали."
 je_nr_devout_slavery_petition_status_enacting: "Принимается закон [GetLawType('law_slavery_banned').GetName]: #g +25%#! к скорости принятия."
 je_nr_devout_slavery_petition_status_waiting: "Начните принимать закон [GetLawType('law_slavery_banned').GetName], чтобы получить #v +25%#! к скорости принятия."
 amendment_nr_devout_fellow_believers: "Не держать в рабстве единоверцев"
 amendment_nr_devout_fellow_believers_desc: "Пока действует: #v раз в год все рабы государственной религии получают свободу#! — с ферм, плантаций и ранчо или без работы становятся #v крестьянами#!, остальные — #v разнорабочими#!, — а движение аболиционистов получает #g −0,25#! к радикализму на год. Первое освобождение происходит сразу, как только поправка вступает в силу.\n\nНикого из государственной веры нельзя держать в рабстве: аболиционисты успокаиваются, но их становится больше, помещики недовольны, а проверка каждого раба ложится на аппарат."
 nr_devout_slavery_abolitionists_calmed: "Церковь освобождает своих"
 nr_devout_slavery_petition_speed: "При поддержке духовенства"
 nr_devout_slavery_petition_ignored: "Обращение духовенства проигнорировано"
 nr_devout_slavery_declined: "Церковь не допущена к рабству"
 nr_devout_slavery_faith_irrelevant: "Собственность выше крещения"
 nr_devout_slavery_debate: "Прения о крещении"
 nr_devout_slavery_rejected: "Единоверцы остались в цепях"
 nr_devout_slavery_landowners_heard: "Землевладельцев выслушали"
 concept_nr_fellow_believers: "Единоверцы"
 concept_nr_fellow_believers_desc: "Может ли верующий владеть верующим? Этот вопрос шёл за рабством всюду, куда приходила церковь. В английских колониях плантаторы боялись, что крещение принесёт свободу, и в 1667 году Вирджиния решила дело законом: крещение не меняет неволи раба. Исламское право ответило по-своему задолго до этого: свободного мусульманина нельзя поработить, хотя раб, принявший ислам, оставался рабом. В 1839 году папа Григорий XVI осудил работорговлю буллой In supremo apostolatus, и от Рима до английских евангеликов всё громче звучал тот же вопрос: как брат по вере может быть собственностью?"
