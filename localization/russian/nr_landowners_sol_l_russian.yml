 je_nr_landowners_sol_status_draining: "Средний [Concept('concept_sol', 'уровень жизни')] — [ROOT.GetCountry.GetAverageSoLByPopulation|v1] / [SCOPE.gsInterestGroup('ig').MakeScope.Var('promised_sol_level').GetValue|v1]. #r Хуже, чем в момент обещания: шкала убывает.#!"
 je_nr_landowners_sol_status_stalled: "Средний [Concept('concept_sol', 'уровень жизни')] — [ROOT.GetCountry.GetAverageSoLByPopulation|v1] / [SCOPE.gsInterestGroup('ig').MakeScope.Var('promised_sol_level').GetValue|v1]. #r Шкала стоит.#!"
 nr_landowners_sol_bar: "Отеческое попечение"
