l_russian:
 # NR: Landowners' "Paternal Care" commitment (task landowners_sol)
 je_nr_landowners_sol: "Обязательство: отеческое попечение"
 je_nr_landowners_sol_reason: "Мы пообещали #tooltippable_name #tooltip:[SCOPE.gsInterestGroup('ig').GetTooltipTag],EMPTY_STRING,IGTooltip [SCOPE.gsInterestGroup('ig').GetCustom('RU_IG_DP')]#!#!, что простой народ заживёт лучше — как у доброго барина живут его люди. Одним урожайным годом их не убедить: имения будут судить нас по тому, как долго страна живёт в достатке."
 je_nr_landowners_sol_status_filling: "Средний [Concept('concept_sol', 'уровень жизни')] — [ROOT.GetCountry.GetAverageSoLByPopulation|v1] / [SCOPE.gsInterestGroup('ig').MakeScope.Var('promised_sol_level').GetValue|v1]. #g Шкала заполняется.#!"
