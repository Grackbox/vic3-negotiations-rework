 nr_promise_landowners_sol_tt: "Мы обязуемся удерживать средний [Concept('concept_sol', 'уровень жизни')] в [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_PP')] не ниже #v [SCOPE.gsInterestGroup('ig').MakeScope.Var('promised_sol_level').GetValue|v1]#!. Шкала обязательства начнётся с #v [SCOPE.gsInterestGroup('ig').MakeScope.ScriptValue('nr_landowners_sol_bar_start')|0]#! из #v 36#!. Каждый месяц на уровне цели она растёт на #v 1#!, а если до цели не хватает не больше #v 0.25#! — на #v 0.5#!. Если уровень жизни опустится ниже нынешнего (#v [ROOT.GetCountry.GetAverageSoLByPopulation|v1]#!), шкала будет убывать на #v 0.5#! за каждые 0.5 падения, но не больше чем на #v 2#! в месяц. Полная шкала — обязательство выполнено, пустая — провалено. На всё у нас #v [SCOPE.gsInterestGroup('ig').GetCustom('NR_SOL_commitment_duration')] лет#! [SCOPE.gsInterestGroup('ig').GetCustom('FailurePromiseLine')]"
