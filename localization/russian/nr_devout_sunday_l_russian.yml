l_russian:
 # NR: Sunday Rest (feature devout_sunday)
 nr_devout_sunday.1.t: "Седьмой день"
 nr_devout_sunday.1.desc: "Пока обсуждается рабочий закон, духовенство предлагает свою статью: не работать по воскресеньям и праздникам. Профсоюзы рады неожиданному союзнику; фабриканты считают потерянную выработку."
 nr_devout_sunday.1.flavor: "«Шесть дней работай — а фабрикант хотел бы и седьмой». Из воскресной проповеди"
 nr_devout_sunday.1.a: "Производство не знает выходных."
 nr_devout_sunday.1.b: "Седьмой день — Господу."
 nr_devout_sunday.1.c: "Пусть решат фабриканты."
 nr_devout_sunday_lore_1a: "#lore Машины не молятся, и закон не остановит их по воскресеньям. Без этой статьи он пройдёт быстрее — а церковь запомнит, кто ей отказал.#!"
 nr_devout_sunday_lore_1b: "#lore Закон гарантирует [Concept('concept_nr_sunday_rest', 'воскресный покой')]: выходной принадлежит рабочему по закону, а не по милости хозяина. Прения затянутся.#!"
 nr_devout_sunday_lore_1c: "#lore Фабрикантов спрашивают об их мнении, и они отвечают цифрами: один день из семи — это седьмая часть выработки. Церковь запомнит, кого спросили вместо неё.#!"
 nr_devout_sunday.2.t: "День Господень"
 nr_devout_sunday.2.desc: "Десять лет церковь вела календарь страны: праздники, юбилеи, молебны. Теперь духовенство просит о самом простом празднике — свободном воскресенье для всех, кто работает."
 nr_devout_sunday.2.flavor: "«Отдых — не праздность: это время, которое Господь хранит для души». Из пастырского послания"
 nr_devout_sunday.2.a: "Выслушать просьбу о рабочем законодательстве."
 nr_devout_sunday.2.b: "Закрепить воскресный покой в законе."
 nr_devout_sunday.2.c: "Фабрики не могут стоять."
 nr_devout_sunday.2.e: "Закрыть."
 nr_devout_sunday_lore_2a: "#lore Рабочего закона, в который можно вписать воскресенье, пока нет. Епископы просят его принять: инспекторы, рабочие часы — а потом, со временем, и [Concept('concept_nr_sunday_rest', 'воскресный покой')].#!"
 nr_devout_sunday_petition_tt: "Духовенство подаст обращение: в течение #v 4#! лет принятие закона «Регулирующие органы» пойдёт на #v 25%#! быстрее, а клерикалы поддержат его при принятии. Если за это время рабочее законодательство не будет принято, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_sunday_lore_2b: "#lore Здесь церковь и рабочее движение хотят одного и того же: [Concept('concept_nr_sunday_rest', 'воскресный покой')], вписанный в рабочий закон.#!"
 nr_devout_sunday_lore_2c: "#lore Министр объясняет, что стране не по карману останавливать машины раз в семь дней. Духовенство уходит без своего воскресенья — а рабочие услышат об этом с амвона.#!"
 je_nr_devout_sunday_petition: "Обращение духовенства: рабочее законодательство"
 je_nr_devout_sunday_petition_reason: "Духовенство просит принять рабочий закон, чтобы вписать в него воскресный отдых. Если мы примем закон «Регулирующие органы» в ближайшие годы, это пойдёт быстрее; если нет, церковь почувствует, что её не услышали."
 je_nr_devout_sunday_petition_status_enacting: "Принимается закон «Регулирующие органы»: #g +25%#! к скорости принятия."
 je_nr_devout_sunday_petition_status_waiting: "Начните принимать закон «Регулирующие органы», чтобы получить #v +25%#! к скорости принятия."
 amendment_nr_devout_sunday: "Воскресный покой"
 amendment_nr_devout_sunday_desc: "Работа по воскресеньям и праздникам запрещена законом: рабочие получают гарантированный выходной, фабрики стоят один день в неделю, а церковь вписала свой день в закон."
 nr_devout_sunday_petition_speed: "При поддержке духовенства"
 nr_devout_sunday_petition_ignored: "Обращение духовенства проигнорировано"
 nr_devout_sunday_declined: "Воскресному покою отказано"
 nr_devout_sunday_no_days_off: "Производство не знает выходных"
 nr_devout_sunday_debate: "Прения о воскресном покое"
 nr_devout_sunday_rejected: "Воскресный покой не вошёл в закон"
 nr_devout_sunday_industrialists_heard: "Фабрикантов выслушали"
 concept_nr_sunday_rest: "Воскресный покой"
 concept_nr_sunday_rest_desc: "В энциклике Rerum Novarum (1891) папа Лев XIII потребовал для рабочих отдыха по воскресеньям и праздникам. В том же году германский закон об охране труда ввёл воскресный отдых в промышленности, а в 1906 году Франция сделала еженедельный день отдыха обязательным. В этом вопросе церковь и рабочее движение стояли рядом."
