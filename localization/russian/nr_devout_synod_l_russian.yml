l_russian:
 # NR: Synodal Administration (feature devout_synod)
 nr_devout_synod.2.t: "Канцелярия обер-прокурора"
 nr_devout_synod.2.desc: "Десять лет государственные чиновники работали в консисториях и епархиях. У церкви есть порядок и деньги, у министерства — рука внутри церкви. Теперь архиереи просят сделать это устройство постоянным."
 nr_devout_synod.2.flavor: "«Церковью управляет Святой Дух — а по будням канцелярия обер-прокурора». Петербургская шутка"
 nr_devout_synod.2.a: "Закрепить синод в законе."
 nr_devout_synod.2.b: "Пусть архиереи сами ведут свои дела."
 nr_devout_synod_lore_2a: "#lore Постоянное [Concept('concept_nr_synod', 'синодальное управление')]: государство держит своих чиновников в церковных канцеляриях, церковь сохраняет своё привилегированное место. Обе стороны к этому привыкают, и прихожане это замечают.#!"
 nr_devout_synod_lore_2b: "#lore Чиновники возвращаются в свои министерства. Архиереям снова придётся самим вести свои книги — и они запомнят, кто забрал у них писарей.#!"
 amendment_nr_devout_synod: "Синодальное управление"
 amendment_nr_devout_synod_desc: "Церковью управляют через государственное ведомство: светский обер-прокурор надзирает за синодом, государство получает рычаг внутри церкви, а церковь всё больше походит на министерство."
 nr_devout_synod_declined: "Синод не закреплён в законе"
 nr_devout_synod.1.t: "Синод в законе"
 nr_devout_synod.1.desc: "Пока обсуждается закон о государственной церкви, архиереи предлагают управлять церковью через синод со светским обер-прокурором. Церковь получит порядок, государство — руку внутри неё; интеллигенция видит в этом лишь министерство в рясах."
 nr_devout_synod.1.flavor: "«Кесарево кесарю — но кто ведёт протокол?» Из прений в Государственном совете"
 nr_devout_synod.1.a: "Церковь управляет собой сама."
 nr_devout_synod.1.b: "Закрепить синод в законе."
 nr_devout_synod.1.c: "Пусть решит интеллигенция."
 nr_devout_synod_lore_1a: "#lore Архиереи сами выберут своих писарей и сами будут вести свои книги. Закон без канцелярии пройдёт быстрее — а церковь запомнит, кто ей отказал.#!"
 nr_devout_synod_lore_1b: "#lore Государственная церковь получает государственное ведомство: обер-прокурора, канцелярию и место в табели о рангах. Так было устроено [Concept('concept_nr_synod', 'синодальное управление')]. Прения затянутся.#!"
 nr_devout_synod_lore_1c: "#lore Профессоров и журналистов спрашивают об их мнении, и они высказывают его пространно: церкви место в приходе, а не в министерствах. Церковь запомнит, кого спросили вместо неё.#!"
 nr_devout_synod_self_rule: "Церковь управляет собой сама"
 nr_devout_synod_debate: "Прения о синоде"
 nr_devout_synod_rejected: "Синод не вошёл в закон"
 nr_devout_synod_intelligentsia_heard: "Интеллигенцию выслушали"
