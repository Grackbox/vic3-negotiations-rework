 amendment_nr_industrialists_guaranteed_return: "Гарантия дохода"
 amendment_nr_industrialists_guaranteed_return_desc: "Государство гарантирует дивиденды железнодорожных компаний. Линии продолжают строиться, а казна платит больше по своим займам."
 nr_industrialists_lore_amendment_guaranteed_return: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_guaranteed_return').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_private_arsenals: "Частные арсеналы"
 amendment_nr_industrialists_private_arsenals_desc: "Армия покупает оружие у частных фирм по долгим контрактам. Военные товары дешевеют."
 nr_industrialists_lore_amendment_private_arsenals: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_private_arsenals').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_iron_tariff: "Железный тариф"
 amendment_nr_industrialists_iron_tariff_desc: "Чужое железо и машины платят высокую пошлину. Тяжёлая промышленность растёт, а низшие слои и лавочники платят больше."
 nr_industrialists_lore_amendment_iron_tariff: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_iron_tariff').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_chartered_companies: "Хартийные компании"
 amendment_nr_industrialists_chartered_companies_desc: "Компании с королевскими хартиями управляют колониями. Колонии растут быстрее, а мир замечает их методы."
 nr_industrialists_lore_amendment_chartered_companies: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_chartered_companies').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_strike_law: "Закон о стачках"
 amendment_nr_industrialists_strike_law_desc: "Стачка считается заговором. Профсоюзы слабее, на улицах тише — пока."
 nr_industrialists_lore_amendment_strike_law: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_strike_law').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_limited_liability: "Ограниченная ответственность"
 amendment_nr_industrialists_limited_liability_desc: "Общества с ограниченной ответственностью учреждаются свободно. Фирмы растут, частный капитал строит больше."
 nr_industrialists_lore_amendment_limited_liability: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_limited_liability').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_mild_oversight: "Мягкий надзор"
 amendment_nr_industrialists_mild_oversight_desc: "Фабричную инспекцию составляют люди, которым доверяют владельцы. Выпуск растёт, профсоюзы теряют позиции."
 nr_industrialists_lore_amendment_mild_oversight: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_mild_oversight').GetName]» добавляется к действующему закону.#!"
 amendment_nr_industrialists_independent_bank: "Независимый банк"
 amendment_nr_industrialists_independent_bank_desc: "Государственным банком управляют банкиры, а не министры. Государство занимает дешевле, корона печатает меньше."
 nr_industrialists_lore_amendment_independent_bank: "#lore Поправка «[GetAmendmentType('amendment_nr_industrialists_independent_bank').GetName]» добавляется к действующему закону.#!"
