 nr_industrialists_enact.8.t: "Банк банкиров"
 nr_industrialists_enact.8.desc: "Обсуждается экономический курс, и промышленники просят, чтобы государственным банком управляли банкиры, а не министры."
 nr_industrialists_enact.8.flavor: "«Банк должен уметь сказать короне „нет“». Из записки банкира"
 nr_industrialists_enact.8.a: "Банк служит правительству."
 nr_industrialists_enact.8.b: "Независимый банк."
 nr_industrialists_enact.8.c: "Пусть решат землевладельцы."
