 nr_industrialists_enact.7.t: "Инспекторы, которым доверяют"
 nr_industrialists_enact.7.desc: "Обсуждается рабочий закон, и промышленники просят, чтобы инспекторами были люди, которым доверяют владельцы."
 nr_industrialists_enact.7.flavor: "«Инспектор обедает у хозяина и ничего не видит». Из рабочей газеты"
 nr_industrialists_enact.7.a: "Инспекция подчиняется государству."
 nr_industrialists_enact.7.b: "Инспекторы, которым доверяют владельцы."
 nr_industrialists_enact.7.c: "Пусть скажут профсоюзы."
