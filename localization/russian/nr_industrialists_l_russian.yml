 nr_industrialists_healthy_tt_5: "В течение #v 10 лет#! у нас должно быть #v [SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_target_5').GetValue|v0]#! уровней сооружений «[SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_type_5').GetBuildingType.GetName]» (сейчас #v [SCOPE.gsInterestGroup('ig').MakeScope.ScriptValue('nr_industrialists_healthy_all_levels_5')|v0]#!), укомплектованных хотя бы на #v 90%#!, прибыльных и без субсидий, #v 6#! месяцев подряд. Построить мало: заводы должны окупаться. [SCOPE.gsInterestGroup('ig').GetCustom('FailurePromiseLine')]"
 nr_industrialists_healthy_tt_6: "В течение #v 10 лет#! у нас должно быть #v [SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_target_6').GetValue|v0]#! уровней сооружений «[SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_type_6').GetBuildingType.GetName]» (сейчас #v [SCOPE.gsInterestGroup('ig').MakeScope.ScriptValue('nr_industrialists_healthy_all_levels_6')|v0]#!), укомплектованных хотя бы на #v 90%#!, прибыльных и без субсидий, #v 6#! месяцев подряд. Построить мало: заводы должны окупаться. [SCOPE.gsInterestGroup('ig').GetCustom('FailurePromiseLine')]"
 je_nr_industrialists_healthy: "Обязательство: тяжёлая промышленность, которая окупается"
 je_nr_industrialists_healthy_reason: "Мы пообещали группе «[SCOPE.gsInterestGroup('ig').GetName]», что сооружения «[SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_type').GetBuildingType.GetName]» будут не только построены, но и окупятся: укомплектованы, прибыльны и без субсидий."
 je_nr_industrialists_healthy_status: "Нужно #v [SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_target').GetValue|v0]#! уровней «[SCOPE.gsInterestGroup('ig').MakeScope.Var('nr_industrialists_healthy_type').GetBuildingType.GetName]», которые окупаются: укомплектованы хотя бы на #v 90%#!, приносят прибыль и не получают субсидий. Сейчас таких #v [SCOPE.gsInterestGroup('ig').MakeScope.ScriptValue('nr_industrialists_healthy_levels')|v0]#! из #v [SCOPE.gsInterestGroup('ig').MakeScope.ScriptValue('nr_industrialists_healthy_all_levels')|v0]#!. Торговые субвенции и пошлины можно. Шкала считает месяцы подряд; месяц ниже цели обнуляет её."
 nr_industrialists_healthy_complete_tt: "Заводы окупаются 6 месяцев подряд"
 nr_industrialists_healthy_bar: "Заводы окупаются"
 nr_industrialists_healthy_bar_desc: "Месяцев подряд: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#! из 6."
 nr_industrialists_healthy_bar_ok: "Окупаются #v [ROOT.GetCountry.MakeScope.ScriptValue('nr_industrialists_healthy_levels_c')|v0]#! из нужных #v [ROOT.GetCountry.MakeScope.Var('nr_industrialists_healthy_target_c').GetValue|v0]#! уровней «[ROOT.GetCountry.MakeScope.Var('nr_industrialists_healthy_type_c').GetBuildingType.GetName]»"
 nr_industrialists_healthy_bar_reset: "Окупаются только #v [ROOT.GetCountry.MakeScope.ScriptValue('nr_industrialists_healthy_levels_c')|v0]#! из нужных #v [ROOT.GetCountry.MakeScope.Var('nr_industrialists_healthy_target_c').GetValue|v0]#! уровней «[ROOT.GetCountry.MakeScope.Var('nr_industrialists_healthy_type_c').GetBuildingType.GetName]»: счёт начинается заново"
