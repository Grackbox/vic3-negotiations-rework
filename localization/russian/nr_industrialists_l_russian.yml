 nr_industrialists_enact.1.t: "Гарантия для линий"
 nr_industrialists_enact.1.desc: "Обсуждается экономический курс, и промышленники просят государственной гарантии дивидендов железнодорожных компаний."
 nr_industrialists_enact.1.flavor: "«Акционер спит спокойно — платит казна». Из финансовой газеты"
 nr_industrialists_enact.1.a: "Никаких гарантий частным фирмам."
 nr_industrialists_enact.1.b: "Гарантировать доход."
 nr_industrialists_enact.1.c: "Пусть решат налогоплательщики."
 nr_industrialists_enact_guaranteed_return_fast: "Закон пройдёт быстрее"
 nr_industrialists_enact_guaranteed_return_debate: "Прения о статье фабрикантов"
 nr_industrialists_enact_guaranteed_return_rejected: "Статья фабрикантов не вошла в закон"
 nr_industrialists_enact_guaranteed_return_heard: "Их мнение выслушали"
 nr_industrialists_enact.2.t: "Пушки с частных заводов"
 nr_industrialists_enact.2.desc: "Обсуждается армейский закон, и промышленники просят долгих оружейных контрактов с частными заводами."
 nr_industrialists_enact.2.flavor: "«Лучшая пушка — купленная вовремя». Из доклада артиллерийского ведомства"
 nr_industrialists_enact.2.a: "Арсеналы остаются за государством."
 nr_industrialists_enact.2.b: "Долгие контракты заводам."
 nr_industrialists_enact.2.c: "Пусть решит армия."
 nr_industrialists_enact_private_arsenals_fast: "Закон пройдёт быстрее"
 nr_industrialists_enact_private_arsenals_debate: "Прения о статье фабрикантов"
 nr_industrialists_enact_private_arsenals_rejected: "Статья фабрикантов не вошла в закон"
 nr_industrialists_enact_private_arsenals_heard: "Их мнение выслушали"
 nr_industrialists_enact.3.t: "Пошлины на железо"
 nr_industrialists_enact.3.desc: "Обсуждается протекционизм, и промышленники хотят высоких пошлин на чужое железо и машины."
 nr_industrialists_enact.3.flavor: "«Покупай своё — и деньги останутся дома». Лозунг протекционистов"
 nr_industrialists_enact.3.a: "Защищать хлеб, а не железо."
 nr_industrialists_enact.3.b: "Железо — тоже отечественный труд."
 nr_industrialists_enact.3.c: "Пусть решат лавочники."
 nr_industrialists_enact_iron_tariff_fast: "Закон пройдёт быстрее"
 nr_industrialists_enact_iron_tariff_debate: "Прения о статье фабрикантов"
 nr_industrialists_enact_iron_tariff_rejected: "Статья фабрикантов не вошла в закон"
 nr_industrialists_enact_iron_tariff_heard: "Их мнение выслушали"
 nr_industrialists_enact.4.t: "Правление по хартии"
 nr_industrialists_enact.4.desc: "Обсуждается колониальный закон, и промышленники просят, чтобы новыми землями управляли хартийные компании."
 nr_industrialists_enact.4.flavor: "«Компания пройдёт туда, куда не пройдёт правительство». Из колониальной записки"
 nr_industrialists_enact.4.a: "Правит флаг, а не гроссбух."
 nr_industrialists_enact.4.b: "Хартии — компаниям."
 nr_industrialists_enact.4.c: "Пусть рассудит просвещённая публика."
 nr_industrialists_enact_chartered_companies_fast: "Закон пройдёт быстрее"
 nr_industrialists_enact_chartered_companies_debate: "Прения о статье фабрикантов"
 nr_industrialists_enact_chartered_companies_rejected: "Статья фабрикантов не вошла в закон"
 nr_industrialists_enact_chartered_companies_heard: "Их мнение выслушали"
 nr_industrialists_enact.5.t: "Стачка как заговор"
 nr_industrialists_enact.5.desc: "Обсуждается рабочий закон, и промышленники хотят, чтобы стачка считалась заговором."
 nr_industrialists_enact.5.flavor: "«Союз рабочих — это заговор против торговли». Из судебного решения"
 nr_industrialists_enact.5.a: "Стачка — не преступление."
 nr_industrialists_enact.5.b: "Стачка — это заговор."
 nr_industrialists_enact.5.c: "Пусть скажут профсоюзы."
 nr_industrialists_enact_strike_law_fast: "Закон пройдёт быстрее"
 nr_industrialists_enact_strike_law_debate: "Прения о статье фабрикантов"
 nr_industrialists_enact_strike_law_rejected: "Статья фабрикантов не вошла в закон"
 nr_industrialists_enact_strike_law_heard: "Их мнение выслушали"
 nr_industrialists_enact.6.t: "Свободное учреждение обществ"
 nr_industrialists_enact.6.desc: "Обсуждается экономический курс, и промышленники просят свободного учреждения обществ с ограниченной ответственностью."
 nr_industrialists_enact.6.flavor: "«Ответственность ограничена, амбиции — нет». Из памфлета Сити"
 nr_industrialists_enact.6.a: "Каждый компаньон отвечает по долгам."
 nr_industrialists_enact.6.b: "Ограниченная ответственность для всех."
 nr_industrialists_enact.6.c: "Пусть решат лавочники."
