l_russian:
 # NR: the Industrialists' state contracts, commissions, amendments
 nr_industrialists_contracts.1.state_order: "Казённый заказ."
 nr_industrialists_contracts_lore_state_order: "#lore Министерства размещают заказы у нужных фирм. [Concept('concept_nr_state_order', 'Казённый заказ')] загружает заводы, а их владельцы остаются благодарны.#!"
 concept_nr_state_order: "Казённые заказы"
 concept_nr_state_order_desc: "Весь век правительства награждали верных фабрикантов заказами на мундиры, рельсы, корабли и пушки. Подряд стоил больше взятки: он платил годами и привязывал фирму к государству."
 nr_industrialists_contracts.1.railway: "Железнодорожная концессия."
 nr_industrialists_contracts_lore_railway: "#lore Государство отдаёт линию и гарантирует дивиденд, а компания кладёт рельсы. [Concept('concept_nr_railway_concession', 'Концессии с гарантией дохода')] строят дороги быстро — на риск казны.#!"
 concept_nr_railway_concession: "Железнодорожные концессии"
 concept_nr_railway_concession_desc: "Французский железнодорожный закон 1842 года и Главное общество российских железных дорог 1857 года строили линии руками частных компаний с государственной гарантией дохода. Дороги появлялись быстро — как и счета по гарантиям."
 nr_industrialists_contracts_railway: "Железнодорожная концессия"
 nr_industrialists_contracts.1.arms: "Военные поставки."
 nr_industrialists_contracts_lore_arms: "#lore Пушечные короли получают армейские заказы. [Concept('concept_nr_arms_contracts', 'Частные оружейники')] вооружают нацию — и богатеют на каждой военной тревоге.#!"
 concept_nr_arms_contracts: "Частные оружейники"
 concept_nr_arms_contracts_desc: "Крупп в Эссене, Армстронг в Ньюкасле и Путиловский завод в Петербурге выросли на казённых заказах на пушки, броню и корабли. Оружейное дело связало крупные фирмы с генеральными штабами."
 nr_industrialists_contracts_arms: "Военные поставки"
 nr_industrialists_contracts.1.iron_tariff: "Железный тариф."
 nr_industrialists_contracts_lore_iron_tariff: "#lore Чужое железо платит на границе. [Concept('concept_nr_iron_tariff', 'Железный тариф')] укрывает молодые заводы — и каждый гвоздь дорожает.#!"
 concept_nr_iron_tariff: "Железный тариф"
 concept_nr_iron_tariff_desc: "Германский тариф 1879 года соединил пошлины на железо с пошлинами на хлеб; американский тариф Мак-Кинли 1890 года поднял пошлины почти до половины стоимости товаров. Промышленность росла за стеной, платили за это покупатели."
 nr_industrialists_contracts_iron_tariff: "Железный тариф"
 nr_industrialists_contracts.1.mining: "Горная концессия."
 nr_industrialists_contracts_lore_mining: "#lore Государство сдаёт компаниям свои пласты и рудники. [Concept('concept_nr_mining_concession', 'Горные концессии')] поднимают руду — и списки погибших из шахт.#!"
 concept_nr_mining_concession: "Горные концессии"
 concept_nr_mining_concession_desc: "От Донбасса до Рура государства сдавали угольные и рудные поля частным компаниям. Добыча росла стремительно; шахты затапливало, а рудничный газ убивал сотни людей за одну катастрофу."
 nr_industrialists_contracts_mining: "Горная концессия"
 nr_industrialists_contracts.1.charter: "Колониальная хартия."
 nr_industrialists_contracts_lore_charter: "#lore Компания получает хартию на управление, торговлю и войну. [Concept('concept_nr_colonial_charter', 'Хартийные компании')] несут флаг без затрат для казны — и без пощады к туземцам.#!"
 concept_nr_colonial_charter: "Хартийные компании"
 concept_nr_colonial_charter_desc: "Королевская Нигерская компания (1886) и Британская южноафриканская компания (1889) получили королевские хартии на управление огромными землями. Империя росла дёшево, а донесения из этих земель потрясали Европу."
 nr_industrialists_contracts_charter: "Колониальная хартия"
 nr_industrialists_contracts.1.strikes: "Подавление стачек."
 nr_industrialists_contracts_lore_strikes: "#lore Частная охрана разгоняет пикеты с благословения полиции. [Concept('concept_nr_strike_suppression', 'Подавление стачек')] не даёт заводам встать — а злость копится под спудом.#!"
 concept_nr_strike_suppression: "Подавление стачек"
 concept_nr_strike_suppression_desc: "Британские законы о союзах запрещали рабочие объединения до 1824 года; в Америке агентство Пинкертона сдавало охрану против стачечников, самое известное — в Хомстеде в 1892 году. Порядок на заводах держался силой."
 nr_industrialists_contracts_strikes: "Подавление стачек"
 nr_industrialists_contracts.1.contract_labour: "Контрактные рабочие."
 nr_industrialists_contracts_lore_contract_labour: "#lore Вербовщики нанимают рабочих за границей на годы работы за твёрдую плату. [Concept('concept_nr_contract_labour', 'Контрактный труд')] строит линии и наполняет шахты — а лавочники жалуются на пришлых.#!"
 concept_nr_contract_labour: "Контрактный труд"
 concept_nr_contract_labour_desc: "Десятки тысяч китайских рабочих строили Центральную Тихоокеанскую дорогу и перуанские линии; индийские законтрактованные работники ехали на плантации по всей империи. Контрактный труд был дешёв, тяжёл и ненавистен местным рабочим."
 nr_industrialists_contracts_contract_labour: "Контрактные рабочие"
 nr_industrialists_commissions.1.exchange: "Биржевой комитет."
 nr_industrialists_commissions_lore_exchange: "#lore Купцы и фабриканты собираются на бирже и дают советы министрам. [Concept('concept_nr_exchange_committee', 'Биржевой комитет')] говорит от имени денег нации.#!"
 concept_nr_exchange_committee: "Биржевые комитеты"
 concept_nr_exchange_committee_desc: "Биржевые комитеты и торговые палаты дали деловым людям официальный голос: с ними советовались о тарифах, дорогах и налогах, а их члены заседали в правительственных советах."
 nr_industrialists_commissions.1.ministry: "Министерство путей сообщения."
 nr_industrialists_commissions_lore_ministry: "#lore Министерством, которое планирует линии и порты, управляют инженеры и подрядчики. [Concept('concept_nr_ways_ministry', 'Министерство путей сообщения')] строит быстро — там, где хочется подрядчикам.#!"
 concept_nr_ways_ministry: "Министерства путей сообщения"
 concept_nr_ways_ministry_desc: "Российское Министерство путей сообщения (преобразованное в 1865 году) и прусское министерство торговли планировали дороги, каналы и порты вместе с компаниями, которые их строили."
 nr_industrialists_commissions_ministry: "Министерство путей сообщения"
 nr_industrialists_commissions.1.patents: "Патентное бюро."
 nr_industrialists_commissions_lore_patents: "#lore Изобретатели регистрируют свои машины, фабриканты покупают права. [Concept('concept_nr_patent_office', 'Патентное бюро')] быстро распространяет новые способы — а мелкие мастерские не поспевают.#!"
 concept_nr_patent_office: "Патентные бюро"
 concept_nr_patent_office_desc: "Патентное ведомство США было преобразовано в 1836 году, получив экспертов и реестр изобретений; Германия приняла патентный закон в 1877 году. Патент превратил изобретение в собственность, которую могла купить фабрика."
 nr_industrialists_commissions_patents: "Патентное бюро"
 nr_industrialists_commissions.1.company_law: "Комиссия по акционерному праву."
 nr_industrialists_commissions_lore_company_law: "#lore Юристы крупных фирм пишут новый закон об акционерных обществах. [Concept('concept_nr_company_law', 'Акционерные общества')] собирают капитал тысяч мелких вкладчиков.#!"
 concept_nr_company_law: "Акционерные общества"
 concept_nr_company_law_desc: "Британский закон о компаниях 1862 года и французский закон 1867 года позволили учреждать общества с ограниченной ответственностью без особой хартии. Капитал хлынул в промышленность — и спекуляция вместе с ним."
 nr_industrialists_commissions_company_law: "Комиссия по акционерному праву"
 nr_industrialists_commissions.1.inspection: "Фабричная инспекция в руках фабрикантов."
 nr_industrialists_commissions_lore_inspection: "#lore Инспекторов подбирают из людей, которым доверяют владельцы. [Concept('concept_nr_factory_inspection', 'Фабричная инспекция')] существует на бумаге — а машины работают по-прежнему.#!"
 concept_nr_factory_inspection: "Фабричная инспекция"
 concept_nr_factory_inspection_desc: "Британский фабричный закон 1833 года учредил первых фабричных инспекторов — четырёх человек на всю страну. Десятилетиями надзор был слаб, а влияние владельцев на него — сильно."
 nr_industrialists_commissions_inspection: "Фабричная инспекция в руках фабрикантов"
 nr_industrialists_commissions.1.consuls: "Консульская служба."
 nr_industrialists_commissions_lore_consuls: "#lore Торговые консулы открывают рынки и докладывают о соперниках. [Concept('concept_nr_consular_service', 'Консульская служба')] работает на торговлю нации — и прежде всего на её крупнейшие фирмы.#!"
 concept_nr_consular_service: "Консульская служба"
 concept_nr_consular_service_desc: "В девятнадцатом веке консулы стали агентами торговли: собирали сведения о рынках, защищали купцов и добивались уступок от иностранных правительств ради своих фабрикантов."
 nr_industrialists_commissions_consuls: "Консульская служба"
 nr_industrialists_commissions.1.bank: "Государственный банк в руках банкиров."
 nr_industrialists_commissions_lore_bank: "#lore Крупные банкиры заседают в совете государственного банка. [Concept('concept_nr_state_bank', 'Государственный банк')] кредитует промышленность — и меньше печатает для короны.#!"
 concept_nr_state_bank: "Государственные банки"
 concept_nr_state_bank_desc: "Банком Англии, Банком Франции (1800) и Государственным банком России (1860) во многом управляли банкиры и купцы. Их кредит строил промышленность, а их осторожность сдерживала печатный станок правительств."
 nr_industrialists_commissions_bank: "Государственный банк в руках банкиров"
 nr_industrialists_contracts_option: "Предложить фабрикантам казённые подряды."
 nr_industrialists_contracts_tt: "Вместо денег промышленники получат казённые подряды: казна платит столько же, сколько при взятке, но растянуто на 10 лет, а промышленники получают политическую силу. Через неделю они скажут, какие подряды хотят; одни обходятся дешевле, другие дороже."
 nr_industrialists_contracts_base_tt: "Только базовые эффекты: обычные заказы, стоимость прежняя."
 nr_industrialists_contracts.1.t: "Казённые подряды"
 nr_industrialists_contracts.1.desc: "Фабриканты принесли свои предложения. Им нужна работа, а не наличные — работа, которую государство будет оплачивать годами."
 nr_industrialists_contracts.1.flavor: "«Дайте нам заказы, а не милостыню». Из прошения фабрикантов"
 nr_industrialists_contracts_favor: "Казённые подряды"
 nr_industrialists_contracts_expenses_1: "Платежи по подрядам"
 nr_industrialists_contracts_expenses_2: "Платежи по подрядам"
 nr_industrialists_contracts_expenses_3: "Платежи по подрядам"
 nr_industrialists_commissions_option: "Предложить фабрикантам места в комиссиях."
 nr_industrialists_commissions_tt: "Промышленники займут места в государственных комиссиях: бюрократия теряет столько же, сколько при ванильных местах в администрации, а промышленники получают политическую силу на 10 лет. Через неделю они скажут, какие комиссии хотят."
 nr_industrialists_commissions_base_tt: "Только базовые эффекты: штраф к бюрократии остаётся прежним."
 nr_industrialists_commissions.1.t: "Места в комиссиях"
 nr_industrialists_commissions.1.desc: "Торговые палаты составили свой список. Фабриканты готовы советовать государству — изнутри его комиссий."
 nr_industrialists_commissions.1.flavor: "«Что хорошо для дела, то хорошо и для нации». Из адреса торговой палаты"
 nr_industrialists_commissions_benefits: "Места в комиссиях"
 nr_industrialists_commissions_penalty_1: "Места в руках дельцов"
 nr_industrialists_commissions_penalty_2: "Места в руках дельцов"
 nr_industrialists_commissions_penalty_3: "Места в руках дельцов"
 nr_industrialists_declined: "Просьба фабрикантов отклонена"
 nr_industrialists_content: "Фабриканты довольны"
 nr_industrialists_fu_petition: "Поддержать обращение фабрикантов."
 nr_industrialists_fu_amendment: "Закрепить это в законе."
 nr_industrialists_fu_decline: "Не сейчас."
 nr_industrialists_fu_thanks: "Фабриканты благодарят."
 nr_industrialists_fu_nothing: "Закреплять в законе сейчас нечего."
 nr_industrialists_lore_thanks: "#lore Фабриканты помнят, кто дал им работу.#!"
 nr_industrialists_enact_lore_a: "#lore Без этой статьи закон пройдёт быстрее — но фабриканты запомнят, кто им отказал.#!"
 nr_industrialists_enact_lore_b: "#lore Статья фабрикантов входит в закон. Прения затянутся.#!"
 nr_industrialists_enact_lore_c: "#lore Спрашивают другую группу. Фабриканты запомнят, кого спросили вместо них.#!"
