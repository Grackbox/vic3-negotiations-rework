 nr_industrialists_contracts.11.t: "Гарантия дохода"
 nr_industrialists_contracts.11.desc: "Десять лет концессионеры кладут рельсы. Промышленники просят сделать гарантию дохода частью экономического закона."
 nr_industrialists_contracts.12.t: "Частные арсеналы"
 nr_industrialists_contracts.12.desc: "Десять лет армия закупает у частных заводов. Промышленники просят записать долгие контракты в армейский закон."
 nr_industrialists_contracts.13.t: "Стены для промышленности"
 nr_industrialists_contracts.13.desc: "Десять лет железный тариф укрывает заводы. Промышленники хотят сделать его постоянным."
 nr_industrialists_contracts.21.t: "Стены рухнули"
 nr_industrialists_contracts.21.desc_gov: "Пришла свободная торговля, и министры промышленников с этим согласились. Железного тарифа больше нет."
 nr_industrialists_contracts.21.desc_opp: "Свободную торговлю провели через голову фабрикантов. Чужое железо заполняет рынок."
 nr_industrialists_contracts.21.flavor: "«Свободная торговля — международный закон Всевышнего». Ричард Кобден"
 nr_industrialists_contracts.21.a: "Дешёвое железо для всех."
 nr_industrialists_contracts.21.b: "Фабриканты этого не забудут."
 nr_industrialists_contracts.14.t: "Шахты сдают"
 nr_industrialists_contracts.14.desc: "Десять лет концессии разрабатывают пласты. Владельцы благодарны."
 nr_industrialists_contracts.15.t: "Хартии продлены"
 nr_industrialists_contracts.15.desc: "Десять лет хартийные компании управляют своими землями. Промышленники просят сделать это правилом колониальной политики."
 nr_industrialists_contracts.22.t: "Хартии отозваны"
 nr_industrialists_contracts.22.desc_gov: "Государство отказалось от колоний, и министры промышленников с этим согласились. Хартийные компании лишаются своих земель."
 nr_industrialists_contracts.22.desc_opp: "Правительство оставило колонии через голову промышленников. Хартии превратились в пустую бумагу."
 nr_industrialists_contracts.22.flavor: "«Флаг идёт за торговлей — и торговля уходит за флагом домой». Из газеты Сити"
 nr_industrialists_contracts.22.a: "Хартии возвращены."
 nr_industrialists_contracts.22.b: "Компании подсчитывают убытки."
 nr_industrialists_contracts.16.t: "Порядок на заводах"
 nr_industrialists_contracts.16.desc: "Десять лет стачки подавляются. Промышленники хотят, чтобы закон считал стачку заговором."
 nr_industrialists_contracts.23.t: "Право на объединение"
 nr_industrialists_contracts.23.desc_gov: "Новый закон разрешает рабочим объединяться, и промышленники в правительстве с этим согласились. Охрану распустили."
 nr_industrialists_contracts.23.desc_opp: "Право на объединение провели через голову владельцев. Профсоюзы выходят открыто."
 nr_industrialists_contracts.23.flavor: "«Пролетарии всех стран, соединяйтесь!» Манифест Коммунистической партии, 1848"
 nr_industrialists_contracts.23.a: "Союзам можно собираться."
 nr_industrialists_contracts.23.b: "Владельцы боятся союзов."
 nr_industrialists_contracts.17.t: "Контракты исполнены"
 nr_industrialists_contracts.17.desc: "Десять лет контрактные рабочие строят и копают. Владельцы благодарны."
 nr_industrialists_contracts.24.t: "Границы закрыты"
 nr_industrialists_contracts.24.desc_gov: "Новый закон о миграции прекращает вербовку за границей, и министры промышленников с этим согласились. Контракты продлевать не будут."
 nr_industrialists_contracts.24.desc_opp: "Вербовку за границей запретили через голову владельцев. Шахты и стройки теряют руки."
 nr_industrialists_contracts.24.flavor: "«Трудящийся достоин награды — если он из наших». С рабочего собрания"
 nr_industrialists_contracts.24.a: "Работа — своим."
 nr_industrialists_contracts.24.b: "Владельцы теряют руки."
 nr_industrialists_commissions.11.t: "Линии на карте"
 nr_industrialists_commissions.11.desc: "Десять лет министерство работает с подрядчиками. Промышленники благодарны."
 nr_industrialists_commissions.12.t: "Изобретения на продажу"
 nr_industrialists_commissions.12.desc: "Десять лет патентное бюро регистрирует изобретения. Фабриканты предлагают выкупить права на один из новых способов."
 nr_industrialists_commissions.13.t: "Ограниченная ответственность"
 nr_industrialists_commissions.13.desc: "Десять лет комиссия формирует акционерное право. Промышленники просят сделать свободное учреждение обществ частью экономического закона."
 nr_industrialists_commissions.31.t: "Общества под государством"
 nr_industrialists_commissions.31.desc_gov: "Новый экономический закон ставит общества под контроль государства или кооперативов, и промышленники в правительстве с этим согласились. Комиссию распустили."
 nr_industrialists_commissions.31.desc_opp: "Общества отняли через голову их владельцев. Акционеры подсчитывают, что осталось."
 nr_industrialists_commissions.31.flavor: "«Собственность есть кража». Пьер-Жозеф Прудон, 1840"
 nr_industrialists_commissions.31.a: "Комиссия распущена."
 nr_industrialists_commissions.31.b: "Акционеры разорены."
 nr_industrialists_commissions.14.t: "Мягкая инспекция"
 nr_industrialists_commissions.14.desc: "Десять лет инспекторы были людьми владельцев. Промышленники хотят записать это в рабочий закон."
 nr_industrialists_commissions.32.t: "Инспекция не нужна"
 nr_industrialists_commissions.32.desc_gov: "Закон о правах рабочих отменён, а с ним и инспекция. Министры промышленников с этим согласились."
 nr_industrialists_commissions.32.desc_opp: "Закон о правах рабочих отменили через голову промышленников. Их люди в инспекции лишились мест."
 nr_industrialists_commissions.32.flavor: "«Инспектировать больше нечего». Из последнего отчёта фабричного инспектора"
 nr_industrialists_commissions.32.a: "Инспекторы расходятся по домам."
 nr_industrialists_commissions.32.b: "Владельцы теряют своих людей."
 nr_industrialists_commissions.15.t: "Рынки за границей"
 nr_industrialists_commissions.15.desc: "Десять лет консулы работают на торговлю нации. Промышленники благодарны."
 nr_industrialists_commissions.16.t: "Независимый банк"
 nr_industrialists_commissions.16.desc: "Десять лет банкиры управляют государственным банком. Они просят сделать его независимость частью экономического закона."
 nr_industrialists_commissions.33.t: "Банк национализирован"
 nr_industrialists_commissions.33.desc_gov: "Командная экономика подчиняет государственный банк министерствам, и промышленники в правительстве с этим согласились. Банкиры покидают совет."
 nr_industrialists_commissions.33.desc_opp: "Государственный банк отняли у банкиров через их голову. Кредит теперь следует плану."
 nr_industrialists_commissions.33.flavor: "«Централизация кредита в руках государства». Манифест Коммунистической партии, 1848"
 nr_industrialists_commissions.33.a: "Кредит служит плану."
 nr_industrialists_commissions.33.b: "Банкиров выставили."
