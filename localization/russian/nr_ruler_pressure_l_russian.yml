l_russian:
 # NR: the ruler presses the group, election promise, authority cost (features ruler_pressure, election_promise)
 negotiation.1.nr_pressure: "[ROOT.GetCountry.GetCustom('NR_PressureLine')]"
 negotiation.1.nr_election_promise: "На ближайших выборах правительство встанет за вашу партию."
 nr_ruler_pressure_option_monarch: "Корона требует вашей поддержки."
 nr_ruler_pressure_option_theocrat: "Святой престол ждёт послушания."
 nr_ruler_pressure_option_autocrat: "Это приказ."
 nr_ruler_pressure_option_oligarchs: "Решим это между своими."
 nr_ruler_pressure_option_technocrats: "Комиссия уже всё решила."
 nr_ruler_pressure_lore_monarch: "#lore «Suprema lex regis voluntas» — воля короля есть высший закон. Вильгельм II, запись в Золотой книге Мюнхена, 1891#!"
 nr_ruler_pressure_lore_theocrat: "#lore «Традиция? Традиция — это я». Пий IX, 1870#!"
 nr_ruler_pressure_lore_autocrat: "#lore «Pan o palo» — хлеб или палка. Правление Порфирио Диаса в трёх словах#!"
 nr_ruler_pressure_lore_oligarchs: "#lore «Закон! Какое мне дело до закона? Разве сила не у меня?» Приписывается Корнелиусу Вандербильту#!"
 nr_ruler_pressure_lore_technocrats: "#lore «На место управления лицами становится управление вещами». Энгельс вслед за Сен-Симоном, 1880#!"
 nr_ruler_pressure_no_penalty_tt: "[SCOPE.gsInterestGroup('ig').GetName] подчиняются без ропота."
 nr_ruler_pressure_order_obeyed_tt: "Лидер группы «[SCOPE.gsInterestGroup('ig').GetName]» верен: приказ исполнен."
 nr_election_promise_lore: "#lore В министерстве внутренних дел уже составляют «encasillado» — роспись, какое место достанется какому другу правительства. Урны лишь подтвердят её.#!"
 nr_election_promise_tt: "В ближайшую предвыборную кампанию мы должны поддержать партию группы «[SCOPE.gsInterestGroup('ig').GetName]» в событии о подтасовке выборов (+150% импульса). Любой другой выбор нарушит обещание."
 nr_election_promise_keeps_tt: "Так мы сдержим обещание, данное группе «[SCOPE.gsInterestGroup('nr_promised_ig').GetName]»."
 nr_election_promise_breaks_tt: "Так мы нарушим обещание, данное группе «[SCOPE.gsInterestGroup('nr_promised_ig').GetName]»."
 je_nr_election_promise_status_waiting: "Ждём ближайшей предвыборной кампании."
 je_nr_election_promise_status_campaign: "Кампания идёт: в событии о подтасовке выборов нужно поддержать партию группы «[SCOPE.gsInterestGroup('ig').GetName]»."
 nr_election_promise_kept_cond_tt: "Мы поддержали их партию на выборах"
