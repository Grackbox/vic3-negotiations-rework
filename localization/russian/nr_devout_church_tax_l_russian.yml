l_russian:
 # NR: Church Tax (feature devout_church_tax)
 nr_devout_church_tax.1.t: "Кто платит священнику?"
 nr_devout_church_tax.1.desc: "Новый закон выводит церковь из государства. Епископы не возражают — при одном условии: налоговые присутствия должны по-прежнему собирать церковный налог, как собирают его для казны."
 nr_devout_church_tax.1.flavor: "«Отделите нас от государства, но не от налоговых списков». Из записки епископов"
 nr_devout_church_tax.1.a: "Церковь сама о себе позаботится."
 nr_devout_church_tax.1.b: "Оставить церкви право на налог."
 nr_devout_church_tax.1.c: "Пусть решат налогоплательщики."
 nr_devout_church_tax_lore_1a: "#lore Раз церковь свободна, пусть сама собирает свои деньги. Закон без этой оговорки пройдёт быстрее — а епископы запомнят, кто оставил их без жалованья.#!"
 nr_devout_church_tax_lore_1b: "#lore Церковь теряет статус, но сохраняет доход: государственные налоговые присутствия по-прежнему собирают [Concept('concept_nr_church_tax', 'церковный налог')]. Так работал Веймарский компромисс. Прения затянутся.#!"
 nr_devout_church_tax_lore_1c: "#lore Лавочников и ремесленников, которые платят оба налога, спрашивают об их мнении. Они отвечают сразу и единодушно — а церковь запомнит, кого спросили вместо неё.#!"
 nr_devout_church_tax.2.t: "Налоговые списки"
 nr_devout_church_tax.2.desc: "Десять лет наши налоговые присутствия собирали деньги для церкви. Теперь епископы просят закрепить это в законе, чтобы никакое будущее правительство не могло просто это отменить."
 nr_devout_church_tax.2.flavor: "«Сборщик стучит дважды: сначала за короля, потом за приход». Поговорка"
 nr_devout_church_tax.2.a: "Гарантировать церкви её налог."
 nr_devout_church_tax.2.b: "Закрепить церковный налог в законе."
 nr_devout_church_tax.2.c: "Казна — не церковная касса."
 nr_devout_church_tax_lore_2a: "#lore Пока стоит государственная церковь, налог ей не нужен — нужна гарантия: что бы ни случилось между церковью и государством, налоговые присутствия продолжат собирать для прихода.#!"
 nr_devout_church_tax_guarantee_tt: "Если страна перейдёт к #v свободе совести#! или #v полному отделению церкви#!, поправка #v «Церковный налог»#! войдёт в новый закон #v автоматически#!: +50 авторитета, +1 к уровню жизни духовенства, −2% к сбору налогов, −3% к обращению."
 nr_devout_church_tax_lore_2b: "#lore Церковь отделена от государства, но не от его налоговых списков: [Concept('concept_nr_church_tax', 'церковный налог')] становится частью закона.#!"
 nr_devout_church_tax_lore_2c: "#lore Министр финансов благодарит епископов и объясняет, что налоговым присутствиям хватает работы и для государства. Церкви снова придётся обходить прихожан с блюдом.#!"
 nr_devout_church_tax.3.t: "Церковь сохраняет налог"
 nr_devout_church_tax.3.desc: "Государство уходит от церкви, но старая гарантия действует: поправка «Церковный налог» входит в новый закон. Налоговые присутствия продолжат собирать для приходов."
 nr_devout_church_tax.3.flavor: "«Обещания, данные церкви, переживают правительства, которые их дают». Замечание чиновника"
 nr_devout_church_tax.3.a: "Обещание есть обещание."
 nr_devout_church_tax_lore_3a: "#lore Гарантия церковного налога сработала: [Concept('concept_nr_church_tax', 'церковный налог')] вписан в принимаемый закон.#!"
 amendment_nr_devout_church_tax_guarantee: "Гарантия церковного налога"
 amendment_nr_devout_church_tax_guarantee_desc: "Государственной церкви обещан её налог на будущее. Если страна перейдёт к свободе совести или полному отделению церкви, поправка «Церковный налог» автоматически войдёт в новый закон."
 amendment_nr_devout_church_tax: "Церковный налог"
 amendment_nr_devout_church_tax_desc: "Государственные налоговые присутствия собирают налог для церкви: духовенство получает жалованье, но люди платят дважды, и кто-то выходит из церкви, чтобы не платить."
 nr_devout_church_tax_declined: "Церковному налогу отказано"
 nr_devout_church_tax_self_support: "Церковь сама себя содержит"
 nr_devout_church_tax_debate: "Прения о церковном налоге"
 nr_devout_church_tax_rejected: "Церковный налог не вошёл в закон"
 nr_devout_church_tax_taxpayers_heard: "Налогоплательщиков выслушали"
