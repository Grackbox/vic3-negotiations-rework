 nr_movement_radicalism_down_015: "Успокоение"
 concept_nr_ranks_orders: "Чины и ордена"
 concept_nr_ranks_orders_desc: "Табель о рангах Петра I (1722) превратила государственную службу в лестницу к дворянству: дослужившийся до нужного чина становился дворянином — сперва лично, потом потомственно. Ту же службу служили ордена, и в XIX веке корона не раз поднимала требуемые чины — в 1845 и снова в 1856 году, — потому что поток новых дворян рос. В Британии число пэров с 1780-х по 1830-е годы примерно удвоилось за счёт новых креаций."
 concept_nr_crown_lands: "Раздачи казённых земель"
 concept_nr_crown_lands_desc: "Государства расплачивались со слугами и сторонниками землёй и тогда, когда уже перестали раздавать крепостных. В 1870-х годах сотни тысяч десятин башкирских земель в Уфимской и Оренбургской губерниях почти даром ушли чиновникам и помещикам; скандал привёл к сенаторской ревизии 1881 года и отставке министра государственных имуществ."
 concept_nr_noble_tax_exemption: "Податная льгота имений"
 concept_nr_noble_tax_exemption_desc: "В Пруссии рыцарские имения долго не платили поземельного налога — привилегия старого порядка, пережившая реформы начала XIX века. Лишь поземельная реформа 1861 года заставила их платить наравне со всеми, при яростном сопротивлении юнкеров."
 concept_nr_corn_laws: "Хлебные законы"
 concept_nr_corn_laws_desc: "Британские хлебные законы 1815 года не пускали иностранное зерно, пока цены внутри страны не становились высокими. Лига против хлебных законов, основанная в 1838 году Ричардом Кобденом и Джоном Брайтом, сделала дешёвый хлеб общенациональным делом, и в 1846 году Роберт Пиль отменил законы, расколов собственную партию. В Германии тариф 1879 года соединил интересы восточных имений и тяжёлой промышленности — «брак железа и ржи»."
 concept_nr_land_bank: "Дворянские земельные банки"
 concept_nr_land_bank_desc: "В 1770 году Фридрих II основал Силезский ландшафт — кредитный союз имений, дававший ссуды под землю под низкий процент. За ним последовали другие прусские провинции. В России Государственный дворянский земельный банк, основанный в 1885 году, кредитовал дворянство на условиях, каких не дал бы ни один частный банк, чтобы удержать имения в дворянских руках."
 concept_nr_corvee: "Барщина"
 concept_nr_corvee_desc: "Барщина — труд, который крестьянин был обязан отработать на барской земле. Прусские регуляционные эдикты 1811 и 1816 годов освобождали от неё лишь в обмен на треть или половину крестьянской земли. В России помещики сохраняли широкую власть над крепостными до 1861 года; в 1822 году им вернули право ссылать их в Сибирь."
 concept_nr_redemption: "Выкупная операция"
 concept_nr_redemption_desc: "Когда крепостное право кончалось, кто-то должен был заплатить за землю. Пруссия в 1850 году основала рентные банки, которые сразу платили помещикам и десятилетиями взыскивали с крестьян. В России после 1861 года казна возместила помещикам землю, а крестьяне выплачивали долг государству 49 лет — пока платежи не отменили в 1907 году, после революции 1905-го."
 concept_nr_fugitive_slaves: "Законы о беглых рабах"
 concept_nr_fugitive_slaves_desc: "Американский закон о беглых рабах 1850 года обязал чиновников и граждан свободных штатов помогать возвращать беглецов и лишил обвиняемых суда присяжных. Задуманный, чтобы успокоить Юг, он обратил многих северян к аболиционизму; через два года вышла «Хижина дяди Тома»."
 concept_nr_slave_import: "Работорговля после запрета"
 concept_nr_slave_import_desc: "Бразилия запретила ввоз рабов в 1831 году под давлением Британии, но закон был «для англичан»: за следующие два десятилетия сотни тысяч африканцев высадили нелегально. Лишь закон Эузебиу ди Кейроша 1850 года, подкреплённый британским флотом, покончил с этой торговлей."
 nr_landowners_grants.21.t: "Конец хлебных законов"
 nr_landowners_grants.21.desc_gov: "Правительство открыло границы для чужого зерна, и собственные министры землевладельцев проголосовали за это. Хлебных пошлин больше нет; имениям придётся продавать по мировой цене."
 nr_landowners_grants.21.desc_opp: "Новое правительство открыло границы для чужого зерна вопреки протестам имений. Хлебных пошлин больше нет, и предводители дворянства говорят о предательстве земли."
 nr_landowners_grants.21.flavor: "«Тот, кто отменил хлебные законы, может звать себя государственным мужем; его партия назовёт его предателем». Депутат-тори, 1846"
 nr_landowners_grants.21.a: "Дешёвый хлеб того стоит."
 nr_landowners_grants.21.b: "Имениям придётся это принять."
 nr_landowners_grants.22.t: "Конец барщины"
 nr_landowners_grants.22.desc_gov: "Крепостное право отменено сверху, с согласия самого дворянства. Крестьяне больше не будут работать на барских полях; имениям придётся нанимать работников, как всем."
 nr_landowners_grants.22.desc_opp: "Реформаторы у власти отменили крепостное право через голову дворянства. Барщина исчезла за одну ночь, и в усадьбах о старом порядке говорят как о потерянной родине."
 nr_landowners_grants.22.flavor: "«Лучше отменить крепостное право сверху, нежели дождаться того времени, когда оно само собою начнёт отменяться снизу». Александр II московскому дворянству, 1856"
 nr_landowners_grants.22.a: "Лучше сверху, чем снизу."
 nr_landowners_grants.22.b: "Старый порядок кончился."
 nr_landowners_grants.23.t: "Беглых больше нет"
 nr_landowners_grants.23.desc_gov: "Рабство отменено, и собственные представители плантаторов подписали закон. Возвращать больше некого: патрули распущены."
 nr_landowners_grants.23.desc_opp: "Рабство отменено через голову плантаторов. Патрули распущены, беглецы — свободные граждане, а на плантациях открыто говорят о сопротивлении."
 nr_landowners_grants.23.flavor: "«Рабство в Бразилии объявляется упразднённым». Золотой закон, 1888"
 nr_landowners_grants.23.a: "Патрули распущены."
 nr_landowners_grants.23.b: "Пусть плантаторы бушуют."
 nr_landowners_grants.24.t: "Гавани закрыты"
 nr_landowners_grants.24.desc_gov: "Работорговле пришёл конец, и собственные министры плантаторов на это согласились. Невольничьи суда больше не будут разгружаться в наших гаванях."
 nr_landowners_grants.24.desc_opp: "Работорговлю прекратили через голову плантаторов. Гавани закрыты для невольничьих судов, а владельцы плантаций подсчитывают руки, которых они уже не получат."
 nr_landowners_grants.24.flavor: "«Торговля кончается не потому, что её запретили, а потому, что суда остановлены». После закона Эузебиу ди Кейроша, 1850"
 nr_landowners_grants.24.a: "Торговля окончена."
 nr_landowners_grants.24.b: "Плантаторы этого не простят."
