l_russian:
 # NR: landowners' grants (feature landowners_grants)
 nr_landowners_grants_option: "Предложить поместьям пожалование от короны."
 nr_landowners_grants_tt: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] предпочтёт пожалование от короны деньгам. Через неделю мы решим, в какой форме оно будет; до тех пор начисляются базовые расходы."
 nr_landowners_grants.1.t: "Пожалования от короны"
 nr_landowners_grants.1.desc: "Мы обещали поместьям не кошелёк, а пожалование. Предводители дворянства принесли в министерство свои пожелания, и список длинный: почести, земля, льготы, кредит — и там, где закон ещё позволяет, чужой труд."
 nr_landowners_grants.1.flavor: "«Деньги тратятся за сезон, а привилегия переходит по наследству». Из письма губернского предводителя"
 nr_landowners_grants.1.a: "Наградить чинами и орденами."
 nr_landowners_grants.1.b: "Пожаловать казённые земли."
 nr_landowners_grants.1.c: "Освободить имения от поземельного налога."
 nr_landowners_grants.1.d: "Защитить их хлеб пошлинами."
 nr_landowners_grants.1.e: "Открыть дворянский земельный банк."
 nr_landowners_grants.1.f: "Подтвердить право помещиков на барщину."
 nr_landowners_grants.1.g: "Возместить помещикам крестьянскую землю."
 nr_landowners_grants.1.h: "Возвращать беглых рабов владельцам."
 nr_landowners_grants.1.i: "Пусть невольничьи суда идут."
 nr_landowners_grants_ranks_tt: "Корона платит почестями: землевладельцы получают только базовые эффекты пожалования."
 nr_landowners_grants_lore_ranks: "#lore Землю можно продать, льготу отменят, а орден носят до самой смерти и хранят в семье как реликвию. Корона платит [Concept('concept_nr_ranks_orders', 'чинами и орденами')] — самой дешёвой монетой в своей казне.#!"
 nr_landowners_grants_lore_crown_lands: "#lore Межевщики проводят новые границы по казённым угодьям, и деревни, век пасшие там скот, оказываются на барской земле. Так шли [Concept('concept_nr_crown_lands', 'раздачи казённых земель')].#!"
 nr_landowners_grants_lore_tax_exemptions: "#lore Рыцарское имение платит службой, а не монетой — так гласит старая привилегия, и казна её чтит. Такова [Concept('concept_nr_noble_tax_exemption', 'податная льгота имений')].#!"
 nr_landowners_grants_lore_corn_laws: "#lore Чужое зерно стоит на границе, пока хлеб дома не подорожает достаточно. Помещики выгодно продают урожай, города дорого покупают хлеб. Таковы были [Concept('concept_nr_corn_laws', 'хлебные законы')].#!"
 nr_landowners_grants_lore_land_bank: "#lore Имения закладывают землю в банке, за который ручается государство, под процент, какого не даст ни один частный заимодавец. Так работали [Concept('concept_nr_land_bank', 'дворянские земельные банки')].#!"
 nr_landowners_grants_lore_corvee: "#lore Три дня в неделю на барском поле, остальные — на своём, если погода позволит. Государство подтверждает то, чего и так требовал обычай: [Concept('concept_nr_corvee', 'барщину')].#!"
 nr_landowners_grants_lore_redemption: "#lore Крестьянин свободен, земля его — когда он за неё заплатит. Казна сразу платит помещику и десятилетиями взыскивает с крестьянина. Такова была [Concept('concept_nr_redemption', 'выкупная операция')].#!"
 nr_landowners_grants_lore_fugitives: "#lore По ночам дороги объезжают патрули, а суды возвращают беглеца хозяину без лишних вопросов. Таковы были [Concept('concept_nr_fugitive_slaves', 'законы о беглых рабах')].#!"
 nr_landowners_grants_lore_slave_import: "#lore Закон против торговли остаётся в своде — для иностранных консулов. В гаванях суда разгружаются как прежде. Такой была [Concept('concept_nr_slave_import', 'работорговля после запрета')].#!"
 nr_landowners_grants.11.t: "Земля и арендаторы"
 nr_landowners_grants.11.desc: "Через десять лет после раздачи казённых земель имения выросли — а с ними и вопрос, кто будет их обрабатывать. Предводители дворянства хотят, чтобы закон сказал прямо: земля помещичья, крестьянин её арендует."
 nr_landowners_grants.11.flavor: "«Крестьянин со своей землёй — это крестьянин, который не придёт на работу». Из прений губернского собрания"
 nr_landowners_grants.11.a: "Выслушать просьбу об аренде."
 nr_landowners_grants.11.c: "Земельный закон останется прежним."
 nr_landowners_grants.11.d: "Земля и так в хороших руках."
 nr_landowners_grants.11.e: "Закрыть."
 nr_landowners_grants_lore_11a: "#lore Помещики просят закона, по которому крестьянин арендует поле, а не владеет им. Пожалованные земли будут обработаны, и имения никогда не останутся без рабочих рук.#!"
 nr_landowners_grants_lore_11c: "#lore Министр благодарит предводителей и объясняет, что правительство довольно земельным законом как он есть. Имения это запомнят.#!"
 nr_landowners_grants_lore_11d: "#lore Помещикам нечего просить: земельный закон и так служит имениям, а пожалованная земля обрабатывается как должно.#!"
 nr_landowners_grants.12.t: "Привилегия навечно"
 nr_landowners_grants.12.desc: "Десять лет имения не платили поземельного налога. Теперь дворянство просит вписать льготу в сам налоговый закон, чтобы ни один будущий министр финансов не мог её отнять."
 nr_landowners_grants.12.flavor: "«Дворянин платит шпагой, а не кошельком». Старая поговорка"
 nr_landowners_grants.12.a: "Вписать дворянскую льготу в налоговый закон."
 nr_landowners_grants.12.c: "Каждое имение платит свою долю."
 nr_landowners_grants.12.e: "Закрыть."
 nr_landowners_grants_lore_12a: "#lore [Concept('concept_nr_noble_tax_exemption', 'Податная льгота имений')] становится частью налогового закона: казна собирает с земли меньше, зато дворянство твёрдо стоит за троном.#!"
 nr_landowners_grants_lore_12c: "#lore Министр финансов напоминает предводителям, что льгота была милостью, а не правом. Когда она кончится, имения будут платить как все.#!"
 nr_landowners_grants.13.t: "Хлеб и границы"
 nr_landowners_grants.13.desc: "Хлебные пошлины десять лет держали имения в достатке. Землевладельцы хотят сделать их постоянными — а там, где торговый закон пускает чужое зерно, и торговый закон, который его не пускает."
 nr_landowners_grants.13.flavor: "«Дешёвый хлеб для города — это дешёвая земля для помещика». Из памфлета"
 nr_landowners_grants.13.a: "Выслушать просьбу о протекционизме."
 nr_landowners_grants.13.b: "Вписать хлебный тариф в закон."
 nr_landowners_grants.13.c: "Пошлины не будут продлены."
 nr_landowners_grants.13.e: "Закрыть."
 nr_landowners_grants_lore_13a: "#lore Помещики хотят большего, чем пошлина на зерно: они хотят, чтобы вся торговая политика защищала внутренний рынок. Промышленность даже согласится — за пошлину на железо. Так начался брак железа и ржи.#!"
 nr_landowners_grants_lore_13b: "#lore [Concept('concept_nr_corn_laws', 'Хлебный тариф')] становится частью торгового закона: имения продают выгодно, города за это платят.#!"
 nr_landowners_grants_lore_13c: "#lore Министр больше не станет облагать рабочий хлеб. Помещики уходят из министерства без своей пошлины, а либеральная пресса празднует.#!"
 nr_landowners_grants.14.t: "Банк имений"
 nr_landowners_grants.14.desc: "Десять лет дворянский земельный банк давал имениям дешёвые ссуды. Дворянство просит сделать его постоянным государственным учреждением."
 nr_landowners_grants.14.flavor: "«Имение заложено, но оно всё ещё наше». Присловье уездного дворянства"
 nr_landowners_grants.14.a: "Сделать дворянский банк постоянным."
 nr_landowners_grants.14.c: "Имения будут занимать как все."
 nr_landowners_grants.14.e: "Закрыть."
 nr_landowners_grants_lore_14a: "#lore [Concept('concept_nr_land_bank', 'Дворянский земельный банк')] становится частью экономического порядка: дешёвый кредит для имений под поручительство государства.#!"
 nr_landowners_grants_lore_14c: "#lore Министр финансов закрывает особое окно. Имениям придётся идти в обычные банки — и платить обычный процент.#!"
 nr_landowners_grants.15.t: "Барщинный устав"
 nr_landowners_grants.15.desc: "Десять лет государство подтверждало право помещиков на труд их крестьян. Теперь дворянство просит устава, который закрепит это навсегда."
 nr_landowners_grants.15.flavor: "«Сперва барское поле, потом Божье, потом своё». Крестьянская поговорка"
 nr_landowners_grants.15.a: "Издать барщинный устав."
 nr_landowners_grants.15.c: "Хватит и обычая, устав не нужен."
 nr_landowners_grants.15.e: "Закрыть."
 nr_landowners_grants_lore_15a: "#lore Устав перечисляет дни, часы и работы, которые крестьянин должен помещику. [Concept('concept_nr_corvee', 'Барщина')] больше не обычай — это закон.#!"
 nr_landowners_grants_lore_15c: "#lore Министр не хочет записывать то, что и так всем известно. Помещики ворчат, крестьяне ничего не замечают.#!"
 nr_landowners_grants.16.t: "Выкупной долг"
 nr_landowners_grants.16.desc: "Казна возместила помещикам крестьянскую землю, и крестьяне выплачивают долг. Дворянство просит сделать это устройство частью земельного закона."
 nr_landowners_grants.16.flavor: "«Мы ваши, а земля наша» — так говорили крестьяне. Выкупные платежи говорили иное."
 nr_landowners_grants.16.a: "Вписать выкупные платежи в земельный закон."
 nr_landowners_grants.16.c: "Операция завершена."
 nr_landowners_grants.16.d: "Имения довольны."
 nr_landowners_grants_lore_16a: "#lore [Concept('concept_nr_redemption', 'Выкупные платежи')] становятся частью земельного закона: крестьянин десятилетиями платит за свою свободу, а имения сохраняют доход.#!"
 nr_landowners_grants_lore_16c: "#lore Министр закрывает выкупной счёт. Что уплачено, то уплачено; других договорённостей не нужно.#!"
 nr_landowners_grants_lore_16d: "#lore Земельный закон не оставляет места для выкупных платежей, а помещики, получив возмещение, больше ничего не просят.#!"
 nr_landowners_grants.17.t: "Собственность в бегах"
 nr_landowners_grants.17.desc: "Десять лет государство ловило беглых рабов для их хозяев. Плантаторы хотят вписать это в закон о рабстве."
 nr_landowners_grants.17.flavor: "«Каждый гражданин обязан содействовать поимке». Из закона о беглых рабах"
 nr_landowners_grants.17.a: "Принять закон о беглых рабах."
 nr_landowners_grants.17.c: "Государство не будет охотиться на рабов."
 nr_landowners_grants.17.e: "Закрыть."
 nr_landowners_grants_lore_17a: "#lore Каждый чиновник и каждый гражданин обязан помогать возвращать беглецов. Плантаторы довольны — а в свободных штатах закон рождает больше аболиционистов, чем любая проповедь. Таковы были [Concept('concept_nr_fugitive_slaves', 'законы о беглых рабах')].#!"
 nr_landowners_grants_lore_17c: "#lore Министр отказывает: патрули распустят, и хозяевам придётся ловить свою собственность самим.#!"
 nr_landowners_grants.18.t: "Открытые гавани"
 nr_landowners_grants.18.desc: "Десять лет невольничьи суда разгружались беспрепятственно. Плантаторы просят снять последние ограничения с торговли."
 nr_landowners_grants.18.flavor: "«Закон для англичан». Бразильская поговорка о запрете 1831 года"
 nr_landowners_grants.18.a: "Разрешить свободный ввоз рабов."
 nr_landowners_grants.18.c: "Торговля останется под ограничениями."
 nr_landowners_grants.18.e: "Закрыть."
 nr_landowners_grants_lore_18a: "#lore Последние пошлины и досмотры уходят: суда разгружаются где хотят. Плантаторы довольны, у аболиционистов за границей и дома — ещё один довод. Такой была [Concept('concept_nr_slave_import', 'работорговля')].#!"
 nr_landowners_grants_lore_18c: "#lore Министр сохраняет портовые досмотры: торговля продолжится, но под присмотром государства.#!"
 nr_landowners_tenant_petition_tt: "Земельный закон: землевладельцы подадут обращение: в течение #v 4#! лет принятие закона [GetLawType('law_tenant_farmers').GetName] пойдёт на #v 25%#! быстрее, а землевладельцы поддержат его при принятии. Если за это время закон не будет принят, они обидятся: #r −2#! к одобрению на 5 лет."
 nr_landowners_protectionism_petition_tt: "Торговый закон: землевладельцы подадут обращение: в течение #v 4#! лет принятие закона [GetLawType('law_protectionism').GetName] пойдёт на #v 25%#! быстрее, а землевладельцы поддержат его при принятии. Если за это время закон не будет принят, они обидятся: #r −2#! к одобрению на 5 лет."
 je_nr_landowners_tenant_petition: "Обращение землевладельцев: аренда"
 je_nr_landowners_tenant_petition_reason: "Землевладельцы просят земельного закона, по которому крестьянин арендует землю. Если мы примем закон [GetLawType('law_tenant_farmers').GetName] в ближайшие годы, это пойдёт быстрее; если нет, имения почувствуют, что их не услышали."
 je_nr_landowners_tenant_petition_status_enacting: "Принимается закон [GetLawType('law_tenant_farmers').GetName]: #g +25%#! к скорости принятия."
 je_nr_landowners_tenant_petition_status_waiting: "Начните принимать закон [GetLawType('law_tenant_farmers').GetName], чтобы получить #v +25%#! к скорости принятия."
 je_nr_landowners_protectionism_petition: "Обращение землевладельцев: протекционизм"
 je_nr_landowners_protectionism_petition_reason: "Землевладельцы просят торговой политики, которая защищает внутренний рынок. Если мы примем закон [GetLawType('law_protectionism').GetName] в ближайшие годы, это пойдёт быстрее; если нет, имения почувствуют, что их не услышали."
 je_nr_landowners_protectionism_petition_status_enacting: "Принимается закон [GetLawType('law_protectionism').GetName]: #g +25%#! к скорости принятия."
 je_nr_landowners_protectionism_petition_status_waiting: "Начните принимать закон [GetLawType('law_protectionism').GetName], чтобы получить #v +25%#! к скорости принятия."
 amendment_nr_landowners_noble_privilege: "Дворянская льгота"
 amendment_nr_landowners_noble_privilege_desc: "Имения платят меньше налогов с ферм и плантаций. Казна теряет часть дохода, зато дворянство твёрдо стоит за троном и вкладывает сбережённое в свою землю."
 amendment_nr_landowners_grain_tariff: "Хлебный тариф"
 amendment_nr_landowners_grain_tariff_desc: "Чужое зерно платит пошлину на границе. Имения выгодно продают урожай; хлеб в городах дороже, и промышленники, которые платят жалованье, этим недовольны."
 amendment_nr_landowners_land_bank: "Дворянский земельный банк"
 amendment_nr_landowners_land_bank_desc: "Банк под поручительство государства даёт имениям дешёвые ссуды. Хозяйства быстрее обновляются; государство платит чуть больше по своим займам."
 amendment_nr_landowners_corvee_statute: "Барщинный устав"
 amendment_nr_landowners_corvee_statute_desc: "Труд, который крестьяне должны помещику, закреплён законом. Имения производят больше; крестьяне живут хуже и охотнее слушают тех, кто обещает им землю."
 amendment_nr_landowners_fugitive_law: "Закон о беглых рабах"
 amendment_nr_landowners_fugitive_law_desc: "Чиновники и граждане обязаны помогать возвращать беглых рабов владельцам. Плантаторы усиливаются; в свободных областях закон многих обращает к аболиционизму."
 amendment_nr_landowners_free_import: "Свободный ввоз"
 amendment_nr_landowners_free_import_desc: "Сняты последние ограничения на работорговлю: рабов ввозят больше, плантации производят больше. Пока действует, движение сторонников рабства каждый год получает #g −0,1#! к радикализму; поддержка аболиционистов растёт."
 nr_landowners_grants_favor: "Пожалования от короны"
