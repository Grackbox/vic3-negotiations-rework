l_russian:
 # NR: the Landowners' places in the provinces (feature landowners_offices)
 nr_landowners_offices.1.elections: "Дворянские выборы."
 nr_landowners_offices_lore_elections: "#lore Раз в три года дворянство губернии выбирает своего предводителя, судей и опекунов. [Concept('concept_nr_noble_elections', 'Дворянское собрание')] даёт имениям голос, который корона должна слышать.#!"
 concept_nr_noble_elections: "Дворянские выборы"
 concept_nr_noble_elections_desc: "В России после Жалованной грамоты 1785 года и во многих землях Центральной Европы дворянство каждой губернии собиралось на собрания, выбирало предводителей и замещало местные должности из своей среды. Государство экономило на чиновниках, а губерниями управляли те, кому принадлежала земля."
 nr_landowners_offices.1.patrimonial: "Вотчинный суд."
 nr_landowners_offices_lore_patrimonial: "#lore Помещик сам судит своих крестьян. [Concept('concept_nr_patrimonial', 'Вотчинная юстиция')] дёшево обходится государству — и крестьяне знают, чей это суд.#!"
 concept_nr_patrimonial: "Вотчинная юстиция"
 concept_nr_patrimonial_desc: "В Пруссии помещики держали собственный суд над крестьянами до 1849 года, в России помещик судил и наказывал крепостных до 1861-го. Правосудие ничего не стоило казне, а каждый спор о земле решала одна из сторон."
 nr_landowners_offices_patrimonial: "Вотчинный суд"
 nr_landowners_offices.1.justices: "Мировые судьи из дворян."
 nr_landowners_offices_lore_justices: "#lore Сельский сквайр хранит мир без жалованья. [Concept('concept_nr_justices', 'Мировые судьи')] — прежде всего джентльмены и лишь потом судьи.#!"
 concept_nr_justices: "Мировые судьи"
 concept_nr_justices_desc: "В Англии неоплачиваемые мировые судьи из земельного джентри управляли графствами: судили мелкие дела, назначали налог в пользу бедных, выдавали лицензии пивным. Порядок продержался до выборных советов графств 1888 года."
 nr_landowners_offices_justices: "Мировые судьи из дворян"
 nr_landowners_offices.1.constabulary: "Уездная стража."
 nr_landowners_offices_lore_constabulary: "#lore Стражник подчиняется усадьбе, а не министерству. [Concept('concept_nr_constabulary', 'Помещичья полиция')] держит деревню в тишине — и деревня знает, кто ей платит.#!"
 concept_nr_constabulary: "Помещичья полиция"
 concept_nr_constabulary_desc: "В прусской деревне помещик держал полицейскую власть в своём имении до 1872 года; русского земского исправника выбирало местное дворянство до 1862-го. Порядок в деревнях поддерживали те, чьи поля их окружали."
 nr_landowners_offices_constabulary: "Уездная стража"
 nr_landowners_offices.1.assemblies: "Губернские собрания."
 nr_landowners_offices_lore_assemblies: "#lore Имения собираются, голосуют за дороги и школы и посылают своих людей во все управы. [Concept('concept_nr_assemblies', 'Губернское самоуправление')] — школа политики, но для дворянства.#!"
 concept_nr_assemblies: "Губернское самоуправление"
 concept_nr_assemblies_desc: "Русские земства 1864 года и прусские окружные сеймы дали провинции самоуправление, но выборы по сословиям или по имуществу оставляли большинство в собраниях за дворянством. Появились дороги, школы и врачи — и влияние усадьбы."
 nr_landowners_offices_assemblies: "Губернские собрания"
 nr_landowners_offices.1.tax_farming: "Откуп податей."
 nr_landowners_offices_lore_tax_farming: "#lore Имение собирает государевы подати со своих деревень и оставляет себе долю за хлопоты. [Concept('concept_nr_tax_farming', 'Сбор через имения')] приносит деньги быстро — но не все они доходят до казны.#!"
 concept_nr_tax_farming: "Сбор податей через имения"
 concept_nr_tax_farming_desc: "В России помещик отвечал за подушную подать своих крепостных; в Османской империи и во многих старых державах налоги отдавались на откуп местной знати. Государство экономило на сборщиках и теряло то, что прилипало к их рукам."
 nr_landowners_offices_tax_farming: "Откуп податей"
 nr_landowners_offices.1.patrols: "Невольничьи патрули."
 nr_landowners_offices_lore_patrols: "#lore По ночам конные разъезды объезжают дороги и требуют пропуск у каждого чернокожего. [Concept('concept_nr_patrols', 'Патрули')] держат плантации в страхе — а свободные штаты смотрят на это со всё большим гневом.#!"
 concept_nr_patrols: "Невольничьи патрули"
 concept_nr_patrols_desc: "На американском Юге каждый белый мужчина призывного возраста мог быть вызван в патруль: плантаторы и их соседи проверяли пропуска, обыскивали невольничьи хижины и наказывали всех, кого находили ночью вне дома. Патрули были ополчением плантаторского порядка."
 nr_landowners_offices_patrols: "Невольничьи патрули"
 nr_landowners_offices.1.state_slaves: "Казённые рабы."
 nr_landowners_offices_lore_state_slaves: "#lore Казна берёт у плантаторов рабов внаём для своих дорог, доков и рудников. [Concept('concept_nr_state_slaves', 'Казённые рабы')] строят дёшево — и умирают так же дёшево.#!"
 concept_nr_state_slaves: "Казённые рабы"
 concept_nr_state_slaves_desc: "В Бразилии «рабы нации» работали в казённых имениях и на общественных работах; испанской короне принадлежали рабы медных рудников Эль-Кобре на Кубе до 1800 года; в США Капитолий отчасти строили рабы, нанятые у владельцев. Плантаторы получали плату, государство — дешёвые руки."
 nr_landowners_offices_state_slaves: "Казённые рабы"
 nr_landowners_offices.1.officers: "Дворянский офицерский корпус."
 nr_landowners_offices_lore_officers: "#lore Сыновья усадеб носят эполеты, как носили их отцы. [Concept('concept_nr_officers', 'Дворянский офицерский корпус')] верен и храбр — но чины идут по рождению, а не по заслугам.#!"
 concept_nr_officers: "Дворянский офицерский корпус"
 concept_nr_officers_desc: "Прусский офицерский корпус почти целиком набирался из юнкерского дворянства; в Британии офицерские патенты покупались до 1871 года. Армия под командой землевладельцев была верна престолу и имениям — и медленно менялась."
 nr_landowners_offices_officers: "Дворянский офицерский корпус"
 nr_landowners_offices.1.recruits: "Рекрутская разнарядка."
 nr_landowners_offices_lore_recruits: "#lore Государство требует столько-то рекрутов со ста душ, а помещик решает, чьи сыновья пойдут. [Concept('concept_nr_recruits', 'Рекрутчина через имения')] пополняет полки — и избавляет деревню от строптивых.#!"
 concept_nr_recruits: "Рекрутчина через имения"
 concept_nr_recruits_desc: "До 1874 года Россия набирала солдат рекрутскими наборами с деревень: помещик сам решал, кого из крепостных отдать на двадцать пять лет службы. Это было и орудием армии, и наказанием в руках усадьбы."
 nr_landowners_offices_recruits: "Рекрутская разнарядка"
 nr_landowners_offices.1.naval: "Морской кадетский корпус."
 nr_landowners_offices_lore_naval: "#lore Дворянство отправляет младших сыновей на флот. [Concept('concept_nr_naval', 'Дворянские морские офицеры')] гордо несут флаг — а купеческих шкиперов на шканцы не пускают.#!"
 concept_nr_naval: "Дворянские морские офицеры"
 concept_nr_naval_desc: "Русский Морской кадетский корпус принимал только дворянских сыновей; на флоте Его Величества шканцы принадлежали младшим сыновьям джентри. Флот джентльменов был горд и храбр — и закрыт для людей из торгового флота."
 nr_landowners_offices_naval: "Морской кадетский корпус"
 nr_landowners_offices.1.chancery: "Места в канцеляриях."
 nr_landowners_offices_lore_chancery: "#lore Министерства наполняются молодыми людьми из хороших семей. [Concept('concept_nr_chancery', 'Места для дворян')] делают аппарат верным — а родословная весит больше экзамена.#!"
 concept_nr_chancery: "Места для дворян"
 concept_nr_chancery_desc: "Табель о рангах 1722 года связала дворянство с государственной службой; в Пруссии окружного ландрата выбирали из местного дворянства. Бюрократию старого порядка наполнял землевладельческий класс, и служила она его интересам."
 nr_landowners_offices_chancery: "Места в канцеляриях"
 nr_landowners_offices_option: "Предложить имениям места в губерниях."
 nr_landowners_offices_tt: "Дворянство займёт местные должности в губерниях: государственная бюрократия теряет столько же, сколько при ванильных местах в администрации, а землевладельцы получают политическую силу на 10 лет. Через неделю они скажут, какие места хотят; одни обходятся бюрократии дешевле, другие дороже."
 nr_landowners_offices_base_tt: "Только базовые эффекты: без дополнительных должностей, штраф к бюрократии остаётся прежним."
 nr_landowners_offices.1.t: "Места в губерниях"
 nr_landowners_offices.1.desc: "Предводители дворянства составили свой список. Имения готовы взять на себя работу государства в губерниях — на своих условиях и своими людьми."
 nr_landowners_offices.1.flavor: "«Дворянин — прирождённый попечитель деревни». Из адреса губернского дворянского собрания"
 nr_landowners_offices_benefits: "Места в губерниях"
 nr_landowners_offices_penalty_1: "Должности в руках дворянства"
 nr_landowners_offices_penalty_2: "Должности в руках дворянства"
 nr_landowners_offices_penalty_3: "Должности в руках дворянства"
 nr_landowners_offices_declined: "Просьба имений отклонена"
 nr_landowners_offices_content: "Имения довольны"
 nr_landowners_offices.fu.petition: "Поддержать обращение имений."
 nr_landowners_offices.fu.amendment: "Закрепить это в законе."
 nr_landowners_offices.fu.decline: "Не сейчас."
 nr_landowners_offices.fu.thanks: "Имения благодарят."
 nr_landowners_offices.fu.nothing: "Закреплять в законе сейчас нечего."
 nr_debug.8.t: "Отладка: места землевладельцев в губерниях"
 nr_debug.8.desc: "Событие выбора формы и итоги (каждый ставит отметку своей формы)."
 nr_debug.8.form: "Событие выбора формы"
 nr_debug.8.close: "Закрыть."
 nr_debug.8.patrimonial: "Вотчинный суд"
 nr_debug.8.justices: "Мировые судьи из дворян"
 nr_debug.8.constabulary: "Уездная стража"
 nr_debug.8.assemblies: "Губернские собрания"
 nr_debug.8.tax_farming: "Откуп податей"
 nr_debug.8.patrols: "Невольничьи патрули"
 nr_debug.8.state_slaves: "Казённые рабы"
 nr_debug.8.officers: "Дворянский офицерский корпус"
 nr_debug.8.recruits: "Рекрутская разнарядка"
 nr_debug.8.naval: "Морской кадетский корпус"
 nr_debug.8.chancery: "Места в канцеляриях"
 nr_landowners_offices.11.t: "Вотчинные суды"
 nr_landowners_offices.11.desc: "Прошло десять лет вотчинных судов. Землевладельцы просят вписать суд помещика в земельный закон, чтобы ни один министр не мог его отнять."
 nr_landowners_offices_lore_11_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_patrimonial_justice').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.12.t: "Благодарность сквайров"
 nr_landowners_offices.12.desc: "Десять лет джентри хранит мир в графствах. Они довольны порядком вещей."
 nr_landowners_offices_lore_12_thanks: "#lore Имения помнят, кто им доверял.#!"
 nr_landowners_offices.13.t: "Помещичья полиция"
 nr_landowners_offices.13.desc: "Десять лет усадьбы следят за порядком в деревне. Теперь землевладельцы хотят закрепить это законом: либо закон о полиции, либо свою власть в уже существующей."
 nr_landowners_offices_lore_13_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_noble_guard').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.14.t: "Губернские собрания"
 nr_landowners_offices.14.desc: "Десять лет губернскими собраниями управляют имения. Землевладельцы хотят такого же веса и в общегосударственных выборах."
 nr_landowners_offices_lore_14_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_noble_curia').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.15.t: "Отчёт сборщиков"
 nr_landowners_offices.15.desc: "Десять лет имения собирали подати со своих деревень. Счёт закрыт, и землевладельцы благодарны за доверие."
 nr_landowners_offices_lore_15_thanks: "#lore Имения помнят, кто им доверял.#!"
 nr_landowners_offices.16.t: "Патрульный устав"
 nr_landowners_offices.16.desc: "Десять лет патрули объезжают дороги. Плантаторы просят сделать их обязанностью, записанной в законе о рабстве."
 nr_landowners_offices_lore_16_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_patrol_statute').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.17.t: "Рабы нации"
 nr_landowners_offices.17.desc: "Десять лет казна нанимает рабов у плантаторов. Плантаторы хотят, чтобы этот порядок был записан в законе."
 nr_landowners_offices_lore_17_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_state_slaves').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.18.t: "Патенты для дворян"
 nr_landowners_offices.18.desc: "Десять лет офицерский корпус пополняется из усадеб. Землевладельцы просят сделать дворянские патенты частью армейского закона."
 nr_landowners_offices_lore_18_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_noble_commissions').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.19.t: "Наборы сданы"
 nr_landowners_offices.19.desc: "Десять лет усадьбы сдают рекрутов. Землевладельцы благодарны за доверие."
 nr_landowners_offices_lore_19_thanks: "#lore Имения помнят, кто им доверял.#!"
 nr_landowners_offices.20.t: "Морской ценз"
 nr_landowners_offices.20.desc: "Десять лет шканцы принадлежат джентри. Землевладельцы просят записать это в морской закон."
 nr_landowners_offices_lore_20_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_naval_census').GetName]» добавляется к действующему закону.#!"
 nr_landowners_offices.21.t: "Служба по рождению"
 nr_landowners_offices.21.desc: "Десять лет канцелярии наполняются дворянскими сыновьями. Землевладельцы хотят, чтобы служба по рождению стала правилом."
 nr_landowners_offices_lore_21_amendment: "#lore Поправка «[GetAmendmentType('amendment_nr_landowners_service_census').GetName]» добавляется к действующему закону.#!"
 amendment_nr_landowners_patrimonial_justice: "Вотчинная юстиция"
 amendment_nr_landowners_patrimonial_justice_desc: "Помещик судит своих крестьян по мелким делам. Государство экономит на местных судах, крестьяне живут хуже."
 amendment_nr_landowners_noble_guard: "Дворянская стража"
 amendment_nr_landowners_noble_guard_desc: "Местной полицией командуют люди из усадеб. Государству она обходится дешевле, имения приобретают влияние, деревня его теряет."
 amendment_nr_landowners_noble_curia: "Дворянская курия"
 amendment_nr_landowners_noble_curia_desc: "Поместное дворянство голосует в собственной курии с дополнительным весом. Имения усиливаются, либералы становятся громче."
 amendment_nr_landowners_patrol_statute: "Патрульный устав"
 amendment_nr_landowners_patrol_statute_desc: "Патрульная повинность записана в законе о рабстве. Восстания рабов труднее начать; у аболиционистов прибавляется сторонников."
 amendment_nr_landowners_state_slaves: "Рабы нации"
 amendment_nr_landowners_state_slaves_desc: "Государство нанимает рабов у плантаторов для казённых работ. Стройки идут быстрее; у аболиционистов прибавляется сторонников."
 amendment_nr_landowners_noble_commissions: "Дворянские патенты"
 amendment_nr_landowners_noble_commissions_desc: "Офицеры служат за честь, а не за жалованье. Армия дешевле, офицеры влиятельнее, но заслуги значат меньше."
 amendment_nr_landowners_naval_census: "Морской ценз"
 amendment_nr_landowners_naval_census_desc: "Морские чины оставлены за джентри. Флот дешевле содержать, и им гордятся больше."
 amendment_nr_landowners_service_census: "Дворянский ценз на службу"
 amendment_nr_landowners_service_census_desc: "Государственные должности в первую очередь достаются дворянству. Аппарат обходится дешевле, университеты теряют влияние."
 nr_landowners_police_petition_tt: "Землевладельцы подадут обращение: в течение #v 4#! лет принятие закона [GetLawType('law_local_police').GetName] пойдёт на #v 25%#! быстрее, а землевладельцы поддержат его при принятии. Если за это время закон не будет принят, они обидятся: #r −2#! к одобрению на 5 лет."
 je_nr_landowners_police_petition: "Обращение землевладельцев: [GetLawType('law_local_police').GetName]"
 je_nr_landowners_police_petition_reason: "Землевладельцы просят закон [GetLawType('law_local_police').GetName]. Если мы примем его в ближайшие годы, это пойдёт быстрее; если нет, имения почувствуют, что их не услышали."
 je_nr_landowners_police_petition_status_enacting: "Принимается закон [GetLawType('law_local_police').GetName]: #g +25%#! к скорости принятия."
 je_nr_landowners_police_petition_status_waiting: "Начните принимать закон [GetLawType('law_local_police').GetName], чтобы получить #v +25%#! к скорости принятия."
 nr_landowners_police_petition_speed: "При поддержке имений"
 nr_landowners_police_petition_ignored: "Обращение землевладельцев проигнорировано"
 nr_landowners_landed_petition_tt: "Землевладельцы подадут обращение: в течение #v 4#! лет принятие закона [GetLawType('law_landed_voting').GetName] пойдёт на #v 25%#! быстрее, а землевладельцы поддержат его при принятии. Если за это время закон не будет принят, они обидятся: #r −2#! к одобрению на 5 лет."
