 nr_landowners_offices.31.t: "Конец вотчинных судов"
 nr_landowners_offices.31.desc_gov: "Новый земельный закон передал крестьян государственным судам, и собственные министры землевладельцев с этим согласились. Помещики больше не судят свои деревни."
 nr_landowners_offices.31.desc_opp: "Реформаторы у власти упразднили вотчинные суды через голову имений. В усадьбах говорят о конце старого порядка."
 nr_landowners_offices.31.flavor: "«Вотчинная юрисдикция отменяется». Прусский указ, 1849"
 nr_landowners_offices.31.a: "Теперь судит государство."
 nr_landowners_offices.31.b: "Имениям придётся это принять."
 nr_landowners_offices.32.t: "Государственная полиция"
 nr_landowners_offices.32.desc_gov: "Профессиональная полиция сменила помещичьих стражников с согласия землевладельцев в правительстве. Усадьба больше не следит за порядком в деревнях."
 nr_landowners_offices.32.desc_opp: "Правительство подчинило деревню государственной полиции вопреки протестам имений. Стражники теперь отвечают перед министерством."
 nr_landowners_offices.32.flavor: "«Полиция принадлежит государству, а не усадьбе». Из министерского циркуляра"
 nr_landowners_offices.32.a: "Порядок есть порядок."
 nr_landowners_offices.32.b: "Усадьбы лишились стражи."
 nr_landowners_offices.33.t: "Один человек — один голос"
 nr_landowners_offices.33.desc_gov: "Пришло всеобщее избирательное право, и землевладельцы в правительстве проголосовали за него. Губернские собрания больше не будут принадлежать имениям."
 nr_landowners_offices.33.desc_opp: "Всеобщее избирательное право провели через голову имений. Теперь крестьяне перевешивают усадьбу в каждом собрании."
 nr_landowners_offices.33.flavor: "«Крестьянин голосует, а помещик напрасно пересчитывает бюллетени». Из губернской газеты"
 nr_landowners_offices.33.a: "Народ сказал своё слово."
 nr_landowners_offices.33.b: "Имения в меньшинстве."
 nr_landowners_offices.34.t: "Сборщиков распустили"
 nr_landowners_offices.34.desc_gov: "Новый налог собирают собственные чиновники государства, и министры землевладельцев с этим согласились. Имения больше не занимаются податями."
 nr_landowners_offices.34.desc_opp: "Правительство отняло сбор податей у имений вопреки их протестам. Усадьбы лишаются своей доли."
 nr_landowners_offices.34.flavor: "«Налог, собранный государством, доходит до государства». Из доклада министра финансов"
 nr_landowners_offices.34.a: "Казна собирает своё сама."
 nr_landowners_offices.34.b: "Имения теряют свою долю."
 nr_landowners_offices.35.t: "Патрули распущены"
 nr_landowners_offices.35.desc_gov: "Рабство отменено, и представители плантаторов сами подписали закон. Патрулировать больше некого."
 nr_landowners_offices.35.desc_opp: "Рабство отменено через голову плантаторов. Патрули распущены, а на плантациях открыто говорят о сопротивлении."
 nr_landowners_offices.35.flavor: "«По ночам дороги свободны». Из воспоминаний вольноотпущенника"
 nr_landowners_offices.35.a: "Патрули больше не выезжают."
 nr_landowners_offices.35.b: "Пусть плантаторы бушуют."
 nr_landowners_offices.36.t: "Рабы нации свободны"
 nr_landowners_offices.36.desc_gov: "Рабство отменено, и министры плантаторов с этим согласились. Казённые работы будут делать наёмные руки."
 nr_landowners_offices.36.desc_opp: "Рабство отменено через голову плантаторов. Плата за рабский труд исчезла, и плантаторы подсчитывают убытки."
 nr_landowners_offices.36.flavor: "«Нация больше не будет владеть людьми». После Золотого закона, 1888"
 nr_landowners_offices.36.a: "Работы продолжат свободные руки."
 nr_landowners_offices.36.b: "Плантаторы этого не простят."
 nr_landowners_offices.37.t: "Офицеры из рядовых"
 nr_landowners_offices.37.desc_gov: "Новый армейский закон открывает офицерский корпус для всех, и землевладельцы в правительстве с этим согласились. Рождение больше не решает, кто командует."
 nr_landowners_offices.37.desc_opp: "Новый армейский закон провели через голову имений. Сыновьям усадеб теперь придётся соперничать с сыновьями лавочников."
 nr_landowners_offices.37.flavor: "«Каждый солдат носит в ранце маршальский жезл». Приписывается Наполеону"
 nr_landowners_offices.37.a: "Теперь решают заслуги."
 nr_landowners_offices.37.b: "Дворянство лишается эполет."
 nr_landowners_offices.38.t: "Конец рекрутчины"
 nr_landowners_offices.38.desc_gov: "Новый армейский закон отменяет наборы с деревень, и министры землевладельцев с этим согласились. Усадьба больше не решает, кто идёт на войну."
 nr_landowners_offices.38.desc_opp: "Наборы отменены через голову имений. Усадьбы лишаются самого страшного наказания."
 nr_landowners_offices.38.flavor: "«Защита престола и отечества есть священная обязанность каждого русского подданного». Устав о всеобщей воинской повинности, 1874"
 nr_landowners_offices.38.a: "Служба для всех."
 nr_landowners_offices.38.b: "Усадьбы теряют рычаг."
 nr_landowners_offices.39.t: "Выборные должности"
 nr_landowners_offices.39.desc_gov: "Новый закон о бюрократии делает должности выборными, и землевладельцы в правительстве с этим согласились. Рождение больше не открывает двери канцелярий."
 nr_landowners_offices.39.desc_opp: "Выборные чиновники сменили дворянских сыновей через голову имений. Канцелярии наполняются чужими людьми."
 nr_landowners_offices.39.flavor: "«Должность — это доверие, а не наследство». Из памфлета реформаторов"
 nr_landowners_offices.39.a: "Должности — способным."
 nr_landowners_offices.39.b: "Дворянских сыновей выставили за дверь."
