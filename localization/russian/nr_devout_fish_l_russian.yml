l_russian:
 # NR: Devout request for fishing wharves (feature devout_fish)
 nr_devout_fish_lore: "#lore Мясо запрещено треть дней в году, рыба — нет. Епископы напоминают, кто кормит рынки по пятницам и в Великий пост: [Concept('concept_nr_lenten_fish', 'постная рыба')] кормит и верующих, и рыбаков.#!"
 concept_nr_lenten_fish: "Постная рыба"
 concept_nr_lenten_fish_desc: "Церковь запрещала мясо по пятницам и в Великий пост, но позволяла рыбу, и веками пост определял рыболовство христианской Европы. Португальские и баскские флоты пересекали Атлантику к банкам Ньюфаундленда за солёной треской, ставшей бакальяу; православные держали около двухсот постных дней в году. Даже протестантская Англия, отменившая обязательный пост, в 1563 году приняла закон о «рыбных днях», чтобы поддержать своих рыбаков и флот, который набирал из них матросов."
