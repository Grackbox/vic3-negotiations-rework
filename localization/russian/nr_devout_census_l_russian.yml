l_russian:
 # NR: Clerical Census for Officials (feature devout_census)
 nr_devout_census.1.t: "Кто может служить государству?"
 nr_devout_census.1.desc: "Пока обсуждается закон о назначаемых чиновниках, духовенство предлагает условие: каждый чиновник должен быть государственной веры и иметь свидетельство от прихода. Университеты называют это возвратом в Средневековье."
 nr_devout_census.1.flavor: "«Сначала метрика о крещении, потом диплом». Из прений в Государственном совете"
 nr_devout_census.1.a: "Государственная служба светская."
 nr_devout_census.1.b: "Духовный ценз для чиновников."
 nr_devout_census.1.c: "Пусть решат университеты."
 nr_devout_census_lore_1a: "#lore Чиновника выбирают за знания, а не за исповедание. Без этой статьи закон пройдёт быстрее — а церковь запомнит, кто ей отказал.#!"
 nr_devout_census_lore_1b: "#lore Служба остаётся назначаемой, но дорога в неё идёт через приход: [Concept('concept_nr_seminarists', 'семинаристы')] получают места, выпускники университетов — очередь. Прения затянутся.#!"
 nr_devout_census_lore_1c: "#lore Профессоров спрашивают, кому служить государству, и они отвечают без колебаний: их собственным выпускникам. Церковь запомнит, кого спросили вместо неё.#!"
 nr_devout_census.2.t: "Семинария и канцелярия"
 nr_devout_census.2.desc: "Десять лет поповичи переписывали наши законы и вели наши книги. Теперь архиереи просят сделать это правилом: назначаемые чиновники и духовный ценз для всех назначенных."
 nr_devout_census.2.flavor: "«Семинария учит латыни, послушанию и хорошему почерку — всему, что нужно канцелярии». Замечание министра"
 nr_devout_census.2.a: "Выслушать просьбу о назначаемых чиновниках."
 nr_devout_census.2.b: "Ввести духовный ценз для чиновников."
 nr_devout_census.2.c: "Служба открыта для всех."
 nr_devout_census.2.e: "Закрыть."
 nr_devout_census_lore_2a: "#lore Архиереи просят назначаемых чиновников вместо наследственных или выборных мест — и духовного ценза для всех назначенных. Ценз придёт вместе с законом.#!"
 nr_devout_census_petition_tt: "Духовенство подаст обращение: в течение #v 4#! лет принятие закона [GetLawType('law_appointed_bureaucrats').GetName] пойдёт на #v 25%#! быстрее, клерикалы поддержат его при принятии, а поправка [GetAmendmentType('amendment_nr_devout_census').GetName] войдёт в него #v автоматически#!. Если за это время закон не будет принят, клерикалы обидятся: #r −2#! к одобрению на 5 лет."
 nr_devout_census_lore_2b: "#lore Чиновники уже назначаются; теперь дорога на службу пойдёт через приход. [Concept('concept_nr_seminarists', 'Семинаристы')] остаются в канцеляриях надолго.#!"
 nr_devout_census_lore_2c: "#lore Министр благодарит архиереев: канцелярии будут брать лучших, какой бы веры они ни были. Семинаристам придётся соперничать с университетскими.#!"
 je_nr_devout_census_petition: "Обращение духовенства: назначаемые чиновники"
 je_nr_devout_census_petition_reason: "Духовенство просит ввести назначаемых чиновников с духовным цензом для всех назначенных. Если мы примем закон [GetLawType('law_appointed_bureaucrats').GetName] в ближайшие годы, это пойдёт быстрее, и ценз войдёт в закон; если нет, церковь почувствует, что её не услышали."
 je_nr_devout_census_petition_status_enacting: "Принимается закон [GetLawType('law_appointed_bureaucrats').GetName]: #g +25%#! к скорости принятия."
 je_nr_devout_census_petition_status_waiting: "Начните принимать закон [GetLawType('law_appointed_bureaucrats').GetName], чтобы получить #v +25%#! к скорости принятия; поправка [GetAmendmentType('amendment_nr_devout_census').GetName] войдёт в него автоматически."
 amendment_nr_devout_census: "Духовный ценз для чиновников"
 amendment_nr_devout_census_desc: "На государственную службу назначают только людей государственной веры со свидетельством от прихода: семинаристы заполняют канцелярии, а выпускники университетов ждут своей очереди."
 nr_devout_census_petition_speed: "При поддержке духовенства"
 nr_devout_census_petition_ignored: "Обращение духовенства проигнорировано"
 nr_devout_census_declined: "Духовному цензу отказано"
 nr_devout_census_secular_service: "Государственная служба светская"
 nr_devout_census_debate: "Прения о духовном цензе"
 nr_devout_census_rejected: "Духовный ценз не вошёл в закон"
 nr_devout_census_universities_heard: "Университеты выслушали"
