l_russian:
 # NR: Devout church officials (negotiation option 2)
 nr_devout_officials_penalty_1: "$negotiation_bureaucracy$"
 nr_devout_officials_penalty_2: "$negotiation_bureaucracy$"
 nr_devout_officials_penalty_3: "$negotiation_bureaucracy$"
 nr_devout_officials_option: "Предложить церкви места в администрации."
 nr_devout_officials_tt: "[SCOPE.gsInterestGroup('ig').GetLeader.GetFullName] поддержит нас, если духовенство получит места в государственном аппарате. Через неделю мы решим, куда направить церковных чиновников: от этого зависят эффекты и итоговая нагрузка на бюрократию."
 nr_devout_officials_benefits: "Церковные должности"
 nr_devout_officials.1.t: "Места для духовенства"
 nr_devout_officials.1.desc: "Мы обещали церкви места в администрации, и [SCOPE.sCharacter('ig_leader').GetFullName] ждёт, что слово будет сдержано. Куда направить церковных чиновников, решать нам."
 nr_devout_officials.1.flavor: "«Отдавайте кесарево кесарю, а Божие Богу». Евангелие от Матфея, 22:21"
 nr_devout_officials.1.a: "Пусть служат советниками при министерствах."
 nr_devout_officials.1.b: "Учредить духовно-цензурные комитеты."
 nr_devout_officials.1.c: "Поручить приходам вести метрические книги."
 nr_devout_officials.1.d: "Поручить церкви крещение и браки рабов."
 nr_devout_officials.1.e: "Собирать церковный налог через казну."
 nr_devout_officials.1.f: "Отдать церкви попечение о тюрьмах."
 nr_devout_officials.1.g: "Доверить церкви календарь и государственные торжества."
 nr_devout_officials.1.h: "Принять семинаристов на гражданскую службу."
 nr_devout_officials.1.i: "Ввести синодальное управление церковью."
 nr_devout_officials_base_tt: "Клирики получают места советников и секретарей в разных ведомствах. Кроме базовых эффектов, ничего не меняется."
 nr_devout_officials_censorship: "Духовно-цензурные комитеты"
 nr_devout_officials_registers: "Метрические книги"
 nr_devout_officials_slaves: "Церковь и рабы"
 nr_devout_officials_church_tax: "Церковный налог"
 nr_devout_officials_prisons: "Тюремное попечение"
 nr_devout_officials_calendar: "Церковный календарь"
 nr_devout_officials_seminarists: "Семинаристы в канцеляриях"
 nr_devout_officials_synod: "Синодальное управление"
 nr_devout_officials_lore_base: "#lore В каждом министерстве найдётся стол для человека в рясе: он не подписывает бумаг, но все знают, чьё мнение он передаёт.#!"
 nr_devout_officials_lore_censorship: "#lore Прежде чем книга попадёт в лавку, её прочтёт монах с красным карандашом. Так работала [Concept('concept_nr_spiritual_censorship', 'духовная цензура')] от Рима до Петербурга.#!"
 nr_devout_officials_lore_registers: "#lore Крестили, венчали, отпевали — и каждый раз записывали. Приходские [Concept('concept_nr_parish_registers', 'метрические книги')] знали о народе больше, чем любая перепись.#!"
 nr_devout_officials_lore_slaves: "#lore Священник записывает в книгу крещений имя, которое хозяин дал вчера. Перед Богом этот человек теперь брат, и что это значит на земле, ещё долго будет мучить [Concept('concept_nr_church_and_slavery', 'церкви Нового Света')].#!"
 nr_devout_officials_lore_church_tax: "#lore Сборщик налогов стучит в дверь дважды: сначала за казну, потом за приход. [Concept('concept_nr_church_tax', 'Церковный налог')] делает из казначейства церковную кассу.#!"
 nr_devout_officials_lore_prisons: "#lore Одиночная камера, Библия и тишина: заключённый должен остаться наедине с совестью. Так задумывали [Concept('concept_nr_penitentiary', 'пенитенциарную систему')], и так её проклинали те, кто в ней сидел.#!"
 nr_devout_officials_lore_calendar: "#lore В седьмой день фабрика молчит, лавки закрыты, а газета выходит с портретом государя на первой полосе. [Concept('concept_nr_church_calendar', 'Церковный календарь')] задаёт ритм всей стране.#!"
 nr_devout_officials_lore_seminarists: "#lore Сын сельского священника, выпускник семинарии, переписывает проект закона каллиграфическим почерком. Через двадцать лет он сам будет писать законы. Так начинали многие [Concept('concept_nr_seminarists', 'поповичи на гражданской службе')].#!"
 nr_devout_officials_lore_synod: "#lore Митрополит служит литургию, а в соседнем кабинете обер-прокурор решает, кого из архиереев переводить в Тобольск. Так выглядело [Concept('concept_nr_synod', 'синодальное управление')].#!"
 concept_nr_spiritual_censorship: "Духовная цензура"
 concept_nr_spiritual_censorship_desc: "Церковь веками следила за тем, что читают верующие. Католический Индекс запрещённых книг впервые издан в 1559 году и отменён только в 1966-м. В Российской империи богословские и церковные сочинения проходили особую духовную цензуру: духовно-цензурные комитеты работали в Петербурге и Москве, их устав утвердили в 1828 году. Под подозрением оказывалось не только вольнодумство, но и всё, что толковало веру иначе, чем Синод."
 concept_nr_parish_registers: "Метрические книги"
 concept_nr_parish_registers_desc: "Тридентский собор в 1563 году обязал католические приходы вести книги крещений и браков. В России ведение метрических книг стало обязательным с 1722 года: один экземпляр оставался в приходе, второй отсылался в консисторию. Консистории же решали дела о разводе, и до 1917 года развестись в России можно было только через духовный суд. Во Франции регистрацию передали мэриям в 1792 году, в Англии ввели гражданскую регистрацию в 1837-м. Там, где метрики остались за церковью, тот, кто не был ею крещён, для государства почти не существовал: браки старообрядцев в России получили гражданскую запись лишь в 1874 году."
 concept_nr_church_and_slavery: "Церковь и рабство"
 concept_nr_church_and_slavery_desc: "Французский Чёрный кодекс 1685 года требовал крестить рабов в католичество. В Бразилии церковь венчала рабов, и епархиальные уставы Баии 1707 года признавали их право на брак. В английских колониях всё было наоборот: закон Вирджинии 1667 года оговорил, что крещение не освобождает раба, — плантаторы боялись именно этого. Одни церкви освящали рабство как христианское попечение, другие боролись за его отмену: квакеры, английские евангелисты во главе с Уилберфорсом. В 1839 году папа Григорий XVI осудил работорговлю."
 concept_nr_church_tax: "Церковный налог"
 concept_nr_church_tax_desc: "Налог в пользу церкви, который собирает государство. В Германии он стал частью компромисса между церковью и государством: Веймарская конституция 1919 года (статья 137) закрепила за религиозными обществами право взимать налог по государственным налоговым спискам. Ещё в 1873 году Пруссия разрешила гражданский выход из церкви, и нежелание платить стало одной из его причин. В Англии в 1836 году церковную десятину перевели из натуральной повинности в денежную ренту."
 concept_nr_penitentiary: "Пенитенциарная система"
 concept_nr_penitentiary_desc: "Слово «пенитенциарный» происходит от латинского paenitentia — покаяние. Филадельфийские квакеры с 1787 года добивались тюремной реформы, и в 1829 году открылась тюрьма Eastern State Penitentiary с полной одиночной изоляцией: наедине с Библией преступник должен был раскаяться. Диккенс, побывав там в 1842 году, назвал такое заключение пыткой. В России с 1819 года действовало Попечительное о тюрьмах общество, при тюрьмах устраивались церкви."
 concept_nr_church_calendar: "Церковный календарь"
 concept_nr_church_calendar_desc: "Празднества XIX века превращали историю в литургию. Тысячелетие России в 1862 году отметили молебнами и памятником в Новгороде, трёхсотлетие дома Романовых в 1913 году — службами по всей стране. Церковь освящала «царские дни», юбилеи и победы, а воскресный отдых со временем вошёл в рабочее законодательство."
 concept_nr_seminarists: "Поповичи на гражданской службе"
 concept_nr_seminarists_desc: "В России XIX века дети духовенства, окончившие семинарии, массово шли в гражданскую службу: в семинариях учили латыни, риторике и дисциплине, а приходов на всех не хватало. Самый известный из них — Михаил Сперанский, сын сельского священника и выпускник Александро-Невской семинарии, ставший главным реформатором при Александре I."
 concept_nr_synod: "Синодальное управление"
 concept_nr_synod_desc: "В 1721 году Пётр I заменил патриаршество Святейшим синодом, а с 1722 года за ним надзирал светский обер-прокурор. При Константине Победоносцеве (1880–1905) эта должность стала фактически министерской. В Пруссии в 1850 году учредили Евангелический верховный церковный совет. В Османской империи после 1826 года ведомство шейх-уль-ислама получило постоянную канцелярию и вошло в государственный аппарат."
